name: PR-Parse-Container-SDK

# Parse-only guard for the SDK container compositions.
#
# avocado-distro.bb lives in the always-enabled meta-avocado layer, so it is
# parsed in every build. An unconditional `inherit` there (or any always-parsed
# recipe) can break a composition that does not enable the inherited class's
# layer -- e.g. the SDK container, which does not enable meta-avocado-distro --
# while every device build keeps passing. That is what happened with 258fa675d:
# the container target was unbuildable for months because nothing in CI parses
# it. This job parses the container compositions on every PR so that class of
# regression fails fast instead of silently.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: this job only checks out and parses.
permissions:
  contents: read

# Cancel superseded runs so a burst of `synchronize` pushes does not stack up.
concurrency:
  group: parse-container-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parse-container-sdk:
    # `bitbake -p` executes recipe-embedded Python (__anonymous, inline ${@...})
    # during parse, so this ran same-repo-only while it was on the persistent
    # self-hosted runner. On an ephemeral GitHub-hosted runner that is the
    # normal model for fork PRs -- the container is destroyed after the job and
    # `permissions: contents: read` grants it nothing -- so the guard is gone
    # and fork PRs are covered too.
    runs-on: ubuntu-latest
    container:
      image: avocadolinux/ci-build:ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: parse avocado-image-container (${{ matrix.arch }})
        shell: bash
        env:
          BB_GIT_SHALLOW: "1"
          SDKMACHINE: "x86_64"
          DISTRO_CODENAME: ""
          CI: "true"
        # No mirrors fragment: kas/ci/mirrors.yml is download/sstate/disk-monitor
        # tuning pointed at http://molcajete:30082, none of which a parse reads
        # and none of which resolves from a hosted runner. `bitbake -p` fetches
        # no sources; kas still clones the layers it needs.
        run: |
          . scripts/init-build kas/sdk/container-${{ matrix.arch }}.yml
          kas shell meta-avocado/kas/sdk/container-${{ matrix.arch }}.yml -c "bitbake -p"
      - name: avocado_distro tests (${{ matrix.arch }})
        shell: bash
        run: PYTHONPATH=meta-avocado/lib python3 -m unittest discover -s meta-avocado/tests
      # What a local build calls itself, resolved through kas the way a build
      # sees it. Empty values (as this job leaves them) must compose: the
      # generation for DISTRO_CODENAME, the layer's history for DISTRO_VERSION
      # and BUILD_ID. Values set by the caller, as release builds do, must pass
      # through untouched. Update the expected strings together with
      # AVOCADO_RELEASE_YEAR and AVOCADO_YOCTO_SERIES.
      #
      # kas runs its shell with a HOME of its own, so the runner's git config is
      # not read there; GITCONFIG_FILE is what kas copies into it. The checkout
      # belongs to the runner user and this job runs as root, so without it git
      # refuses the repository and the revision reads unknown. A shallow
      # checkout counts no history, so the count reads 0 here.
      - name: Identity composition (${{ matrix.arch }})
        shell: bash
        env:
          BB_GIT_SHALLOW: "1"
          SDKMACHINE: "x86_64"
          CI: "true"
        run: |
          set -eo pipefail
          printf '[safe]\n\tdirectory = *\n' > "$RUNNER_TEMP/kas-gitconfig"
          export GITCONFIG_FILE="$RUNNER_TEMP/kas-gitconfig"
          . scripts/init-build kas/sdk/container-${{ matrix.arch }}.yml
          k=meta-avocado/kas/sdk/container-${{ matrix.arch }}.yml
          # name=value lines, so a missing value fails by name instead of
          # shifting the others. Each getvar gets one retry: the first call in a
          # fresh shell can fail while the bitbake server starts. kas runs the
          # -c string through $SHELL, so it is pinned to /bin/sh here and the
          # script inside stays POSIX.
          resolve() {
            SHELL=/bin/sh DISTRO_CODENAME="$1" DISTRO_VERSION="$2" BUILD_ID="$3" kas shell "$k" -c '
              for v in DISTRO_CODENAME DISTRO_VERSION BUILD_ID; do
                val=$(bitbake-getvar --value "$v" 2>/dev/null || bitbake-getvar --value "$v")
                printf "%s=%s\n" "$v" "$(printf "%s\n" "$val" | tail -n 1)"
              done'
          }
          expect() {
            got=$(sed -n "s/^$1=//p" <<<"$2" | tail -n 1)
            if ! grep -Eq "^($3)\$" <<<"$got"; then
              echo "$1 resolved to '$got', expected $3"
              exit 1
            fi
            echo "$1 -> '$got'"
          }
          out=$(resolve "" "" "")
          expect DISTRO_CODENAME "$out" '2026-scarthgap/local'
          expect DISTRO_VERSION "$out" '2026\.0\+[0-9]+\.g[0-9a-f]{8}(\.dirty)?'
          expect BUILD_ID "$out" '[0-9]+\.g[0-9a-f]{8}(\.dirty)?'
          out=$(resolve "2026/edge" "2026.17" "17")
          expect DISTRO_CODENAME "$out" '2026/edge'
          expect DISTRO_VERSION "$out" '2026\.17'
          expect BUILD_ID "$out" '17'
