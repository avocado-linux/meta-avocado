CONFIG_EFI_PARTITION=y
CONFIG_PARTITION_TYPE_GUID=y

# Runtime DT overlay application (apply_overlays in the boot env): the `fdt`
# command + libfdt overlay support. Lets `fdt apply` stack .dtbo overlays onto
# the base DTB at boot. Harmless if the defconfig already enables them.
CONFIG_CMD_FDT=y
CONFIG_OF_LIBFDT_OVERLAY=y

# EFI capsule update is not Avocado's update path on these boards -- the OS and
# the bootloader are updated by stone/avocadoctl into A/B slots (imx_boot ->
# emmc-boot:0/1, activated by avocado-imx-bootpart). The Variscite defconfigs
# turn capsule authentication on, which makes lib/efi_loader/Makefile shell out
# to cert-to-efi-sig-list (efitools) against the vendor's placeholder CRT.crt.
# efitools is only packaged in meta-imx/meta-imx-sdk, a layer Avocado does not
# include, so the build dies at do_compile with
#   [lib/efi_loader/Makefile:86: capsule_esl_file] Error 127
# Turning the feature off is the honest fix: we would otherwise be signing
# capsules with a placeholder certificate for an update mechanism we never use.
# Nothing `select`s this symbol (plain bool + depends), so clearing it sticks.
# CONFIG_EFI_CAPSULE_AUTHENTICATE is not set
