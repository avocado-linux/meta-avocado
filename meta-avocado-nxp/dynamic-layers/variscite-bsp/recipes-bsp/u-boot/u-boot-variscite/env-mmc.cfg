# Enable bootcommand - required for NXP serial download boot detection.
# The compiled uboot.env overrides this bootcmd at runtime when booting
# from MMC, but during USB boot (no MMC env), the built-in bootcmd
# provides the fastboot entry point for uuu provisioning.
CONFIG_USE_BOOTCOMMAND=y
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
CONFIG_ENV_IS_NOWHERE=y
# U-Boot renamed this symbol: SYS_REDUNDAND_ENVIRONMENT no longer exists in
# 2026.04 (`config ENV_REDUNDANT` in env/Kconfig is the current name). Kconfig
# silently ignores an unknown symbol in a defconfig, so the old name left
# ENV_REDUNDANT off AND dropped CONFIG_ENV_OFFSET_REDUND below, whose dependency
# is "... && ENV_REDUNDANT".
#
# That combination is worse than it looks, because the u-boot-variscite bbappend
# sets MKENVIMAGE_EXTRA_ARGS = "-r": mkenvimage then writes the REDUNDANT layout
# (4-byte CRC + 1 flag byte + data) while a non-redundant U-Boot CRCs from byte 4
# and reads the flag byte as the first byte of data. The env is intact on disk
# and still fails its checksum, so U-Boot reports only
# "*** Warning - bad CRC, using default environment" and silently runs the
# vendor's built-in bsp_bootcmd instead of Avocado's -- which presents as a
# broken image rather than a misread environment.
#
# Verified on a DART-MX95 booted from eMMC: the env at CONFIG_ENV_OFFSET and its
# redundant copy both import cleanly with `env import -b <addr>+5` (the +5 skips
# CRC+flag), and the redundant copy carries the uuu-emmc devnum/mmcblk patches.
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x400000
CONFIG_ENV_OFFSET_REDUND=0x440000
CONFIG_ENV_IS_IN_MMC=y
