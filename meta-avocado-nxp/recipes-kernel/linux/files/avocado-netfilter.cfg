# Core netfilter framework
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_TABLES=m
CONFIG_NF_NAT=m

# IPv4 iptables
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_TARGET_REJECT=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_TARGET_MASQUERADE=m
CONFIG_IP_NF_MANGLE=m
# Docker 28 added "direct access filtering", which writes a raw-table
# PREROUTING DROP rule for every container it puts on the default bridge.
# Without the raw table, docker 29 fails every `docker run` at network setup
# with "can't initialize iptables table `raw'", leaving --network host as the
# only usable mode.
CONFIG_IP_NF_RAW=m

# IPv6 ip6tables
CONFIG_IPV6=y
CONFIG_IP6_NF_IPTABLES=m
CONFIG_IP6_NF_FILTER=m
CONFIG_IP6_NF_TARGET_REJECT=m
CONFIG_IP6_NF_NAT=m
CONFIG_IP6_NF_TARGET_MASQUERADE=m
CONFIG_IP6_NF_MANGLE=m
# Paired with CONFIG_IP_NF_RAW above: docker applies the same direct-access
# filtering rule to IPv6 when the daemon has IPv6 enabled.
CONFIG_IP6_NF_RAW=m

# nftables IPv4/IPv6
CONFIG_NF_TABLES_IPV4=m

# xt_* match/target extensions
CONFIG_NETFILTER_XT_CONNMARK=m
CONFIG_NETFILTER_XT_MATCH_CONNLIMIT=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_MATCH_DEVGROUP=m
CONFIG_NETFILTER_XT_MATCH_IPRANGE=m
CONFIG_NETFILTER_XT_MATCH_LIMIT=m
CONFIG_NETFILTER_XT_MATCH_MAC=m
CONFIG_NETFILTER_XT_MATCH_MARK=m
CONFIG_NETFILTER_XT_MATCH_STATE=m
CONFIG_NETFILTER_XT_MATCH_STRING=m
CONFIG_NETFILTER_XT_MATCH_TCPMSS=m
CONFIG_NETFILTER_XT_TARGET_HMARK=m
CONFIG_NETFILTER_XT_TARGET_LED=m
CONFIG_NETFILTER_XT_TARGET_LOG=m
CONFIG_NETFILTER_XT_TARGET_NETMAP=m
CONFIG_NETFILTER_XT_TARGET_NFLOG=m
CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
CONFIG_NETFILTER_XT_TARGET_TCPMSS=m

# IPVS (load balancing / advanced NAT)
CONFIG_IP_VS=m

# Multicast and advanced routing
CONFIG_IP_MULTICAST=y
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y

# conntrackd / NFLOG accounting
CONFIG_NETFILTER_NETLINK_ACCT=m
CONFIG_NF_CT_NETLINK=m
