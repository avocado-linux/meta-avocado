# dm-crypt/dm-verity themselves come from the shared avocado-security-kernel.inc
# fragments (required by linux-imx_%.bbappend for every i.MX kernel). This file
# keeps only what is board-specific: the CAAM job-ring drivers the LUKS2 /var
# key derivation uses on i.MX93.
CONFIG_CRYPTO_DEV_FSL_CAAM=y
CONFIG_CRYPTO_DEV_FSL_CAAM_JR=y
CONFIG_CRYPTO_DEV_FSL_CAAMHASH=y
CONFIG_CRYPTO_DEV_FSL_CAAM_SKCIPHER=y
