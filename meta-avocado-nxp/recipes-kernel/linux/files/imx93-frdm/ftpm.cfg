CONFIG_TCG_TPM=y
# Build the OP-TEE fTPM driver as a module, not built-in. This board's OP-TEE
# core is already unconditional (MACHINE_FEATURES carries "optee"), but the
# fTPM TA and the userspace pieces that load this module are an installable
# extension (ftpm-module-extension), not part of the default image - a
# built-in driver would probe fTPM at kernel init and fail on a device that
# never merges the extension. =m lets modprobe load it on demand once the
# extension activates.
CONFIG_TCG_FTPM_TEE=m
#
# CONFIG_TRUSTED_KEYS is deliberately left out of this fragment: dm-crypt.cfg
# already sets it =y for /var encryption's initramfs unlock path, and
# do_configure:append() concatenates fragments raw (no proper kconfig merge -
# see linux-imx_%.bbappend), so a later "is not set" line here would silently
# clobber that decision instead of composing with it.
