CONFIG_TCG_TPM=y
CONFIG_CRYPTO_HASH_INFO=y

# A module, not built-in. The fTPM's NV storage is REE-FS, which tee-supplicant
# services from userspace, so the driver cannot probe at kernel init - nothing
# is there to answer it yet. optee-ftpm-setup loads it from the initramfs once
# the supplicant is up (and blacklists the DT-modalias autoload that would
# otherwise fire too early).
CONFIG_TCG_FTPM_TEE=m

# Keep the fTPM out of the kernel hwrng pool. Every GetRandom crosses into the
# TEE, and the hwrng kthread holds tpm_mutex across a continuous loop of them -
# which starves systemd-cryptenroll's PCR-7 seal in the initramfs, where there
# is no timeout to recover from it.
# CONFIG_HW_RANDOM_TPM is not set
