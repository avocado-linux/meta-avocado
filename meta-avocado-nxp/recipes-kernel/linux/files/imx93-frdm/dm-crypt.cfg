# DM_CRYPT cannot exceed its parent: with BLK_DEV_DM=m (the imx defconfig's
# value) kconfig silently demotes DM_CRYPT=y to =m, and the fragment's headline
# symbol quietly does not take. Built-in is what the initrd unlock path wants -
# a module would have to be present in the initramfs and loaded before /var can
# be opened, which nothing in the boot flow arranges.
CONFIG_BLK_DEV_DM=y
# DM_CRYPT also depends on TRUSTED_KEYS, and kconfig caps a tristate at the
# weakest thing it depends on - so BLK_DEV_DM=y alone still left DM_CRYPT at =m
# while TRUSTED_KEYS stayed =m. Both parents have to be y for the child to be.
CONFIG_TRUSTED_KEYS=y
CONFIG_DM_CRYPT=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_SHA256=y
# CAAM job-ring drivers for i.MX93
CONFIG_CRYPTO_DEV_FSL_CAAM=y
CONFIG_CRYPTO_DEV_FSL_CAAM_JR=y
CONFIG_CRYPTO_DEV_FSL_CAAMHASH=y
CONFIG_CRYPTO_DEV_FSL_CAAM_SKCIPHER=y
