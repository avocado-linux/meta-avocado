# Drivers missing from linux-compulab's defconfig, built as modules so a
# carrier BSP extension can pull them in by package name. Only options that
# were unset are added here; nothing built in is changed.
#
# Microchip LAN87xx/LAN887x 100BASE-T1/1000BASE-T1 automotive Ethernet PHYs.
CONFIG_MICROCHIP_T1_PHY=m
# TDK InvenSense ICM-426xx/ICM-42688 6-axis IMUs over SPI (the I2C variant and
# the core driver are already modules).
CONFIG_INV_ICM42600_SPI=m
