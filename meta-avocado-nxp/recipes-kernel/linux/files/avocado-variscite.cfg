# Variscite (linux-variscite-imx) kernel deltas on top of the shared avocado-*.cfg.
# Named avocado-variscite.cfg (NOT variscite.cfg) to avoid shadowing any
# file://variscite*.cfg the linux-variscite recipe carries on FILESPATH.
#
# avocado-core.cfg sets CONFIG_ZRAM=m (DISTRO_FEATURES 'zram' makes
# packagegroup-avocado-{rootfs,initramfs}-modules pull kernel-module-zram).
# ZRAM depends on ZSMALLOC; ensure it's enabled so zram builds as a module.
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=m
