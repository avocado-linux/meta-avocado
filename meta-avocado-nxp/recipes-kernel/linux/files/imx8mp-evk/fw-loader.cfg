# No 60 s user-helper wait for firmware the rootfs does not have. Nothing in
# Avocado serves firmware through the sysfs helper (udev dropped that years
# ago), so the fallback only ever adds the timeout: mwifiex's optional
# nxp/rgpower_WW.bin held WiFi bring-up for a minute on every boot. Direct
# loads from /lib/firmware are unaffected; firmware the initramfs needs is
# shipped there (packagegroup-avocado-initramfs.bbappend).
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
