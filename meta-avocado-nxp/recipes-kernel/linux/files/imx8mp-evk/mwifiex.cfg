# Mainline Marvell/NXP mwifiex for the EVK's 88W8997 M.2 module (AW-CM276MA).
# NXP's out-of-tree moal/mlan dropped the 8997 at 6.18 and NXP's 6.18 firmware
# release ships no 8997 blobs; mwifiex + firmware-nxp-wifi-8997 is the route
# that still works. SDIO is the stock module's bus; PCIe covers the 8997 PCIe
# M.2 variant.
CONFIG_MWIFIEX=m
CONFIG_MWIFIEX_SDIO=m
CONFIG_MWIFIEX_PCIE=m
