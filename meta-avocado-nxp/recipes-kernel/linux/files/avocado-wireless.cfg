# RFKILL subsystem
CONFIG_RFKILL=m

# Common USB WiFi drivers
# Realtek rtw88 (RTL8822CU, RTL8821CU, etc. - very common USB dongles)
CONFIG_RTW88=m
CONFIG_RTW88_USB=m
CONFIG_RTW88_8822BU=m
CONFIG_RTW88_8822CU=m
CONFIG_RTW88_8821CU=m

# Ralink/MediaTek RT2800 USB (RT5370, RT5572 - common cheap USB dongles)
CONFIG_RT2X00=m
CONFIG_RT2800USB=m
CONFIG_RT2800_LIB=m
CONFIG_RT2X00_LIB=m
CONFIG_RT2X00_LIB_USB=m
CONFIG_RT2X00_LIB_FIRMWARE=y

# MediaTek MT76 USB (MT7601U, MT7612U - common USB dongles)
CONFIG_MT76_USB=m
CONFIG_MT76x02_USB=m
CONFIG_MT7601U=m

# Atheros ath9k_htc (AR9271 - common USB dongle)
CONFIG_ATH9K_HTC=m

# Additional USB Bluetooth drivers
CONFIG_BT_HCIBTUSB_RTL=y
CONFIG_BT_RTL=m
CONFIG_BT_ATH3K=m
