CONFIG_WIREGUARD=m

# NFS Server
CONFIG_NFSD=m
CONFIG_NFSD_V3=y
CONFIG_NFSD_V4=y

# Carrier-board peripherals, as modules so a BSP extension pulls them in by
# package name. Unset in the NXP kernel defconfigs we build, except that
# linux-compulab already has CONFIG_INV_ICM42600_I2C=m.
# Microchip LAN87xx/LAN887x 100BASE-T1/1000BASE-T1 automotive Ethernet PHYs.
CONFIG_MICROCHIP_T1_PHY=m
# TDK InvenSense ICM-426xx/ICM-42688-P 6-axis IMUs (core, I2C and SPI).
CONFIG_INV_ICM42600=m
CONFIG_INV_ICM42600_I2C=m
CONFIG_INV_ICM42600_SPI=m
