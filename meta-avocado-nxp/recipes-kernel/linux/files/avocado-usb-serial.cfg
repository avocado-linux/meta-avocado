# USB core infrastructure
CONFIG_USB=y
CONFIG_USB_COMMON=y
CONFIG_USB_DEVICE_CLASS=y
CONFIG_USB_DYNAMIC_MINORS=y

# USB serial subsystem
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=m

# Standard USB serial adapters
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_KEYSPAN=m
CONFIG_USB_SERIAL_MCT_U232=m

# Cellular/GSM/3G/4G/5G modems (beyond ACM)
CONFIG_USB_SERIAL_OPTION=m
CONFIG_USB_SERIAL_QUALCOMM=m
CONFIG_USB_SERIAL_SIERRAWIRELESS=m
CONFIG_USB_SERIAL_WWAN=m

# ACM-based modems (CDC class)
CONFIG_USB_ACM=m

# Common/legacy adapters
CONFIG_USB_SERIAL_DIGI_ACCELEPORT=m
CONFIG_USB_SERIAL_EDGEPORT=m
CONFIG_USB_SERIAL_GARMIN=m
CONFIG_USB_SERIAL_IR=m
CONFIG_USB_SERIAL_KLSI=m
CONFIG_USB_SERIAL_MOS7720=m
CONFIG_USB_SERIAL_MOS7840=m
CONFIG_USB_SERIAL_OMNINET=m
CONFIG_USB_SERIAL_SAFE=m
CONFIG_USB_SERIAL_SPCP8X5=m

# USB WDM and network (modems and debugging)
CONFIG_USB_WDM=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_RNDIS_HOST=m
