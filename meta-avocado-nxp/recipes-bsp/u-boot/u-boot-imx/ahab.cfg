# Support i.MX9 AHAB features (arch/arm/mach-imx/imx9/Kconfig).
#
# Pulls in arch/arm/mach-imx/ele_ahab.c, which is what lets SPL and U-Boot talk
# to the EdgeLock Enclave: extending the root of trust to the next container,
# and reading the authentication event log. Without it there is no
# `ahab_status`, so a signed image cannot be checked on an open part before any
# fuse is burned - which is the only safe order to do this in.
#
# The symbol sits under `if ARCH_IMX9` with no `depends on`, so it takes as
# written. Verify against the produced .config anyway, never against this file.
CONFIG_AHAB_BOOT=y
