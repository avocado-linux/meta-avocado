# Enable bootcommand - required for NXP serial download boot detection.
# The compiled uboot.env overrides this bootcmd at runtime when booting
# from MMC, but during USB boot (no MMC env), the built-in bootcmd
# provides the fastboot entry point for uuu provisioning.
CONFIG_USE_BOOTCOMMAND=y
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
CONFIG_ENV_IS_NOWHERE=y
# Both spellings are required because this fragment is shared by every NXP
# board. U-Boot renamed SYS_REDUNDAND_ENVIRONMENT to ENV_REDUNDANT, so the old
# name is the live one on the 2024.04 BSP (imx8mp-evk, imx91-frdm, imx93-evk,
# imx95-frdm) and the new one on 2026.04 (imx93-frdm). Whichever name the tree
# does not define is dropped by "make oldconfig" without a warning - the same
# silent drop that hid this from the imx93-frdm build until now - so carrying
# both is inert on either version rather than merely tolerated.
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x400000
CONFIG_ENV_OFFSET_REDUND=0x440000
CONFIG_ENV_IS_IN_MMC=y
