# Enable FIT signature verification so U-Boot refuses a kernel/DTB/initramfs
# whose signature does not match the embedded public key. Opt-in via the
# 'verified-boot' DISTRO_FEATURES token (see u-boot-imx_%.bbappend). Base FIT
# container support (CONFIG_FIT) is unconditional for every board and lives
# in fit.cfg instead - only signature verification is gated here.
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
CONFIG_RSA_VERIFY=y
CONFIG_SHA256=y

# Signature verification on the FIT path is not sufficient on its own: the
# environment lives in the unsigned, writable uboot-env partition
# (CONFIG_ENV_IS_IN_MMC=y in the vendor defconfig), so offline write access to
# the card is enough to rewrite bootcmd and boot an unsigned kernel without
# touching the FIT at all. Closing that path is board work - a compiled-in boot
# flow plus a permit list for the saved environment - carried by
# env-compiled-in.cfg / env-writeable-list.cfg / env-writeable-list.patch for
# the boards that have it (imx93-frdm today), not by this fragment.
