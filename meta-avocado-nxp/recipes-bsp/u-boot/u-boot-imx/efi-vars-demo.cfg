# DEMO ONLY. Unauthenticated UEFI variable storage.
#
# This puts non-volatile UEFI variables in /ubootefi.var on the EFI system
# partition (lib/efi_loader/Kconfig: "Store non-volatile UEFI variables as
# file"). That is enough to bring up efivarfs and let userspace read a
# SecureBoot value, which is the whole point of the demo - a device booting
# bootm on a FIT can report nothing at all, and this is the first configuration
# where it can report something.
#
# WHAT THIS IS NOT. The file sits on a FAT partition. Anyone who can write the
# boot medium can edit it, so nothing read back through it is evidence of
# anything an attacker could not have arranged. The real capability stores
# variables through StandAloneMM in the secure world, which authenticates them;
# that route needs RPMB, RPMB is an eMMC feature, and this board boots from SD.
#
# The trap this file exists to avoid is a specific misreading, not a general
# one: variables here DO survive a reboot, because a file on the ESP persists.
# A value seen surviving a power cycle looks like a value that was protected.
# It was not. The missing property is tamper-resistance, not persistence.
#
# CONFIG_EFI_VARIABLE_FILE_STORE and CONFIG_EFI_MM_COMM_TEE are alternatives in
# one Kconfig `choice` ("Store for non-volatile UEFI variables"), so selecting
# one deselects the other by construction - two stores cannot coexist. Both
# lines are written out anyway. The NXP stock defconfig sets MM_COMM_TEE=y, so
# without the explicit negation the only record that this fragment turns it off
# would be Kconfig's implicit choice semantics, and a reader diffing .config
# would find MM_COMM_TEE silently gone with nothing in the layer accounting for
# it.
CONFIG_EFI_VARIABLE_FILE_STORE=y
# CONFIG_EFI_MM_COMM_TEE is not set

# EFI_VARIABLE_FILE_STORE depends on FAT_WRITE. Confirmed present in the
# produced .config for this machine rather than assumed - but stated here so
# that a board which does not carry it fails on the dependency instead of
# quietly getting no variable store.
CONFIG_FAT_WRITE=y
