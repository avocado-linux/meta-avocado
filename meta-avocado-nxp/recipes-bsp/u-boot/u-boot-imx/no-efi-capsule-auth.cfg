# Turn off EFI capsule authentication, which NXP's FRDM defconfigs enable and
# nothing here uses.
#
# It is not free to leave on. lib/efi_loader/Makefile:86 generates an ESL from
# CONFIG_EFI_CAPSULE_CRT_FILE by shelling out to `cert-to-efi-sig-list`, a host
# tool no recipe provides: efitools-native lives in meta-imx/meta-imx-sdk, which
# is not in bblayers, and the symbol is in neither HOSTTOOLS nor oe-core's
# HOSTTOOLS_NONFATAL. A clean workspace therefore fails do_compile with
# "cert-to-efi-sig-list: command not found". Builds that appeared to work were
# resolving it through a stale tmp/hosttools symlink left by an earlier
# local.conf, which is a per-machine accident rather than a build input.
#
# Nothing in Avocado delivers capsule updates - this platform boots booti under
# AHAB and updates through stone's A/B slots - so the authentication path is
# unconfigured and untested. An unused signature path that no one verifies is
# worth less than the host dependency it costs.
#
# EFI_CAPSULE_AUTHENTICATE is a plain bool with only `depends on` clauses
# (lib/efi_loader/Kconfig:335), so nothing selects it back on. Verify against
# the produced .config anyway, never against this file.
# CONFIG_EFI_CAPSULE_AUTHENTICATE is not set
