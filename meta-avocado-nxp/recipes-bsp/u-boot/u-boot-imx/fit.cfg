# Unconditional base FIT container support for every u-boot-imx board. A FIT
# machine's boot partition manifest and U-Boot env boot command always bootm
# a single FIT now (signed or not), so U-Boot must always be able to parse a
# FIT container regardless of whether 'verified-boot' selects signature
# verification. See fit-verify.cfg for the feature-gated verification bits.
CONFIG_FIT=y
# bootm inflates the gzipped kernel subimage into a buffer of this size and
# aborts with "inflate() returned -5 / Image too large" when the uncompressed
# Image exceeds it. NXP's imx8m defconfigs pin it to 0x2000000 (32 MiB); the
# 6.18 imx_v8_defconfig Image is 33.8 MiB, so imx8mp-evk boot-looped on the
# first FIT pass. 0x4000000 (64 MiB) is U-Boot's own ARM64 default and the value
# imx93-frdm was hardware-verified with. It only ever has to cover the kernel:
# the initramfs stays a separate ramdisk node (INITRAMFS_IMAGE_BUNDLE=0), so its
# growth is not charged here. Both FIT boards load the FIT far above
# entry+64 MiB (imx8mp: 0x40480000 vs 0x80200000; imx93: 0x80400000 vs
# 0x90000000), so the larger inflate window cannot run into the FIT source.
CONFIG_SYS_BOOTM_LEN=0x4000000
