# Honour only permit-listed variables from the SAVED environment; everything
# else falls back to the compiled-in default, which ships inside the signed
# bootloader. Closes the offline bypass of rewriting bootcmd in the writable
# uboot-env partition.
#
# Board-scoped, NOT part of fit-verify.cfg: the permit list itself is
# CFG_ENV_FLAGS_LIST_STATIC, a C #define that env-writeable-list.patch adds to
# include/configs/imx93_frdm.h, and the boot flow it protects is compiled in by
# env-compiled-in.cfg for that board only. With this symbol on and no list, NO
# saved variable is honoured - avocado_boot_slot included - and a board whose
# Avocado boot flow still lives in the saved environment falls back to the
# stock bootcmd and does not boot Avocado at all. A board adopts this fragment
# only together with its own compiled-in env and permit list.
#
# CONFIG_ENV_WRITEABLE_LIST selects ENV_APPEND, so the environment hash table
# becomes append-only.
CONFIG_ENV_WRITEABLE_LIST=y
