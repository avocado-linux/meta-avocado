# Compile the initial UEFI key database into the U-Boot binary.
#
# CONFIG_EFI_VARIABLES_PRESEED takes a pre-built variable store and links it
# into the bootloader image. Its Kconfig help states that when it is set,
# "changes to authentication related variables (PK, KEK, db, dbx) are not
# allowed".
#
# That immutability is the point of this fragment, not a side effect of it.
# Without preseed, the key database lives in /ubootefi.var on the FAT ESP
# alongside every other non-volatile variable (see efi-vars-poc.cfg), and
# anyone able to write the boot medium can replace the keys the firmware will
# trust. With preseed, the key database ships inside the bootloader and cannot
# be replaced at runtime, nor by editing that file. Read this fragment as the
# thing that moves PK/KEK/db/dbx OUT of the editable store - not as a tuning
# knob for where variables happen to be kept.
#
# WHAT THIS IS NOT. The bootloader itself is still unauthenticated on this
# part. AHAB is open and cannot be closed on the bench board (its SRK_HASH fuse
# is already burned byte-swapped), so nothing verifies U-Boot before it runs.
# An attacker who can rewrite the boot medium replaces the whole bootloader,
# seed and all, and the keys are then whatever they chose. `rot_state` stays
# `unauthenticated` after this change, and that is the correct report - the
# immutability above is immutability against runtime writes and against editing
# /ubootefi.var, not against replacing the binary that holds it.
CONFIG_EFI_VARIABLES_PRESEED=y

# The seed file, resolved by lib/efi_loader/Makefile as
# $(srctree)/$(EFI_VAR_SEED_FILE) - a path relative to the U-Boot SOURCE tree,
# NOT the deploy directory. The recipe is responsible for staging the generated
# file at that location before do_compile; naming it here without staging it
# leaves the default pointing at nothing in the source tree and the build fails
# at link time rather than producing a bootloader with an empty database.
CONFIG_EFI_VAR_SEED_FILE="ubootefi.var"

# The symbol that makes any of the above mean anything. efi_image_authenticate()
# is compiled only under EFI_SECURE_BOOT, so without it `bootefi` loads whatever
# it is handed and an enrolled key database is decoration.
#
# Asserted here even though the pinned vendor defconfig
# (configs/imx93_11x11_frdm_defconfig) already sets it, because THAT is the
# problem: enforcement currently rides on a vendor default this layer neither
# owns nor checks. A u-boot-imx version bump that drops it would leave every
# build-time gate in this change passing - the seed still stages, db.fingerprint
# is still written, the payload is still signed, the on-device record still says
# keydb_origin=firmware-resident - while the firmware admits any payload. The
# only thing that would catch it is the HITL signed-payload assertion, which is
# not a build gate.
#
# Its Kconfig is `depends on EFI_LOADER && FIT_SIGNATURE`. FIT_SIGNATURE is
# carried by fit-verify.cfg under the SEPARATE verified-boot token, so a
# boot-integrity-poc build without verified-boot cannot select this symbol at
# all and relies entirely on the defconfig for both. Naming it here does not fix
# that coupling; it makes the dependency explicit and makes a silent loss show
# up as a merge_config warning against a symbol this fragment requested.
CONFIG_EFI_SECURE_BOOT=y

# Preseed and the file store are not alternatives. In the pinned U-Boot 2026.04
# Kconfig, EFI_VARIABLES_PRESEED depends only on !COMPILE_TEST and
# !EFI_MM_COMM_TEE, so it coexists with the CONFIG_EFI_VARIABLE_FILE_STORE that
# efi-vars-poc.cfg sets: the seed supplies the authentication variables, the
# file store still backs everything else. This fragment therefore does not
# restate the store selection, and it deliberately leaves EFI_MM_COMM_TEE
# alone: enabling that symbol is the one change in this area that would
# disable preseed outright, and it is already negated in efi-vars-poc.cfg for
# a different reason.
