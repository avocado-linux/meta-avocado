image boot.vfat {
	vfat {
		files = {
			"avocado-image-initramfs-@MACHINE@.cpio.zst",
			"Image"
		}
	}
  size = 128M
}

image @IMAGE@ {
	hdimage {
	}

	partition imx-boot {
		in-partition-table = false
		image = "imx-boot.tagged"
		offset = @IMX_BOOT_SEEK@
	}

	partition boot {
		image = "boot.vfat"
		bootable = "true"
		offset = 8M
	}

	partition rootfs {
		image = "avocado-image-rootfs-@MACHINE@.rootfs.squashfs"
		offset = 136M
	}

	partition var {
		image = "@VAR-IMG@"
		partition-type = 0x8300
	}
}
