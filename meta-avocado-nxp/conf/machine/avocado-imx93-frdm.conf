#@TYPE: Machine
#@NAME: NXP i.MX 93 FRDM
#@DESCRIPTION: NXP i.MX 93 FRDM development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx93-frdm:imx93-11x11-lpddr4x-frdm:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc
require conf/machine/include/avocado-imx-frdm.inc

require conf/machine/imx93-11x11-lpddr4x-frdm.conf
require conf/machine/include/fsl-imx-preferred-env.inc

MACHINE_FEATURES:append = " optee"

# ftpm and tpm2 join encrypted-var here because this branch is the one that
# wires them up, and each token is now backed by something in-tree:
#   ftpm  - kas/feature/ftpm.yml appends optee-ftpm to MACHINE_FEATURES, which
#           is what packagegroup-avocado-initramfs gates optee-ftpm-init on, and
#           that recipe's COMPATIBLE_MACHINE now names this machine. The TA
#           itself comes from meta-arm's optee-ftpm, folded into BL32 via the
#           optee-os bbappend that the same fragment pulls in.
#   tpm2  - ftpm.yml includes kas/feature/tpm.yml, which puts tpm2 into
#           DISTRO_FEATURES, so the ConfigParsed check requires it declared.
#           The fTPM is what presents the interface; systemd is built with tpm2
#           and the libcryptsetup token plugin to use it.
#
# ahab stays off this list. It is not wired up here and lives on
# imx93-ahab-secure-boot; declaring it would be false on this branch even
# though the hardware supports it. Extend the declaration on the branch that
# delivers the capability, never ahead of it.
AVOCADO_SECURITY_CAPABILITIES = "encrypted-var ftpm tpm2"

# Point /var at the dm-crypt mapping when encrypted-var is on, exactly as both
# qemu machines already do. Without this the machine falls through to the
# base-files default (PARTUUID=4d21b016-...), so cryptsetup-var would format and
# open the container in the initrd while fstab still pointed /var at the raw
# partition - encryption present on disk, and nothing mounting it. This is the
# only encrypted-var target that was missing the line, which is why the
# qemuarm64 proxy passed and the board pass could not.
AVOCADO_VAR_PART_DEV = "${@bb.utils.contains('DISTRO_FEATURES', 'encrypted-var', '/dev/mapper/var', '/dev/disk/by-partlabel/var', d)}"

UBOOT_ENV_SIZE = "0x20000"
