#@TYPE: Machine
#@NAME: NXP i.MX 93 FRDM
#@DESCRIPTION: NXP i.MX 93 FRDM development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx93-frdm:imx93-11x11-lpddr4x-frdm:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc
require conf/machine/include/avocado-imx-frdm.inc

require conf/machine/imx93-11x11-lpddr4x-frdm.conf
require conf/machine/include/fsl-imx-preferred-env.inc

# Without this pin, u-boot-imx floats to the newest available provider
# (2026.04, meta-imx-bsp) over the older 2025.04 (meta-freescale). That
# version's default defconfig enables CONFIG_EFI_CAPSULE_AUTHENTICATE, which
# needs cert-to-efi-sig-list (efitools) to build lib/efi_loader's
# capsule_esl_file target - nothing in this layer set provides efitools, so
# do_compile fails with "oe_runmake failed" the moment sstate is invalidated
# for this recipe. Sibling board avocado-imx95-frdm.conf already pins the
# same version for the same reason (see its own PREFERRED_VERSION_u-boot-imx).
PREFERRED_VERSION_u-boot-imx = "2025.04"

# This machine deliberately does NOT override INITRAMFS_IMAGE_BUNDLE, so the
# distro default in conf/distro/avocado.conf ("0") applies and the initramfs
# rides in the FIT as its own signed ramdisk-1 node rather than being folded
# into the kernel image.
#
# An earlier revision of this file set INITRAMFS_IMAGE_BUNDLE = "1" here. That
# bundled a 134 MiB uncompressed initramfs into the kernel, giving a single
# 167.9 MiB decompression target - past CONFIG_SYS_BOOTM_LEN on both the
# board's u-boot (0x8000000) and our own build (0x4000000), so bootm aborted
# with "Image too large: increase CONFIG_SYS_BOOTM_LEN" on hardware. Keeping
# the two payloads separate drops what bootm inflates to the bare 33.9 MiB
# kernel, which fits the existing limit and needs no Kconfig change.
#
# It is also the better place for the cap to sit long-term: bundling charges
# CONFIG_SYS_BOOTM_LEN for the initramfs, which is the component that grows as
# cryptsetup, fTPM and dm-verity tooling land in it. Unbundled, the limit only
# ever has to cover the kernel and initramfs growth is unbounded by it.
#
# Signature coverage is unchanged, which is the property that matters here:
# oe/fitimage.py appends "ramdisk" to the configuration node's sign_entries
# alongside "kernel" and "fdt", so the initramfs is authenticated by the same
# configuration-node signature either way.

# FIT signing is gated here, not per-recipe: avocado-imx93-frdm-fitimage.bb
# (kernel-fit-image.bbclass) and u-boot-imx_%.bbappend (uboot-sign.bbclass)
# are two DIFFERENT recipes with two separate datastores, and both need to
# see the same verified-boot decision. A machine-conf variable is resolved
# before any recipe parses, so it's the one place both recipes read the same
# value from - a recipe-local d.setVar() in either bbappend would be invisible
# to the other. "0", not "" - kernel-fit-image.bbclass passes this through
# oe.types.boolean(), which raises ValueError on anything outside its
# explicit token list ('0'/'1'/'yes'/'no'/...); an empty string is NOT
# accepted as falsy there, confirmed by a real build.
UBOOT_SIGN_ENABLE = "${@bb.utils.contains('DISTRO_FEATURES', 'verified-boot', '1', '0', d)}"
UBOOT_SIGN_KEYDIR = "${@bb.utils.contains('DISTRO_FEATURES', 'verified-boot', d.getVar('AVOCADO_SB_KEYS_DIR') or '', '', d)}"
UBOOT_SIGN_KEYNAME = "${@bb.utils.contains('DISTRO_FEATURES', 'verified-boot', 'FIT', '', d)}"

# kernel-fit-image.bbclass defaults these three to "${UBOOT_SIGN_ENABLE}" etc.
# via a weak `?=`, but on avocado-imx93-frdm-fitimage.bb's own datastore that
# weak default resolved to an empty string rather than inheriting
# UBOOT_SIGN_ENABLE's value, crashing do_compile with oe.types.boolean('').
# Setting them explicitly and strongly here removes the weak-default
# resolution from the picture entirely - confirmed by a real build: `mkimage
# -l` on the produced fitImage now shows `Sign algo: sha256,rsa2048:FIT` on
# its configuration node, which was absent before this fix.
FIT_KERNEL_SIGN_ENABLE = "${UBOOT_SIGN_ENABLE}"
FIT_KERNEL_SIGN_KEYDIR = "${UBOOT_SIGN_KEYDIR}"
FIT_KERNEL_SIGN_KEYNAME = "${UBOOT_SIGN_KEYNAME}"

MACHINE_FEATURES:append = " optee"

# encrypted-var is unconditional here; ftpm is DERIVED rather than asserted.
#
# ftpm is real on this board only when kas/feature/ftpm.yml is in the build: it
# is the fragment that puts meta-arm in the layer set (the TA and the optee-os
# bbappend that folds it into BL32 both live there) and appends optee-ftpm to
# MACHINE_FEATURES. A default build of this machine has neither, so a
# hand-written "ftpm" token would claim a capability that does not exist - and
# would be indistinguishable, to anything reading the declaration at runtime,
# from a board where it does.
#
# Deriving it from MACHINE_FEATURES keeps the declaration true under both build
# configurations without a second place to maintain, which is the same principle
# task 1.1 applies when it generates /etc/avocado-security-capabilities FROM
# this variable rather than from a hand-kept copy. optee-ftpm-init.bb asserts
# the pairing in the other direction: feature on, token missing, parse fails.
#
# tpm2 rides the same condition as ftpm, and is derived from MACHINE_FEATURES
# rather than from DISTRO_FEATURES. kas/feature/ftpm.yml includes
# kas/feature/tpm.yml, which appends tpm2 to DISTRO_FEATURES, and the bbclass
# refuses any requested security feature the machine has not declared - so the
# token has to be here. Deriving it from the tpm2 request itself would make that
# refusal tautological: the declaration would agree with the request by
# construction and the check could never fire. Keying on optee-ftpm instead
# keeps it live, because on this board the fTPM is the only thing that presents
# a TPM2 interface - so tpm2 requested WITHOUT optee-ftpm (someone expecting a
# discrete TPM this board does not have) still refuses, which is the mismatch
# worth catching. Two claims, one fact: ftpm names the implementation, tpm2 the
# interface it presents, exactly as avocado-qemuarm64.conf explains for itself.
#
# ahab is still deliberately absent. This file carries no AHAB content, that
# work lives on imx93-ahab-secure-boot, and unlike ftpm there is no feature
# fragment here to derive it from.
AVOCADO_SECURITY_CAPABILITIES = "encrypted-var${@bb.utils.contains('MACHINE_FEATURES', 'optee-ftpm', ' ftpm tpm2', '', d)}"

# Point /var at the dm-crypt mapping when encrypted-var is on, exactly as both
# qemu machines already do. Without this the machine falls through to the
# base-files default (PARTUUID=4d21b016-...), so cryptsetup-var would format and
# open the container in the initrd while fstab still pointed /var at the raw
# partition - encryption present on disk, and nothing mounting it. This is the
# only encrypted-var target that was missing the line, which is why the
# qemuarm64 proxy passed and the board pass could not.
AVOCADO_VAR_PART_DEV = "${@bb.utils.contains('DISTRO_FEATURES', 'encrypted-var', '/dev/mapper/var', '/dev/disk/by-partlabel/var', d)}"

UBOOT_ENV_SIZE = "0x20000"
