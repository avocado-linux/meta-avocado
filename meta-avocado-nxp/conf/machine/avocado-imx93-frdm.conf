#@TYPE: Machine
#@NAME: NXP i.MX 93 FRDM
#@DESCRIPTION: NXP i.MX 93 FRDM development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx93-frdm:imx93-11x11-lpddr4x-frdm:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc
require conf/machine/include/avocado-imx-frdm.inc

require conf/machine/imx93-11x11-lpddr4x-frdm.conf
require conf/machine/include/fsl-imx-preferred-env.inc

# Override the layer-wide u-boot-imx pin back to 2026.04 for this machine only.
#
# avocado-imx.inc:10 sets PREFERRED_VERSION_u-boot-imx = "2025.04" for every
# i.MX machine, because 2026.04's stock defconfigs enable
# CONFIG_EFI_CAPSULE_AUTHENTICATE (whose ESL step needs cert-to-efi-sig-list,
# which no recipe in this layer set provides) and USB DFU, and do_compile fails
# on boards that carry neither fix. That is the right default for a board nobody
# has fixed; it is the wrong answer here, where both are already turned off at
# source by no-efi-capsule-auth.cfg and disable-unused-vendor-features.cfg.
#
# This is a REQUIREMENT, not a preference. The compiled-in environment selects
# its source with CONFIG_ENV_SOURCE_FILE, which resolves against
# board/$(SYS_VENDOR)/$(SYS_BOARD) - board/nxp/imx93_frdm on 2026.04, but
# board/freescale/imx93_frdm on 2025.04. u-boot-imx_%.bbappend refuses to build
# rather than silently produce a bootloader with no Avocado boot flow in it, so
# on 2025.04 this machine does not build at all.
#
# A downgrade is also destructive in its own right: 2025.04 carries
# CONFIG_SYS_BOOTM_LEN=0x4000000 against 2026.04's 0x8000000, halving the bootm
# budget for the FIT. One bootloader flash under the old pin produced a board
# that ran SPL and never reached U-Boot, recoverable only over uuu serial
# download (2026-08-25).
#
# Placed after the requires above on purpose - avocado-imx.inc is pulled in at
# line 10, so an assignment before it would be overwritten by the layer-wide
# value rather than overriding it.
#
# EFI capsule update is wanted on other hardware later. Re-enabling it is a
# per-machine decision that needs efitools-native available first
# (meta-imx/meta-imx-sdk carries it, and is not currently in bblayers).
PREFERRED_VERSION_u-boot-imx = "2026.04"

require conf/machine/include/avocado-imx-fit.inc

# Pin the FIT's default configuration node rather than inheriting list order.
# oe-core defaults FIT_CONF_DEFAULT_DTB to "", and oe/fitimage.py then picks
# configurations.sub_nodes[0] - the first KERNEL_DEVICETREE entry. That ordering
# is set by meta-freescale's imx93-evk.inc and then extended by meta-imx-frdm
# with eight board variants (-8mic, -aud-hat, -ld, -lpuart, -mt9m114, -ov5640,
# -root, -tianma-wvga-panel), so a BSP bump that reorders the list, or any layer
# landing a KERNEL_DEVICETREE:prepend, would silently boot a wrong-pinmux DTB
# with no build error and no boot message naming it. The old env pinned this
# explicitly via devicetree_file; this restores that guarantee for the FIT path.
FIT_CONF_DEFAULT_DTB = "imx93-11x11-frdm.dtb"

MACHINE_FEATURES:append = " optee"

# encrypted-var is unconditional here; ftpm is DERIVED rather than asserted.
#
# ftpm is real on this board only when kas/feature/ftpm.yml is in the build: it
# is the fragment that puts meta-arm in the layer set (the TA and the optee-os
# bbappend that folds it into BL32 both live there) and appends optee-ftpm to
# MACHINE_FEATURES. A default build of this machine has neither, so a
# hand-written "ftpm" token would claim a capability that does not exist - and
# would be indistinguishable, to anything reading the declaration at runtime,
# from a board where it does.
#
# Deriving it from MACHINE_FEATURES keeps the declaration true under both build
# configurations without a second place to maintain, which is the same principle
# task 1.1 applies when it generates /etc/avocado-security-capabilities FROM
# this variable rather than from a hand-kept copy. optee-ftpm-init.bb asserts
# the pairing in the other direction: feature on, token missing, parse fails.
#
# tpm2 rides the same condition as ftpm, and is derived from MACHINE_FEATURES
# rather than from DISTRO_FEATURES. kas/feature/ftpm.yml includes
# kas/feature/tpm.yml, which appends tpm2 to DISTRO_FEATURES, and the bbclass
# refuses any requested security feature the machine has not declared - so the
# token has to be here. Deriving it from the tpm2 request itself would make that
# refusal tautological: the declaration would agree with the request by
# construction and the check could never fire. Keying on optee-ftpm instead
# keeps it live, because on this board the fTPM is the only thing that presents
# a TPM2 interface - so tpm2 requested WITHOUT optee-ftpm (someone expecting a
# discrete TPM this board does not have) still refuses, which is the mismatch
# worth catching. Two claims, one fact: ftpm names the implementation, tpm2 the
# interface it presents, exactly as avocado-qemuarm64.conf explains for itself.
#
# ahab is still deliberately absent. This file carries no AHAB content, that
# work lives on imx93-ahab-secure-boot, and unlike ftpm there is no feature
# fragment here to derive it from.
AVOCADO_SECURITY_CAPABILITIES = "encrypted-var${@bb.utils.contains('MACHINE_FEATURES', 'optee-ftpm', ' ftpm tpm2', '', d)}"

# Point /var at the dm-crypt mapping when encrypted-var is on, exactly as both
# qemu machines already do. Without this the machine falls through to the
# base-files default (PARTUUID=4d21b016-...), so cryptsetup-var would format and
# open the container in the initrd while fstab still pointed /var at the raw
# partition - encryption present on disk, and nothing mounting it. This is the
# only encrypted-var target that was missing the line, which is why the
# qemuarm64 proxy passed and the board pass could not.
AVOCADO_VAR_PART_DEV = "${@bb.utils.contains('DISTRO_FEATURES', 'encrypted-var', '/dev/mapper/var', '/dev/disk/by-partlabel/var', d)}"

UBOOT_ENV_SIZE = "0x20000"

# AHAB. Set here rather than defaulted in the class: signing with the wrong
# SPSDK family or dtb succeeds and produces an image the board rejects, so both
# are per-machine and the build refuses when either is missing.
AVOCADO_AHAB_FAMILY = "mimx9352"
AVOCADO_KERNEL_DTB = "imx93-11x11-frdm.dtb"

# The container signs what it carries, and booti takes its ramdisk from argv[1]
# without ever authenticating it - container_get_image_dst() returns only the
# first exec and first data image, so a second data payload would be verified
# and then never found. Bundling the initramfs into the Image puts it inside
# the exec payload instead, which removes the separate load entirely.
#
# Carrying it as its own payload and keeping the argv[1] load for its size does
# not work: ${filesize} would still come from the unauthenticated on-disk copy,
# and a larger one leaves attacker bytes past the verified region that a
# concatenated cpio can use to replace files in the initrd.
INITRAMFS_IMAGE_BUNDLE = "${@bb.utils.contains('DISTRO_FEATURES', 'ahab', '1', '', d)}"
