#@TYPE: Machine
#@NAME: Variscite DART-MX8M-PLUS
#@DESCRIPTION: Variscite DART-MX8M-PLUS i.MX8M Plus SOM on the Sonata-Board devkit

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx8mp-var-dart:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc

UBOOT_ENV_SIZE = "0x20000"

# Variscite's DART-MX8M-PLUS machine (linux-variscite + u-boot-variscite, NXP
# BSP base), from the vendored meta-variscite-bsp-imx layer. Upstream this one
# machine covers the whole i.MX8MP SOM line (DART-MX8M-PLUS *and*
# VAR-SOM-MX8M-PLUS); the SOM/carrier variants are device-tree selectable at
# boot, not separate MACHINEs -- so VAR-SOM (SODIMM) / Symphony support is a
# future bsp-* extension on this same machine, not a new target.
require conf/machine/imx8mp-var-dart.conf

# The shared avocado-stone.bbappend does `do_compile[depends] +=
# ${IMX_DEFAULT_BOOTLOADER}:do_deploy`. variscite.inc sets
# PREFERRED_PROVIDER_virtual/bootloader = u-boot-variscite but leaves
# IMX_DEFAULT_BOOTLOADER at imx-base.inc's mx8 default (u-boot-imx, which we do
# not build). Pin it to the bootloader we actually build.
IMX_DEFAULT_BOOTLOADER = "u-boot-variscite"

# Use the NXP-BSP Variscite kernel (linux-imx-based) instead of the FSLC default
# (variscite.inc sets PREFERRED_PROVIDER_virtual/kernel ?= linux-variscite-fslc-imx).
# The NXP kernel carries the Vivante galcore + imx-gpu-viv userspace that the
# shared NXP-BSP packagegroups are version-matched to (GL/Wayland, and the
# mx8mp-nxp-bsp-gated packagegroup-avocado-imx-ml VIP9000 NPU stack).
PREFERRED_PROVIDER_virtual/kernel = "linux-variscite-imx"

# variscite.inc forces KERNEL_IMAGETYPE = Image.gz for mx8-nxp-bsp. The Avocado
# u-boot boot env (avocado-imx8mp-var-dart.txt) loads the kernel and `booti`s it
# directly, which needs a raw arm64 Image, not a gzip. Build/deploy the
# uncompressed Image (matches the CompuLab/EVK boot flow).
KERNEL_IMAGETYPE = "Image"

# Narrow Variscite's ~70-entry KERNEL_DEVICETREE (every SOM x carrier x camera
# combo) to the DART-MX8M-PLUS on the Sonata-Board -- the carrier Variscite's
# current DART-MX8M-PLUS dev kit (VAR-STK/DVK-DT8M-PLUS) ships on, and the
# default, overridable carrier here. The bare SOM and other carriers (the legacy
# DT8MCustomBoard, the VAR-SOM/Symphony SODIMM, SMARC) are selected via their own
# bsp-* carrier extensions, so users can start from just the SOM target and
# override the DTB.
#   *-sonata      : current DART rev on the Sonata-Board (default DTB)
#   *-1.x-sonata  : legacy DART SOM rev 1.x on the Sonata-Board
#   *-sonata-m7   : Cortex-M7 co-processor variant (RPMsg / remoteproc)
KERNEL_DEVICETREE = " \
    freescale/imx8mp-var-dart-sonata.dtb \
    freescale/imx8mp-var-dart-1.x-sonata.dtb \
    freescale/imx8mp-var-dart-sonata-m7.dtb \
"

# packagegroup-avocado-imx-extra pulls the NXP 88W8997 wlan driver/firmware,
# which the DART does not use (its WiFi/BT is the NXP IW612 via the nxpiw612-sdio
# MACHINE_FEATURE + iw612-utils, set by variscite.inc). Drop it and substitute
# the Variscite variant. The append is injected by kas/vendor/{freescale,nxp}.yml.
PKG_EXTRA_INSTALL:remove = "packagegroup-avocado-imx-extra"
PKG_EXTRA_INSTALL:append = " packagegroup-avocado-variscite-extra"

# The i.MX8MP carries a Cortex-M7 co-processor; advertise it so the shared SDK
# packagegroup pulls in the bare-metal ARM toolchain (via kas/vendor/arm.yml,
# included transitively through kas/vendor/nxp.yml).
MACHINE_FEATURES:append = " cortex-m"
