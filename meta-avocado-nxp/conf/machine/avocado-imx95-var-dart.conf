#@TYPE: Machine
#@NAME: Variscite DART-MX95
#@DESCRIPTION: Variscite DART-MX95 i.MX 95 SOM on the Sonata-Board devkit

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx95-var-dart:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc

UBOOT_ENV_SIZE = "0x20000"

# Variscite's DART-MX95 machine (linux-variscite-imx + u-boot-variscite on the
# NXP BSP base), from the vendored meta-variscite-bsp-imx layer. Upstream this
# one machine covers the SOM; the carrier is device-tree selectable at boot,
# not a separate MACHINE -- so other carriers are a bsp-* extension on this
# same machine (see KERNEL_DEVICETREE below).
require conf/machine/imx95-var-dart.conf
require conf/machine/include/avocado-variscite.inc

# No u-boot-imx version pin here, unlike avocado-imx95-frdm.conf. i.MX95 does
# require U-Boot to match the rest of the boot firmware (SPL's first act is
# SCMI traffic to the System Manager), but this board boots u-boot-variscite,
# which variscite.inc selects via PREFERRED_PROVIDER_virtual/bootloader. The
# pinned meta-variscite-bsp-imx branch is already release-matched: its u-boot
# is lf_v2026.04_6.18.20-2.0.0_var01 (U-Boot 2026.04) and it carries
# imx-atf_2.14 / imx-system-manager_2026q2 / imx-oei_1.0.0 bbappends against
# the same meta-imx wrynose-6.18.20-2.0.0 the FRDM uses. Nothing to re-pair.

# variscite.inc sets KERNEL_IMAGETYPE:mx9-nxp-bsp = "Image.gz". The Avocado
# u-boot boot env (avocado-imx95-var-dart.txt) loads the kernel and `booti`s it
# directly, which needs a raw arm64 Image, not a gzip. mx95-nxp-bsp sits after
# mx9-nxp-bsp in imx-base.inc's MACHINEOVERRIDES_EXTENDER, so this wins on
# override specificity rather than on parse order.
KERNEL_IMAGETYPE:mx95-nxp-bsp = "Image"

# The vendor machine already lists only Sonata-Board device trees, so there is
# nothing to narrow the way the i.MX8MP DART needs. Kept explicit because the
# stone boot partition file list has to match it exactly:
#   *-sonata         : DART-MX95 on the Sonata-Board (default DTB)
#   *-sonata-m7      : Cortex-M7 co-processor variant (RPMsg / remoteproc)
#   *-sonata-neutron : eIQ Neutron NPU reserved-memory variant
KERNEL_DEVICETREE = " \
    freescale/imx95-var-dart-sonata.dtb \
    freescale/imx95-var-dart-sonata-m7.dtb \
    freescale/imx95-var-dart-sonata-neutron.dtb \
"
