#@TYPE: Machine
#@NAME: NXP i.MX 8MP EVK
#@DESCRIPTION: NXP i.MX 8MP EVK development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx8mp-evk:imx8mp-lpddr4-evk:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc

UBOOT_ENV_SIZE = "0x20000"

require conf/machine/imx8mp-lpddr4-evk.conf

# M.2 slot bus. NXP's 6.18 imx8mp-evk.dts enables usdhc1 (SDIO M.2) and leaves
# pcie0 disabled - the reverse of 6.6, where SDIO was the separate -usdhc1-m2
# variant. The EVK's stock M.2 module (AW-CM276MA, 88W8997) is PCIe, so on the
# base DTB it is never powered and mmc0 logs "Failed to initialize a
# non-removable card" every boot. The kernel composes imx8mp-evk-pcie.dtb
# (base + imx8mp-evk-pcie.dtbo: pcie0/pcie_phy okay, usdhc1 disabled) and
# meta-freescale already lists it in KERNEL_DEVICETREE. The same module's
# Bluetooth is an 88W8997 on uart1, where NXP's dts now says nxp,88w8987-bt;
# imx8mp-evk-pcie-8997.dtb stacks our one-property overlay correcting that
# (recipes-kernel/linux/files/imx8mp-evk/imx8mp-evk-8997-bt.dtso), and the
# u-boot env (avocado-imx8mp-evk.txt) boots that one. A board fitted with an
# SDIO module sets devicetree_file back to imx8mp-evk.dtb.
KERNEL_DEVICETREE:append = " freescale/imx8mp-evk-pcie-8997.dtb"

# Build both SD and eMMC fastboot imx-boot targets.
# flash_evk: standard SD card boot image
# flash_evk_emmc_fastboot: image with -dev emmc_fastboot flag for uuu provisioning
IMXBOOT_TARGETS:append = " flash_evk_emmc_fastboot"

# The i.MX8MP carries a Cortex-M7 co-processor. Advertise it so the shared SDK
# packagegroup (packagegroup-avocado-sdk-extra) pulls in the bare-metal ARM
# toolchain (nativesdk-gcc-arm-none-eabi) used to build Zephyr / M7 firmware.
# Requires meta-arm-toolchain in the build (via kas/vendor/arm.yml in the
# imx8mp-evk machine kas).
MACHINE_FEATURES:append = " cortex-m"
