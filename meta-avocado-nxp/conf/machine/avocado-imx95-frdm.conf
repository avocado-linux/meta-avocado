#@TYPE: Machine
#@NAME: NXP i.MX 95 FRDM
#@DESCRIPTION: NXP i.MX 95 15x15 FRDM development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx95-frdm:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc
require conf/machine/include/avocado-imx-frdm.inc

# meta-imx wrynose-6.18.20-2.0.0 carries the FRDM machine natively (DDR type,
# OEI board, DDR firmware, M7 image, device trees, UBOOT_CONFIG). scarthgap
# derived this board from imx95evk.conf and backported imx-atf 2.12,
# imx-system-manager 2026q1, firmware-imx 8.31 and out-of-tree FRDM device
# trees to make it boot; all of that is upstream now and was removed.
require conf/machine/imx95-15x15-lpddr4x-frdm.conf
require conf/machine/include/fsl-imx-preferred-env.inc

# i.MX 95 is the one i.MX where U-Boot must match the rest of the boot
# firmware: SPL's first act is SCMI traffic to the System Manager, before it
# even disables the boot-time WDOG3 (init_wdog). meta-imx wrynose-6.18.20-2.0.0
# ships SM 2026q2 (44f76dcb) + imx-atf 2.14 + OEI e9bce6f4 paired with U-Boot
# 2026.04. With avocado-imx.inc's 2025.04 pin the SPL hangs silently on the
# A55 UART (from SD and from uuu/SDPS alike) and the SM console loops
# "Reset LM 2, reason=fccu, errId=19" -- DEV_SM_FAULT_WDOG3, owned by the AP
# LM with reaction=lm_reset. The factory image proves the other consistent
# pairing (U-Boot 2025.04 @ 99518e6b + SM 2026q1 c450f539), but the
# release-matched one is the maintained set, so use 2026.04 here. The EFI
# capsule / DFU options that motivated the 2025.04 pin are already turned off
# for every version by disable-unused-vendor-features.cfg.
PREFERRED_VERSION_u-boot-imx = "2026.04"

UBOOT_ENV_SIZE = "0x20000"
