#@TYPE: Machine
#@NAME: NXP i.MX 95 FRDM
#@DESCRIPTION: NXP i.MX 95 15x15 FRDM development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx95-frdm:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc
require conf/machine/include/avocado-imx-frdm.inc

# meta-imx wrynose-6.18.20-2.0.0 carries the FRDM machine natively (DDR type,
# OEI board, DDR firmware, M7 image, device trees, UBOOT_CONFIG). scarthgap
# derived this board from imx95evk.conf and backported imx-atf 2.12,
# imx-system-manager 2026q1, firmware-imx 8.31 and out-of-tree FRDM device
# trees to make it boot; all of that is upstream now and was removed.
require conf/machine/imx95-15x15-lpddr4x-frdm.conf
require conf/machine/include/fsl-imx-preferred-env.inc

UBOOT_ENV_SIZE = "0x20000"
