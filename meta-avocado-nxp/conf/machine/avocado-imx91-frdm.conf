#@TYPE: Machine
#@NAME: NXP i.MX 91 FRDM
#@DESCRIPTION: NXP i.MX 91 FRDM development board

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd uuu-emmc"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:imx91-frdm:imx91-11x11-lpddr4-frdm:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-imx.inc
require conf/machine/include/avocado-imx-frdm.inc

require conf/machine/imx91-11x11-lpddr4-frdm.conf
require conf/machine/include/fsl-imx-preferred-env.inc

UBOOT_ENV_SIZE = "0x20000"

# AHAB. Same ELE-based flow as the i.MX93 - same fuse bank 16, same 256-bit SRK
# hash - so only the SPSDK family and the device tree differ.
AVOCADO_AHAB_FAMILY = "mimx9131"
AVOCADO_KERNEL_DTB = "imx91-11x11-frdm.dtb"

# Same reasoning as the i.MX93: booti never authenticates its argv[1] ramdisk,
# so the initramfs rides inside the signed exec payload rather than beside it.
INITRAMFS_IMAGE_BUNDLE = "${@bb.utils.contains('DISTRO_FEATURES', 'ahab', '1', '', d)}"
