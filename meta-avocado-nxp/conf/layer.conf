# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-nxp"
BBFILE_PATTERN_meta-avocado-nxp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-nxp = "9"

# u-boot-compulab / linux-compulab recipes live in the CompuLab meta-bsp-imx8mp
# layer (collection: compulab-bsp-imx8mp), which only the CompuLab machine kas
# (kas/vendor/compulab.yml) pulls in. Their bbappends live under dynamic-layers/
# (NOT matched by the recipes-*/ BBFILES glob above) and are loaded only when
# that collection is present, so they don't dangle ("No recipes available") on
# the other meta-avocado-nxp boards that share this layer (e.g. imx8mp-evk).
BBFILES_DYNAMIC += " \
    compulab-bsp-imx8mp:${LAYERDIR}/dynamic-layers/compulab-bsp-imx8mp/recipes-*/*/*.bb \
    compulab-bsp-imx8mp:${LAYERDIR}/dynamic-layers/compulab-bsp-imx8mp/recipes-*/*/*.bbappend \
"

# Same for u-boot-variscite / linux-variscite-imx (collection: variscite-bsp),
# which only kas/vendor/variscite.yml pulls in.
BBFILES_DYNAMIC += " \
    variscite-bsp:${LAYERDIR}/dynamic-layers/variscite-bsp/recipes-*/*/*.bb \
    variscite-bsp:${LAYERDIR}/dynamic-layers/variscite-bsp/recipes-*/*/*.bbappend \
"

# Same treatment for the chromium bbappend, for a different trigger: meta-browser
# used to be force-pulled by kas/extra.yml on every build, so extending its
# recipe from a static recipes-*/ path was safe. Feature groups made the browsers
# group opt-in, at which point the bbappend dangled on every board that does not
# ask for it - which is now all of them by default.
BBFILES_DYNAMIC += " \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/recipes-*/*/*.bb \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/recipes-*/*/*.bbappend \
"

# And again for the optee-ftpm bbappend, which lives under dynamic-layers/ and
# so falls outside the BBFILES glob above - something has to add it, and this is
# the conventional way.
#
# The layer-conditional form rather than a plain BBFILES += is defensive, not
# load-bearing today: kas/vendor/nxp.yml already includes kas/vendor/arm.yml, so
# meta-arm is in BBLAYERS on every i.MX build whether or not the fTPM feature is
# on. Keying on the layer keeps this correct if that ever stops being true,
# without asserting that it is true now.
BBFILES_DYNAMIC += " \
    meta-arm:${LAYERDIR}/dynamic-layers/meta-arm/recipes-*/*/*.bb \
    meta-arm:${LAYERDIR}/dynamic-layers/meta-arm/recipes-*/*/*.bbappend \
"

# u-boot-imx-tools comes from meta-imx (collection: fsl-bsp-release), which
# only the NXP-BSP machines pull in; the community-BSP boards (imx93-evk on
# meta-freescale) have no such recipe, so its bbappend must not dangle there.
BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/fsl-bsp-release/recipes-*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/fsl-bsp-release/recipes-*/*/*.bbappend \
"

# linux-compulab (under dynamic-layers/) shares kernel config fragments with the
# in-tree linux-imx bbappend, which stay in recipes-kernel/linux/files/. Expose
# that dir as a var so the relocated bbappend can add it to FILESEXTRAPATHS
# (${LAYERDIR} is not available at recipe-parse time).
AVOCADO_NXP_KERNEL_FILESDIR := "${LAYERDIR}/recipes-kernel/linux/files"

LAYERDEPENDS_meta-avocado-nxp = "core"
LAYERSERIES_COMPAT_meta-avocado-nxp = "wrynose"
