#@TYPE: Machine
#@NAME: Intel x86-64-v3 machine
#@DESCRIPTION: x86-64-v3 (AVX2) for Intel Core-class CPUs, Haswell and newer
#
# Target processors and codenames:
#   Intel Core: Haswell, Broadwell, Skylake, Kaby Lake, Coffee Lake,
#               Comet Lake, Rocket Lake, Ice Lake, Tiger Lake
#   Intel hybrid (different v-levels, but overall v3 compatible):
#               Alder Lake, Raptor Lake, Meteor Lake, Arrow Lake, Lunar Lake
#   AMD: Excavator, Zen, Zen 2, Zen 3 (Ryzen 1000-5000, EPYC Naples-Milan)
#
# Key instruction sets: AVX, AVX2, BMI1, BMI2, FMA, F16C, LZCNT, MOVBE
# Does NOT require: AVX-512

STONE_PROVISIONING ?= "img usb peridio"
MACHINEOVERRIDES =. "intel-x86-64-v3:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-x86-64.inc

DEFAULTTUNE ?= "x86-64-v3"
require conf/machine/include/x86/tune-x86-64-v3.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"

MACHINE_FEATURES += "x86 pci efi"

DISTRO_FEATURES += "tpm2"
PACKAGECONFIG:append:pn-systemd = " tpm2"
