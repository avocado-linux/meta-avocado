#@TYPE: Machine
#@NAME: Intel x86-64-v2 machine
#@DESCRIPTION: x86-64-v2 (SSE4.2) for Atom-class and low-power Intel CPUs
#
# Target processors and codenames:
#   Intel Atom: Silvermont, Goldmont, Goldmont Plus, Tremont
#   Intel Celeron/Pentium: J-series, N-series (e.g., N5105, N100, N200)
#   Intel Jasper Lake, Elkhart Lake, Alder Lake-N
#   Hybrid E-cores only: Gracemont, Crestmont, Skymont (LP-E)
#
# Key instruction sets: SSE3, SSSE3, SSE4.1, SSE4.2, POPCNT
# Does NOT require: AVX, AVX2, AVX-512

STONE_PROVISIONING ?= "img usb"
MACHINEOVERRIDES =. "intel-x86-64-v2:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-x86-64.inc

DEFAULTTUNE ?= "x86-64-v2"
require conf/machine/include/x86/tune-x86-64-v2.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"

MACHINE_FEATURES += "x86 pci efi"

# What this machine can deliver on the security side; read by
# avocado-security-capabilities.bbclass before the tpm2 request below is
# honoured. tpm2: a discrete TPM or Intel PTT. encrypted-var: cryptsetup-var
# with the x86 var-key provider (the var disk's serial), re-enrolled to the
# TPM on first boot. Declaring is not enabling: avocado.yaml var.encrypt opts
# a runtime in.
AVOCADO_SECURITY_CAPABILITIES = "encrypted-var tpm2"

DISTRO_FEATURES += "tpm2"
# cryptsetup-plugins builds libcryptsetup-token-systemd-tpm2.so, which reopens
# the TPM2-sealed /var on later boots; without it every boot falls back to the
# Argon2id recovery keyslot.
PACKAGECONFIG:append:pn-systemd = " tpm2 cryptsetup-plugins"
