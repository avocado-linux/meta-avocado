# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-x86-64"
BBFILE_PATTERN_meta-avocado-x86-64 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-x86-64 = "9"

LAYERDEPENDS_meta-avocado-x86-64 = "core"
LAYERSERIES_COMPAT_meta-avocado-x86-64 = "wrynose"
