title Avocado OS
linux /bzImage
# Microcode first: the kernel applies it only from an uncompressed cpio at the
# start of the concatenated initrds, and the EFI stub concatenates them in the
# order listed here.
initrd /intel-ucode.cpio
initrd /initramfs.cpio.zst
# root= names slot A only as the fallback for a boot where the slot cannot be
# determined. stone delivers this one file to both ESPs byte for byte, so no
# spelling of root= here can select a slot; avocado-slot-root-generator does
# that in the initramfs from the LoaderDevicePartUUID the firmware set.
#
# The serial console last, so /dev/console (the emergency shell, systemd's
# status output) is the serial port, as on AMD and Jetson. Bare `earlycon`
# takes the port from the firmware's SPCR table where there is one, and is
# ignored where there is none.
options root=PARTLABEL=rootfs-a ro earlycon console=tty0 console=ttyS0,115200n8
