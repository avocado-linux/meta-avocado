# Kernel config fragment for NVIDIA GPU support
# Required by the NVIDIA open kernel modules (nvidia-drm.ko)

# DRM subsystem -- required for nvidia-drm module
CONFIG_DRM=m
CONFIG_DRM_KMS_HELPER=m
CONFIG_DRM_FBDEV_EMULATION=y

# Memory management -- required for GPU DMA
CONFIG_MTRR=y
CONFIG_ZONE_DMA32=y
