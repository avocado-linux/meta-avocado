# Container, firewall and virtualization options the other Avocado kernels
# carry (Jetson avocado-extra.cfg, i.MX avocado-netfilter.cfg) and that
# x86_64_defconfig leaves unset. Only unset options: nf_conntrack and the IPv4
# iptables core are already set by the defconfig and stay as they are.

# Docker 28+ writes a raw-table PREROUTING rule for every container on the
# default bridge; without the raw table docker 29 fails every `docker run`
# there with "can't initialize iptables table `raw'". Most of the xt matches
# and the IPv6 tables also sit behind NETFILTER_ADVANCED.
CONFIG_NETFILTER_ADVANCED=y
CONFIG_IP_NF_RAW=m
CONFIG_IP_NF_MANGLE=m
CONFIG_IP6_NF_IPTABLES=m
CONFIG_IP6_NF_FILTER=m
CONFIG_IP6_NF_TARGET_REJECT=m
CONFIG_IP6_NF_NAT=m
CONFIG_IP6_NF_TARGET_MASQUERADE=m
CONFIG_IP6_NF_MANGLE=m
CONFIG_IP6_NF_RAW=m

# nftables (the core is already built in), with conntrack and `log group`
# (read back over NFLOG)
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_CT=m
CONFIG_NFT_LOG=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_COMPAT=m
CONFIG_NETFILTER_NETLINK_LOG=m
CONFIG_NF_CT_NETLINK=m

# xt match/target extensions
CONFIG_NETFILTER_XT_CONNMARK=m
CONFIG_NETFILTER_XT_MATCH_CONNLIMIT=m
CONFIG_NETFILTER_XT_MATCH_IPRANGE=m
CONFIG_NETFILTER_XT_MATCH_LIMIT=m
CONFIG_NETFILTER_XT_MATCH_MAC=m
CONFIG_NETFILTER_XT_MATCH_MARK=m
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
CONFIG_NETFILTER_XT_MATCH_STATISTIC=m
CONFIG_NETFILTER_XT_MATCH_STRING=m
CONFIG_NETFILTER_XT_TARGET_LOG=m
CONFIG_NETFILTER_XT_TARGET_NFLOG=m
CONFIG_NETFILTER_XT_TARGET_REDIRECT=m

# IPVS (Kubernetes kube-proxy, load balancing)
CONFIG_IP_VS=m

# `docker run --cpus` and the cgroup v2 cpu.max limit
CONFIG_CFS_BANDWIDTH=y

# NFS server (proc-fs-nfsd.mount fails without it; the Nuvo and Sigma board
# extensions mask that unit today)
CONFIG_NFSD=m
CONFIG_NFSD_V4=y

# KVM: the intel layer already sets the virtualization distro feature
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=m
CONFIG_KVM_INTEL=m
