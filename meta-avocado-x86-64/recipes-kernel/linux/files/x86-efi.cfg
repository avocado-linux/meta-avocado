# Force 64-bit x86 build
CONFIG_64BIT=y
CONFIG_X86_64=y
CONFIG_SMP=y

# x2APIC -- required for modern Intel platforms (Haswell+).
# UEFI firmware enables x2APIC mode; without kernel support the APIC
# subsystem is disabled, SMP breaks, and PCI init hangs.
CONFIG_X86_X2APIC=y
CONFIG_IRQ_REMAP=y

# Intel Low Power Subsystem (SPI/I2C/UART on modern Intel chipsets)
CONFIG_X86_INTEL_LPSS=y

# Machine-Check Exceptions (hardware error reporting)
CONFIG_X86_MCE=y

# ACPI (required for EFI on x86-64, linux-yocto BSP metadata may disable this)
CONFIG_ACPI=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_ACPI_THERMAL=y
CONFIG_X86_ACPI_CPUFREQ=m

# EFI / systemd-boot support (depends on ACPI)
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_RUNTIME_MAP=y
CONFIG_EFI_BOOTLOADER_CONTROL=m
CONFIG_EFIVAR_FS=y
CONFIG_EFI_MIXED=y

# Early console via EFI framebuffer (earlycon=efifb on command line)
CONFIG_SERIAL_EARLYCON=y
CONFIG_EFI_EARLYCON=y
CONFIG_EARLY_PRINTK=y

# Firmware loader (required by WiFi, Bluetooth, GPU firmware loading)
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_COMPRESS=y

# UEFI framebuffer and console
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FB_SIMPLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_VT_HW_CONSOLE_BINDING=y
CONFIG_DRM=y
CONFIG_DRM_FBDEV_EMULATION=y

# Intel GPU (i915) - built as module to avoid interfering with efifb early console
CONFIG_DRM_I915=m

# NVMe (common on modern x86-64 systems)
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y

# AHCI/SATA (common on x86-64 systems)
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_GENERIC=y

# SCSI subsystem (required by USB storage and ATA/SATA for /dev/sd* block devices)
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_CHR_DEV_SG=y
CONFIG_BLK_DEV_BSG=y

# USB storage (for USB provisioning)
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_STORAGE=y
CONFIG_USB_PCI=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_OHCI_PCI=y
CONFIG_HID_SUPPORT=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_ATKBD=y

# MMC/eMMC/SD (common on Atom/Celeron/embedded Intel platforms)
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_SDHCI_ACPI=y

# Ethernet (common chipsets for PXE boot)
CONFIG_NET_VENDOR_INTEL=y
CONFIG_E1000E=m
CONFIG_IGB=m
CONFIG_IXGBE=m
CONFIG_ICE=m
CONFIG_NET_VENDOR_REALTEK=y
CONFIG_R8169=m

# PTP (required by ICE driver)
CONFIG_PTP_1588_CLOCK=y
CONFIG_PCI_MSI=y

# WiFi stack
CONFIG_WIRELESS=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RFKILL=m

# Intel WiFi (AX210, AX200, AX201, etc.)
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
CONFIG_IWLDVM=m

# Bluetooth
CONFIG_BT=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_INTEL=m
CONFIG_BT_BCM=m
CONFIG_BT_RTL=m

# Audio (Intel HD Audio)
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCI=y
CONFIG_SND_HDA=y
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_HDA_CODEC_HDMI=m
CONFIG_SND_HDA_CODEC_REALTEK=m
CONFIG_SND_HDA_GENERIC=m

# Hardware monitoring
CONFIG_HWMON=y
CONFIG_SENSORS_CORETEMP=m

# Networking (containers, VPN, tunneling)
CONFIG_NET_NS=y
CONFIG_TUN=m
CONFIG_VETH=m
CONFIG_BRIDGE=m
CONFIG_NET_SCH_FQ_CODEL=m
CONFIG_FUSE_FS=m
CONFIG_CUSE=m

# Netfilter extras
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
