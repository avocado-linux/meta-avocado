# Intel SoC platform drivers that x86_64_defconfig leaves unset, for the
# onboard controllers of Atom/Celeron/Core boards (Jasper Lake, Elkhart Lake,
# Alder Lake-N and the like). All modules: they load on ACPI/PCI match, and a
# board without the part never loads them.

# LPSS: the PCI-enumerated I2C, SPI and UART controllers behind the board's
# headers, and the GPIO controllers that own its pins.
CONFIG_MFD_INTEL_LPSS_PCI=m
CONFIG_MFD_INTEL_LPSS_ACPI=m
# The LPSS DMA engine the I2C, SPI and UART controllers use for transfers.
CONFIG_INTEL_IDMA64=m
CONFIG_I2C_DESIGNWARE_CORE=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m
CONFIG_I2C_DESIGNWARE_PCI=m
# x86_64_defconfig leaves the whole SPI subsystem off.
CONFIG_SPI=y
CONFIG_SPI_PXA2XX=m
CONFIG_SPI_PXA2XX_PCI=m
CONFIG_SPI_SPIDEV=m
CONFIG_SERIAL_8250_DW=m
CONFIG_PINCTRL_ALDERLAKE=m
CONFIG_PINCTRL_ELKHARTLAKE=m
CONFIG_PINCTRL_JASPERLAKE=m
CONFIG_PINCTRL_TIGERLAKE=m
CONFIG_PINCTRL_METEORLAKE=m
CONFIG_PINCTRL_CANNONLAKE=m
CONFIG_PINCTRL_ICELAKE=m

# Watchdogs: none was built, so systemd's RuntimeWatchdogSec had no device.
# iTCO is registered by i2c-i801 (the PCH SMBus); WDAT comes from ACPI.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_ITCO_WDT=m
CONFIG_ITCO_VENDOR_SUPPORT=y
CONFIG_WDAT_WDT=m

# Thermal and power telemetry
CONFIG_INTEL_PCH_THERMAL=m
CONFIG_X86_PKG_TEMP_THERMAL=m
CONFIG_INT340X_THERMAL=m
CONFIG_POWERCAP=y
CONFIG_INTEL_RAPL=m
# PMC core needs the PMT telemetry it reads, which sits on Intel VSEC.
CONFIG_INTEL_VSEC=m
CONFIG_INTEL_PMT_TELEMETRY=m
CONFIG_INTEL_PMC_CORE=m

# Buttons and switches reported through ACPI
CONFIG_INTEL_HID_EVENT=m
CONFIG_INTEL_VBTN=m

# Realtek USB card readers (common microSD slot on SBCs)
CONFIG_MISC_RTSX_USB=m
CONFIG_MMC_REALTEK_USB=m
