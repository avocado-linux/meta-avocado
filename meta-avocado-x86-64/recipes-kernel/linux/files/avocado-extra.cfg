# Docker / container support
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_PIDS=y
CONFIG_CPUSETS=y
CONFIG_MEMCG=y
CONFIG_NAMESPACES=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_VLAN_8021Q=m
CONFIG_BRIDGE_VLAN_FILTERING=y

# USB serial adapters
CONFIG_USB_SERIAL=m
# The common-pc/intel-x86 BSP enables CONFIG_USB_SERIAL_CONSOLE=y, but that
# option depends on USB_SERIAL=y (built-in). We ship USB serial as a module, so
# the console variant is unassignable and silently drops to n, which trips
# do_kernel_configcheck. Disable it explicitly to match our modular choice.
# CONFIG_USB_SERIAL_CONSOLE is not set
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m

# WireGuard VPN
CONFIG_WIREGUARD=m

# Intel I225/I226 Ethernet (Jasper Lake, Alder Lake, etc.)
CONFIG_IGC=m
