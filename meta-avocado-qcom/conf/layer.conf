# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-qcom"
BBFILE_PATTERN_meta-avocado-qcom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-qcom = "9"

LAYERDEPENDS_meta-avocado-qcom = "core"
LAYERSERIES_COMPAT_meta-avocado-qcom = "scarthgap"

PREFERRED_PROVIDER_virtual/mesa = "mesa-gl"
PREFERRED_PROVIDER_virtual/libgl = "mesa-gl"

# Skip the upstream meta-qcom-hwe proprietary AOSP-derived Bluetooth stack
# (fluoride + companions). fluoride_git.bb has a typo'd SRCREV that points to
# a branch variable, which forces git ls-remote at parse time against an
# access-restricted codelinaro repo (bluetooth_ext.git → 403). We use upstream
# bluez instead and don't ship any of these packages.
BBMASK += "meta-qcom-hwe/recipes-connectivity/fluoride/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/bt-app/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/bt-cert/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/bthost-ipc/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/btvendorhal/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/libbt-vendor/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/btobex/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/bt-audio-headers/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/bt_dlkm_kernel/"
BBMASK += "meta-qcom-hwe/recipes-connectivity/packagegroups/packagegroup-qcom-bluetooth.bb"

# IEC61850 substation-automation parser; uses SRCREV = "${AUTOREV}" against an
# access-restricted codelinaro repo (edgegateway.git → 403/TLS error), so the
# AUTOREV resolution explodes at parse time. Not relevant to rubikpi3.
BBMASK += "meta-qcom-hwe/recipes-edgegateway/"
