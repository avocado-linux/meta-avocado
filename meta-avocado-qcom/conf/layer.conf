# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-qcom"
BBFILE_PATTERN_meta-avocado-qcom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-qcom = "9"

LAYERDEPENDS_meta-avocado-qcom = "core qcom"
LAYERSERIES_COMPAT_meta-avocado-qcom = "wrynose"

# meta-qcom's kernel recipes BBCLASSEXTEND a devupstream:target variant that
# tracks AUTOREV, and bitbake resolves AUTOREV with `git ls-remote` while
# parsing. We never build them, and inside the build container that ls-remote
# dies anyway ("fatal: not a git repository: .../meta-avocado/.git/worktrees/
# ...": the build dir lives in a git worktree whose .git file names a host
# path). Mask the RT/next kernels outright and strip the variant from
# linux-qcom in linux-qcom_%.bbappend.
BBMASK += "meta-qcom/recipes-kernel/linux/linux-qcom-rt_"
BBMASK += "meta-qcom/recipes-kernel/linux/linux-qcom-next_"
BBMASK += "meta-qcom/recipes-kernel/linux/linux-qcom-next-rt_"
