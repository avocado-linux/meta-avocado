# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-qcom"
BBFILE_PATTERN_meta-avocado-qcom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-qcom = "9"

LAYERDEPENDS_meta-avocado-qcom = "core qcom"
LAYERSERIES_COMPAT_meta-avocado-qcom = "wrynose"

# meta-qcom's kernel recipes BBCLASSEXTEND a devupstream:target variant that
# tracks AUTOREV, and bitbake resolves AUTOREV with `git ls-remote` while
# parsing. Inside the build container that ls-remote dies anyway ("fatal: not a
# git repository: .../meta-avocado/.git/worktrees/...": the build dir lives in a
# git worktree whose .git file names a host path). The variant is stripped from
# both kernels we build in recipes-kernel/linux/avocado-linux-qcom.inc; the
# -next ones we never build, so masking them outright is cheaper than giving
# each a bbappend.
#
# linux-qcom-rt_ used to be masked here for the same reason. It is built now --
# as the alternate kernel of the qcom-rt multiconfig -- so it has a bbappend
# that shares the .inc, and the mask is gone with it.
BBMASK += "meta-qcom/recipes-kernel/linux/linux-qcom-next_"
BBMASK += "meta-qcom/recipes-kernel/linux/linux-qcom-next-rt_"
