# Multiconfig: qcom-rt
#
# Builds meta-qcom's PREEMPT_RT kernel (linux-qcom-rt) for the same MACHINE the
# default mc is building, so the published feed carries both it and the stock
# linux-qcom and avocado-cli's resolver can pick between them.
#
# Both kernels are the same upstream version -- linux-qcom-rt_6.18.bb is
# `require linux-qcom_6.18.bb` plus arch/arm64/configs/rt.config -- but they are
# separate recipes with separate PNs, so this switches the provider (the Jetson
# L4T shape) rather than pinning a version (the Raspberry Pi shape).
#
# MACHINE is intentionally NOT set here -- it is inherited from the default
# multiconfig, so one conf serves every qcom machine that opts in.
#
# Activate via the kas/feature/multi-kernel-qcom.yml overlay (which sets
# BBMULTICONFIG and adds the mc:qcom-rt:linux-qcom-rt entry to
# AVOCADO_MULTIKERNEL_MC_RECIPES).

# `:forcevariable` is the highest-precedence override and wins regardless of
# load order. meta-avocado-qcom/conf/machine/avocado-rubikpi3.conf hard-assigns
# PREFERRED_PROVIDER_virtual/kernel = "linux-qcom" and is loaded after this
# file, so a plain `=` here would be clobbered.
PREFERRED_PROVIDER_virtual/kernel:forcevariable = "linux-qcom-rt"

# Same MACHINE in two multiconfigs collides on bitbake's per-recipe WORKDIR:
#   ${TMPDIR}/work/<machine_arch>-<vendor>-<os>/<recipe>/<pv>-<pr>/
# is keyed on MACHINE_ARCH but not on multiconfig name. As soon as a recipe's
# signature differs across mcs (anything depending on virtual/kernel:
# make-mod-scripts, kernel-devsrc, linux-qcom-dtbbin, ...), the two mcs race the
# same physical path and stomp on each other's recipe-sysroot and source trees.
# Per-mc TMPDIR gives this mc its own tree.
#
# DEPLOY_DIR_RPM and the other sub-trees inherit ${TMPDIR}, so they are per-mc
# too. That deliberately avoids bitbake's shared-area collision detection, which
# fires whenever two mcs write the same NEVRA for sysroot recipes (glibc, libgcc,
# linux-libc-headers, gcc-runtime, ...). Their signatures differ across mcs so
# sstate cannot dedupe them; each mc writes to its own tree and
# do_multikernel_merge composes the unified local feed afterward.
#
# Production Pulp uploads need no merge at all: avocado-pulp-upload.bbclass
# uploads each recipe's RPMs into a repo keyed on release/channel + arch, not on
# TMPDIR, so both mcs' RPMs land in the same repo on their own.
TMPDIR = "${TOPDIR}/tmp-qcom-rt"

# BUILDHISTORY_DIR defaults to ${TOPDIR}/buildhistory, which is NOT under TMPDIR,
# so the isolation above does not carry it along. BUILDHISTORY_DIR_PACKAGE keys
# on ${MULTIMACH_TARGET_SYS}/${PN}: the shared helper recipes that keep one ${PN}
# across both mcs (make-mod-scripts, linux-qcom-dtbbin, ...) would write the same
# path from each mc with a different AUTOPR -- each mc's distinct taskhash gets
# its own PR from the PR server -- and buildhistory reports a spurious
# "version went backwards" failure. Both PRs are legitimate, so track them
# per-mc. Same override as jetson-l4t.conf and raspberrypi-6_6.conf; any
# same-MACHINE multi-kernel mc needs it.
BUILDHISTORY_DIR = "${TMPDIR}/buildhistory"
