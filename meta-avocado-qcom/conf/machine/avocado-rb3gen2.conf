#@TYPE: Machine
#@NAME: avocado-rb3gen2
#@DESCRIPTION: Qualcomm Robotics RB3 Gen 2 (QCS6490), upstream-kernel BSP

MACHINEOVERRIDES =. "rb3gen2:"

# The SoC-level settings: boot chain shape, KVM XBL config, UART, OS partition
# labels, ESP/UKI arrangement -- all shared with avocado-rubikpi3, which is the
# same SoC. Everything below is this board's own.
require conf/machine/include/avocado-qcs6490.inc

# One machine for the whole RB3 Gen 2 family, which is how meta-qcom models it
# too: rb3gen2-core-kit is the board, and the Vision Kit and Industrial Kit are
# that board plus a mezzanine, delivered as device tree overlays
# (qcs6490-rb3gen2-vision-mezzanine.dtbo,
# qcs6490-rb3gen2-industrial-mezzanine.dtbo). Nothing about the core kit's boot
# path, storage or SoC differs between them, so a separate machine per kit would
# duplicate an entire target to select a .dtbo.
#
# See the note on QCOM_DTB_DEFAULT below for what still has to be resolved
# before a mezzanine's peripherals actually come up.
KERNEL_DEVICETREE = " \
    qcom/qcs6490-rb3gen2.dtb \
    qcom/qcs6490-rb3gen2-vision-mezzanine.dtbo \
    qcom/qcs6490-rb3gen2-industrial-mezzanine.dtbo \
    qcom/kodiak-el2.dtbo \
    qcom/qcs6490-rb3gen2-staging.dtbo \
"

# The overlays merged into the UKI's embedded device tree, in order.
#
# This is what finally applies them. Until now every overlay here was BUILT and
# nothing consumed it, because the Qualcomm flow flashes one dtb to dtb_a and
# has no overlay-application step -- so the board booted the base tree and the
# hardware those overlays describe was simply absent. Confirmed on hardware:
# no camss node, no /dev/video*, and the QPS615 NIC failing to probe with
#
#   tc956x_pci-eth 0001:05:00.1: error -ENOENT: Failed to get phy-reset-gpios
#
# because phy-reset-gpios lives in qcs6490-rb3gen2-staging, not the base dts.
#
#   qcs6490-rb3gen2-staging  the core kit's own QPS615 Ethernet: the qps615 PCI
#                            node with phy-reset-gpios for both ports, its
#                            regulator and the tlmm pinctrl. Core-kit hardware,
#                            so it belongs on every RB3 Gen 2.
#   kodiak-el2               required whenever Linux owns EL2, which
#                            avocado-qcs6490.inc selects by pinning
#                            QCOM_XBL_CONFIG_VARIANT = "kvm". Adds iommus to
#                            the remoteprocs, wifi and venus, and enables the
#                            watchdog. Without it we ship a boot chain that
#                            hands Linux EL2 and then a device tree for the
#                            Gunyah case.
#
# Deliberately NOT here: the mezzanine overlays. A mezzanine is removable and
# varies per product, so baking one in would say every RB3 Gen 2 is a Vision
# Kit -- a core kit would boot a tree claiming an IMX577 that is not fitted.
#
# They come from their extensions instead, through the overlay-delivery path:
# an extension declares `device_tree_overlays`, avocado-cli compiles and stages
# them, device-tree-overlay-deliver claims them, and avocado-build-qcom merges
# them onto this tree when it rebuilds the UKI. The result is a function of the
# installed extension set, which is what makes mezzanine support composable --
# and because the UKI is an os_artifact, installing a mezzanine extension and
# redeploying changes the device tree over the ordinary A/B OTA path.
#
# Not .dtbauto, which an earlier revision of this comment guessed at: sd-stub
# selects among .dtbauto trees with devicetree_get_compatible, matching the
# hardware's compatible, and a mezzanine overlay does not change the root
# compatible -- the vision one's only compatible is the sensor's `sony,imx577`.
# Several trees in one UKI cannot discriminate between mezzanines on one board.
AVOCADO_UKI_DTB_OVERLAYS = "kodiak-el2 qcs6490-rb3gen2-staging"

# kodiak-el2.dtbo is a DIFFERENT KIND of overlay from the two mezzanines above,
# and the difference matters.
#
# A mezzanine overlay is optional: it describes a board that may or may not be
# plugged in, so not applying one is a valid configuration. kodiak-el2.dtbo is
# not optional -- it is the DT this SoC needs whenever Linux owns EL2, and
# avocado-qcs6490.inc already selects that by setting QCOM_XBL_CONFIG_VARIANT =
# "kvm" (xbl_config_kvm.elf). So today we ship a boot chain that hands Linux
# EL2 and then boot it with the DT for the Gunyah case. Upstream says so in the
# overlay itself: "When running under Gunyah, remote processor firmware IOMMU
# streams is controlled by the Gunyah however when we take ownership of it in
# EL2, we need to configure it properly to use remote processor."
#
# What it carries: iommus for remoteproc_adsp and remoteproc_cdsp, iommus and
# wlan_ce_mem for wifi, iommus for venus, gpu_zap_shader disabled, and
# `&watchdog { status = "okay" }`.
#
# Built here but NOT applied, same as the mezzanines -- adding it to this list
# only produces the .dtbo, it does not change what boots, so this line is safe
# on its own. Applying it needs the fdtoverlay-or-FIT decision described below.
# To test the merge by hand against the deployed blobs:
#
#   fdtoverlay -i qcs6490-rb3gen2.dtb -o merged.dtb kodiak-el2.dtbo
#
# Worth doing before trusting the DSPs, wifi or the watchdog on this board. The
# watchdog in particular is the piece that makes a boot hang recoverable:
# systemd-boot's boot counting only demotes a slot that gets far enough to
# reboot, so a hang before that needs the SoC watchdog this overlay enables.

# The base board dtb, flashed to dtb_a as a single blob.
#
# This is the core kit. A mezzanine's overlay is BUILT (above) but not applied:
# image-avocado-qcom-deploy ships one dtb, and there is no overlay-application
# step in this flow -- meta-qcom's own path for that is a multi-dtb FIT with
# qcom-dtb-metadata, which avocado does not use here. Applying one at build time
# with fdtoverlay, or teaching the deploy recipe to emit a FIT, is what a Vision
# Kit needs for its cameras and is deliberately not attempted blind: see the
# layer README for the two options and why the camera stack is the harder half.
QCOM_DTB_DEFAULT = "qcs6490-rb3gen2"

# efi and pci come from meta-qcom's own rb3gen2-core-kit.conf; tpm2 is dropped
# until it is exercised (declaring it would have avocado build measured-boot
# tooling into the feed for a device nobody has verified a TPM on), and phone /
# m2connector are modem and M.2 features this distro does not deliver.
MACHINE_FEATURES = "usbhost usbgadget wifi bluetooth alsa pci efi"

# Qualcomm's own public boot chain, not a vendor fork.
#
# This is the one place the RB3 Gen 2 is materially easier than the RUBIK Pi 3.
# rubikpi3 takes its boot binaries from Thundercomm's prebuilt git repo because
# the board's firmware is Thundercomm's; the RB3 Gen 2 is Qualcomm's own
# reference board, so the whole chain -- xbl.elf, xbl_config*.elf, uefi.elf,
# tz.mbn, devcfg.mbn, the Firehose programmer and the stock partition tables --
# comes from the QCM6490_bootbinaries package on Qualcomm's software center,
# which meta-qcom already fetches (firmware-qcom-boot-qcs6490) and which is
# reachable without credentials.
#
# Verified against the published 00137 zip: it carries xbl_config.elf,
# xbl_config_gunyah.elf and xbl_config_kvm.elf, so the KVM selection in
# avocado-qcs6490.inc applies here unchanged.
PREFERRED_PROVIDER_virtual/bootbins = "firmware-qcom-bootbins-rb3gen2"
PREFERRED_PROVIDER_virtual/partconf = "firmware-qcom-partconf-rb3gen2"

# Boot the vendor UEFI down its FIT device-tree path instead of the legacy
# "MultiDtb" fallback.
#
# UEFI's DtPlatformLoadDtbBlob tries qclinux_fit.img on the dtb_a filesystem
# FIRST; when it is absent (status=0xE) it falls back to loading the raw
# combined-dtb.dtb and runs BoardInfoDxe's legacy qcom,platform-parts-info
# fixup. That legacy fixup has an intermittent uninitialised-pointer read
# (data abort reading a garbage ~0x1D66_x000 pointer -> "panic (caller
# 0x9fb02c88): die") that drops the board into XBL dload (05c6:900e) on a large
# fraction of boots -- unrecoverable without a physical EDL power cycle, since
# the crash is in firmware before systemd-boot counts a boot attempt. Padding
# or shrinking the base dtb only shifts the odds (heap layout), it does not fix
# it. Supplying a valid FIT makes the first load succeed so the buggy legacy
# path is never entered -- Qualcomm's documented forward path (meta-qcom #1124,
# qcom-deb-images #249).
#
# meta-qcom already builds the FIT (dtb-fit-image.bbclass) and ships the
# qcs6490-rb3gen2 compatible combos (qcom_qcs6490-iot-el2kvm =
# "qcs6490-rb3gen2 kodiak-el2"). All we do is turn the class on;
# image-avocado-qcom-deploy then stages qclinuxfitImage into the dtb_a
# filesystem as qclinux_fit.img.
#
# dtb-fit-image is only auto-inherited by linux-qcom-dtbbin when
# QCOM_DTB_DEFAULT == "multi-dtb", which we cannot use (linux-avocado-qcom-uki.bb
# reads ${QCOM_DTB_DEFAULT}.dtb as the UKI base), so enable it explicitly.
# LINUX_QCOM_FIT_DTB_COMPATIBLE is deliberately NOT set here: our virtual/kernel
# (linux-qcom) already sets it to fit-dtb-compatible-linux-qcom.inc with a
# recipe-level '=', which overrides a machine-conf assignment -- so setting it
# here would be dead. A kernel without that assignment (e.g. linux-qcom-rt)
# would fall back to the base fit-dtb-compatible.inc, which also carries the
# qcs6490-rb3gen2 combos.
KERNEL_CLASSES += "dtb-fit-image"
