#@TYPE: Machine
#@NAME: avocado-rubikpi3
#@DESCRIPTION: Thundercomm RUBIK Pi 3 (Qualcomm QCS6490), upstream-kernel BSP

STONE_PROVISIONING ?= "ufs noop"

MACHINEOVERRIDES =. "rubikpi3:"

require conf/machine/include/avocado.inc
# meta-qcom's SoC include: qcm6490 SOC_FAMILY, armv8-2a-crypto tune,
# qcom-base.inc (linux-qcom, linux-qcom-dtbbin) and qcom-common.inc.
require conf/machine/include/qcom-qcs6490.inc

MACHINE_FEATURES = "usbhost usbgadget wifi bluetooth alsa"

# Kernel: Qualcomm's upstream-tracking linux-qcom 6.18 from meta-qcom. The
# board dts landed in mainline in January 2026, after 6.18 branched, so
# linux-qcom_%.bbappend carries it (see there for the one include rename).
PREFERRED_PROVIDER_virtual/kernel = "linux-qcom"
KERNEL_DEVICETREE = "qcom/qcs6490-thundercomm-rubikpi3.dtb"
# One board, one dtb: no multi-dtb FIT / qcom-dtb-metadata. linux-qcom-dtbbin
# then only produces dtb-qcs6490-thundercomm-rubikpi3-image.vfat, which
# image-avocado-qcom-deploy ships as dtb.bin for the dtb_a partition.
QCOM_DTB_DEFAULT = "qcs6490-thundercomm-rubikpi3"
# linux-avocado-qcom-uki packs the uncompressed Image; meta-qcom defaults to
# Image.gz for its own boot images.
KERNEL_IMAGETYPES = "Image"
KERNEL_CMDLINE_EXTRA ?= "pcie_pme=nomsi swiotlb=128 mitigations=auto net.ifnames=0"

# meta-qcom appends ext4 + qcomflash for its qcomflash artifacts; avocado
# builds its own erofs/btrfs images and the UFS bundle, so keep them out.
IMAGE_FSTYPES:remove = "ext4 qcomflash"

# Boot chain stays Thundercomm's: the UEFI/XBL/ABL boot binaries and CDT from
# rubikpi-ai/prebuilt (firmware-qcom-bootbins / firmware-qcom-partconf in this
# layer), flashed over QDL by stone-provision-ufs.sh. UEFI loads the UKI from
# the efi partition (esp-avocado-qcom-image) and the dtb from dtb_a.
PREFERRED_PROVIDER_virtual/bootbins = "firmware-qcom-bootbins"
PREFERRED_PROVIDER_virtual/partconf = "firmware-qcom-partconf"
QCOM_BOOTIMG_ROOTFS = "/dev/disk/by-partlabel/system"

CONSOLE_CMDLINE ?= "console=ttyMSM0,115200n8 earlycon"
SERIAL_CONSOLES ?= "115200;ttyMSM0"

AVOCADO_VAR_PART_DEV = "/dev/disk/by-partlabel/avocado"

# Pulls in systemd preset overrides + masks for units that don't apply on
# rubikpi3 (boot.mount/boot.automount, systemd-boot-*, proc-fs-nfsd.mount,
# getty@.service preset). See recipes-core/systemd/systemd-rubikpi3-masks.bb.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "systemd-rubikpi3-masks"
