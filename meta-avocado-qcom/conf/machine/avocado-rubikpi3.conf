#@TYPE: Machine
#@NAME: avocado-rubikpi3
#@DESCRIPTION: Thundercomm RUBIK Pi 3 (Qualcomm QCS6490), upstream-kernel BSP

MACHINEOVERRIDES =. "rubikpi3:"

# The SoC-level settings: boot chain shape, KVM XBL config, UART, OS partition
# labels, ESP/UKI arrangement. Everything below is this board's own.
require conf/machine/include/avocado-qcs6490.inc

MACHINE_FEATURES = "usbhost usbgadget wifi bluetooth alsa"

# The board dts landed in mainline in January 2026, after 6.18 branched, so
# linux-qcom_%.bbappend carries it (see there for the one include rename).
KERNEL_DEVICETREE = "qcom/qcs6490-thundercomm-rubikpi3.dtb"
# One board, one dtb: no multi-dtb FIT / qcom-dtb-metadata. linux-qcom-dtbbin
# then only produces dtb-qcs6490-thundercomm-rubikpi3-image.vfat, which
# image-avocado-qcom-deploy ships as dtb.bin for the dtb_a partition.
QCOM_DTB_DEFAULT = "qcs6490-thundercomm-rubikpi3"

# This machine relies on the distro default INITRAMFS_IMAGE_BUNDLE = "0"
# (conf/distro/avocado.conf), like avocado-imx93-frdm. kas/vendor/rubikpi.yml
# used to set "1" in local_conf_header, carried over from the HWE-era BSP, and
# it bought nothing here: linux-avocado-qcom-uki builds the UKI itself from
# ${DEPLOY_DIR_IMAGE}/Image (the bare kernel) plus the standalone
# ${INITRAMFS_IMAGE_NAME}.${INITRAMFS_FSTYPES} image, so it never reads a
# kernel-bundled initramfs, and nothing else consumed Image-initramfs-*.
#
# What it did cost: oe-core's kernel_do_install skips installing the image
# entirely when bundling ("if [ ${INITRAMFS_IMAGE_BUNDLE} != 1 ]",
# kernel.bbclass), so /boot/Image-${KERNEL_VERSION} was never packaged and
# kernel-image-image shipped zero files. The rootfs sysroot's /boot then came
# up empty, avocado's kernel-sysroot staging found no *-${kver} image to stage,
# and `rootfs install` deliberately withheld its install stamp -- leaving
# `avocado build` to abort with "Missing steps: rootfs install".

# Boot chain stays Thundercomm's: the UEFI/XBL/ABL boot binaries and CDT from
# rubikpi-ai/prebuilt (firmware-qcom-bootbins / firmware-qcom-partconf in this
# layer), flashed over QDL by stone-provision-ufs.sh. UEFI loads the boot entry
# from the efi partition (esp-avocado-qcom-image) and the dtb from dtb_a.
PREFERRED_PROVIDER_virtual/bootbins = "firmware-qcom-bootbins"
PREFERRED_PROVIDER_virtual/partconf = "firmware-qcom-partconf"

# Pulls in systemd preset overrides + masks for units that don't apply on
# rubikpi3 (boot.mount/boot.automount, systemd-boot-*, proc-fs-nfsd.mount,
# getty@.service preset). See recipes-core/systemd/systemd-rubikpi3-masks.bb.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "systemd-rubikpi3-masks"

# avocado-bls (clears systemd-boot's boot-assessment counter after a good boot,
# which nothing else here can: no EFI variables at runtime means
# systemd-bless-boot has no LoaderBootCountPath to read) is listed in
# packagegroup-avocado-qcom-extra, NOT here. MACHINE_ESSENTIAL_EXTRA_RDEPENDS
# feeds packagegroup-core-boot, a Yocto image concept; avocado's runtime rootfs
# is assembled by avocado-cli from its own package list, so a recipe named only
# here is never built and never installed. Same trap as systemd-rubikpi3-masks.
