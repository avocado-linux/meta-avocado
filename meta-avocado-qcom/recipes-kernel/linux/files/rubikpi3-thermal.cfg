# rubikpi3-thermal (the fan controller from rubikpi-ai/prebuilt) drives the
# PWM fan through the thermal netlink API -- it links libthermal_tools and
# talks NETLINK_GENERIC to the thermal subsystem. Without this it exits 4
# immediately and rubikpi-thermal.service fails at every boot, leaving the
# board with no active cooling.
#
# CONFIG_THERMAL_NETLINK is not in qcom_defconfig, and the sensors themselves
# do not need it: /sys/class/thermal is populated either way (39 nodes on this
# board), which is why the miss shows up only as a service failure.
CONFIG_THERMAL_NETLINK=y
