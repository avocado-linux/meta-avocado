# Distinguish the PREEMPT_RT kernel's kernel.release from the stock one's.
#
# Both recipes build the same SRCREV and rt.config sets no CONFIG_LOCALVERSION,
# so without this the two kernels are byte-identically versioned and every
# -${KERNEL_VERSION}-suffixed package name in the feed collides. With it the RT
# kernel is 6.18.37-rt-<scmversion>, which a user selects in avocado.yaml as
# `kernel: version: "6.18.37-rt*"`.
#
# Deliberately a suffix on the base version, not a prefix: avocado-cli's
# resolver treats an absent kernel.version as "highest by rpmvercmp", where
# numeric segments outrank alpha ones, so 6.18.37-<scmversion> beats
# 6.18.37-rt-<scmversion> and the stock kernel stays the implicit default.
CONFIG_LOCALVERSION="-rt"

# NOT enabled here, deliberately -- measured on hardware, twice:
#
#   CONFIG_NO_HZ_FULL=y + CONFIG_RCU_NOCB_CPU=y on this SoC gives a board that
#   dies in UEFI's "OS Loader" stage with no console output at all -- no EFI
#   stub banner, no earlycon, nothing -- and resets into the SoC's download
#   mode. Both options are inert at runtime without nohz_full=/rcu_nocbs= on
#   the command line, which makes this surprising, but it reproduces: the same
#   UKI built by the same ukify invocation around the stock kernel boots, and
#   around this kernel with these two options does not. Isolated by flashing
#   both from the same build (same stub, same initrd, PE section tables
#   identical but for content sizes).
#
# What they were for: making `nohz_full=` and `rcu_nocbs=` actually take
# effect. Without them those parameters are accepted and silently ignored --
# /sys/devices/system/cpu/isolated reads back "4-6" while nohz_full stays
# empty, i.e. domain isolation with none of the tick or RCU relief.
#
# That turned out not to be worth chasing. The best measured latency on this
# board came from cgroup-v2 cpuset partitioning (AllowedCPUs on the VM slice
# vs everything else) with no isolcpus at all; adding isolcpus made the median
# WORSE (7.1-7.2 us vs 5.0-5.4 us). So the feature these options unlock has
# negative measured value here, and enabling them costs the board its ability
# to boot. Revisit only with a kernel bisect and a board that can be recovered
# without a physical power cycle.
