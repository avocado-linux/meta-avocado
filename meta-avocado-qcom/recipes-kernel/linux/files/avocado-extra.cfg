CONFIG_VETH=m
CONFIG_VIRTIO_NET=m
CONFIG_WIREGUARD=m

# NFS Server (mirrors the NXP and Jetson avocado-extra.cfg). avocado-ext-dev
# ships the nfs-server units, so proc-fs-nfsd.mount runs and fails on every
# boot without nfsd; as a module it is only loaded when that mount needs it.
CONFIG_NFSD=m
CONFIG_NFSD_V3=y
CONFIG_NFSD_V4=y

# USB Serial Adapters
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m
