CONFIG_VETH=m
CONFIG_VIRTIO_NET=m
CONFIG_WIREGUARD=m

# USB Serial Adapters
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m

# The PDM general-purpose MN clock divider (qcom,clk-gp-mnd): SoC hardware the
# device tree enables that no driver bound. Found by the board-bringup
# coverage audit (DT-ENABLE).
CONFIG_QCOM_CLK_GP_MND=m
