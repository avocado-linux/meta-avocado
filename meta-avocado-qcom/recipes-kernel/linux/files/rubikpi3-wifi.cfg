# Wi-Fi (Broadcom BCM43455 SDIO) for the RUBIK Pi 3.
#
# The board's onboard Wi-Fi/BT is a Cypress/Broadcom CYW4345 (PCI ID 0x02d0:0xa9bf,
# also marketed as BCM43456 — silicon is the BCM43455 family). Drive it via the
# mainline `brcmfmac` driver. Firmware comes from upstream `linux-firmware-bcm43455`
# (brcmfmac43455-sdio.bin + .clm_blob) plus the rubikpi3-specific NVRAM shipped
# by firmware-rubikpi3 as /lib/firmware/brcm/brcmfmac43455-sdio.txt.
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_BRCMUTIL=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_PROTO_BCDC=y
CONFIG_BRCMFMAC_SDIO=y
# Vendor sub-modules — Linux 6.5+ split per-vendor logic into separate .ko's.
# WCC is what BCM4345/9 (= rubikpi3's BCM43456) uses; BCA and CYW added too
# so the same kernel works for any other Broadcom-family chip a future board
# may carry.
CONFIG_BRCMFMAC_WCC=m
CONFIG_BRCMFMAC_BCA=m
CONFIG_BRCMFMAC_CYW=m
