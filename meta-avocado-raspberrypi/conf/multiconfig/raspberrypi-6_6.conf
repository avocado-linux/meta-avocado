# Multiconfig: raspberrypi-6_6
#
# Builds the linux-raspberrypi 6.6.x kernel for the same MACHINE the default
# mc is building (which pins 6.12.x via avocado-raspberrypi.inc). Used to
# populate a multi-kernel feed alongside the default 6.12 so avocado-cli's
# kernel.version resolver and auto-append of
# packagegroup-avocado-{rootfs,initramfs}-modules-${KERNEL_VERSION} can be
# exercised against a real two-kernel feed.
#
# Both kernels are the same recipe (linux-raspberrypi) — only the version
# differs — so we override PREFERRED_VERSION_linux-raspberrypi rather than
# PREFERRED_PROVIDER_virtual/kernel (the Jetson L4T mc switches providers
# because L4T is a separate recipe; here it is not).
#
# MACHINE is intentionally NOT set here — it is inherited from the default
# multiconfig, so a single conf works for every Raspberry Pi machine in the
# family (raspberrypi5, raspberrypi4, raspberrypi0-2w, reterminal, fr202,
# etc.).
#
# Activate via the kas/feature/multi-kernel-raspberrypi.yml overlay (which
# sets BBMULTICONFIG and adds the mc:raspberrypi-6_6:* bitbake targets).

# `:forcevariable` is the highest-precedence override and wins regardless of
# load order. avocado-raspberrypi.inc currently uses `?=` so a plain `=` would
# also work, but forcevariable is robust against future changes there or in
# any machine.conf that hard-assigns the version.
PREFERRED_VERSION_linux-raspberrypi:forcevariable = "6.6.%"

# Same MACHINE in two multiconfigs collides on bitbake's per-recipe WORKDIR:
#   ${TMPDIR}/work/<machine_arch>-<vendor>-<os>/<recipe>/<pv>-<pr>/
# is keyed on MACHINE_ARCH but not on multiconfig name. As soon as a recipe's
# signature differs across mcs (any recipe that depends on virtual/kernel:
# linux-raspberrypi 6.12 vs linux-raspberrypi 6.6 → make-mod-scripts,
# kernel-devsrc, every kernel-module-* etc.), the two mcs race the same
# physical path and the parse-/configure-/compile-stage tasks stomp on each
# other's recipe-sysroot and source trees. Per-mc TMPDIR gives this mc its
# own tmp tree.
#
# DEPLOY_DIR_RPM and other sub-trees inherit ${TMPDIR}, so they're per-mc too.
# That deliberately avoids bitbake's "shared-area collision" detection which
# fires whenever two mcs produce the same NEVRA for sysroot recipes (glibc,
# libgcc, linux-libc-headers, gcc-runtime, ...). Their sigs differ across
# mcs (TMPDIR is in basehash for some recipes via subtle paths), so sstate
# can't dedupe; a shared DEPLOY_DIR_RPM would have both mcs trying to write
# the same .rpm files. With per-mc DEPLOY_DIR_RPM, each mc writes to its own
# tree and a post-build merge step composes the unified feed.
#
# Production Pulp uploads handle this naturally: avocado-pulp-upload.bbclass
# uploads each recipe's RPMs into a Pulp repo keyed on release/channel + arch
# (NOT on TMPDIR), so both mcs' RPMs land in the same Pulp repo without any
# explicit merge. Local-feed users (_repo/) need to rsync-merge
# tmp-raspberrypi-6_6/deploy/rpm into tmp/deploy/rpm after the build (see
# kas overlay).
TMPDIR = "${TOPDIR}/tmp-raspberrypi-6_6"

# BUILDHISTORY_DIR defaults to ${TOPDIR}/buildhistory, which is NOT under
# TMPDIR — so the per-mc TMPDIR isolation above does not carry buildhistory
# along. BUILDHISTORY_DIR_PACKAGE keys on ${MULTIMACH_TARGET_SYS}/${PN}, and
# same MACHINE + same recipe (linux-raspberrypi at 6.6 here vs 6.12 in the
# default mc) means both mcs would write to identical paths. Whichever mc
# runs first wins, and the second trips `version-going-backwards` when its
# PV is lower (6.6 < 6.12 → fail on kernel, kernel-base, kernel-image, every
# subpackage). Anchoring BUILDHISTORY_DIR under TMPDIR ties this isolation
# to the same knob as everything else per-mc.
#
# Jetson L4T sidesteps this without an override because its two kernels are
# different recipes (linux-yocto vs linux-jammy-nvidia-tegra), so ${PN}
# differs and the buildhistory paths don't collide. Same-recipe-different-
# version multi-kernel (this case) needs the explicit split.
BUILDHISTORY_DIR = "${TMPDIR}/buildhistory"
