# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Fixes for recipes in meta-python-ai, a layer only some Pi builds enable.
BBFILES_DYNAMIC += " \
    meta-python-ai:${LAYERDIR}/dynamic-layers/meta-python-ai/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-avocado-raspberrypi"
BBFILE_PATTERN_meta-avocado-raspberrypi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-raspberrypi = "9"

LAYERDEPENDS_meta-avocado-raspberrypi = "core"
LAYERSERIES_COMPAT_meta-avocado-raspberrypi = "wrynose"
