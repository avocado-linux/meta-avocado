#@TYPE: Machine
#@NAME: RaspberryPi 5 Development Board (64bit)
#@DESCRIPTION: Machine configuration for the RaspberryPi 5 in 64 bits mode

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd usb"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:raspberrypi5:"

require conf/machine/include/avocado.inc

require conf/machine/include/avocado-raspberrypi.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa76.inc
include conf/machine/include/rpi-base.inc

MACHINE_FEATURES += "pci"

# Ship GNU coreutils, iproute2, procps and util-linux instead of BusyBox.
# BusyBox's `ip` lacks options that iproute2-based network tooling relies on,
# and its applets cover fewer options than the GNU tools. oe-core's layer.conf
# expands this variable inside a SIGGEN_EXCLUDE_SAFE_RECIPE_DEPS entry, so it
# has to stay a single package name; the list lives in the packagegroup.
# systemd supplies the logger, so no syslog replacement is wanted.
VIRTUAL-RUNTIME_base-utils = "packagegroup-avocado-base-utils"
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Turn on the 40-pin header I2C bus (/dev/i2c-1 on GPIO 2 and 3). config.txt
# lives on the boot partition, so a runtime cannot enable it later; rpi-config
# writes dtparam=i2c1=on and dtparam=i2c_arm=on when this is set, the way the
# reTerminal machines do. i2c-dev has no modalias, so nothing loads it on its
# own; without it the bus has no /dev node.
ENABLE_I2C = "1"
KERNEL_MODULE_AUTOLOAD:append = " i2c-dev"

MACHINE_EXTRA_RRECOMMENDS += "\
    linux-firmware-rpidistro-bcm43455 \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
    linux-firmware-rpidistro-bcm43456 \
    bluez-firmware-rpidistro-bcm4345c5-hcd \
"

RPI_KERNEL_DEVICETREE = " \
    broadcom/bcm2712-rpi-5-b.dtb \
    broadcom/bcm2712-rpi-cm5-cm5io.dtb \
    broadcom/bcm2712-rpi-cm5-cm4io.dtb \
    broadcom/bcm2712-rpi-cm5l-cm5io.dtb \
    broadcom/bcm2712-rpi-cm5l-cm4io.dtb \
"

SDIMG_KERNELIMAGE ?= "kernel_2712.img"
SERIAL_CONSOLES ?= "115200;ttyAMA10"

VC4DTBO ?= "vc4-kms-v3d"

# When u-boot is enabled we need to use the "Image" format and the "booti"
# command to load the kernel
KERNEL_IMAGETYPE_UBOOT ?= "Image"
# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

UBOOT_MACHINE = "rpi_arm64_config"
