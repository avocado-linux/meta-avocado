#@TYPE: Machine
#@NAME: RaspberryPi 0 2 Wifi Development Board (64bit)
#@DESCRIPTION: Machine configuration for the RaspberryPi 0 2 Wifi in 64 bits mode

BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img sd"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:raspberrypi0-2w-64:raspberrypi3-64:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-raspberrypi.inc

include conf/machine/raspberrypi3-64.conf

MACHINE_EXTRA_RRECOMMENDS += "\
    linux-firmware-rpidistro-bcm43430 \
    linux-firmware-rpidistro-bcm43436 \
    linux-firmware-rpidistro-bcm43436s \
    bluez-firmware-rpidistro-bcm43430a1-hcd \
    bluez-firmware-rpidistro-bcm43430b0-hcd \
"

RPI_KERNEL_DEVICETREE = " \
    broadcom/bcm2710-rpi-zero-2.dtb \
"
