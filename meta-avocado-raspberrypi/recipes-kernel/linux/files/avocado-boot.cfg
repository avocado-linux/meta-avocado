# Architecture and Platform (essential)
CONFIG_ARM64=y
CONFIG_ARCH_BCM=y
CONFIG_ARCH_BCM2835=y
CONFIG_ARCH_BRCMSTB=y

# Core kernel features (boot essential)
CONFIG_SMP=y
CONFIG_PREEMPT=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y

# Memory and CPU (boot essential)
CONFIG_NR_CPUS=4
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_39=y

# Device Tree (essential for ARM boot)
CONFIG_OF=y
CONFIG_OF_OVERLAY=y

# Block layer (essential for storage)
CONFIG_BLOCK=y

# Essential filesystems only
CONFIG_BTRFS_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_OVERLAY_FS=y


# Essential storage for boot
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_BCM2835=y

# Essential I2C/SPI for hardware init
CONFIG_I2C=y
CONFIG_I2C_BCM2835=y
CONFIG_SPI=y
CONFIG_SPI_BCM2835=m

# Essential GPIO
CONFIG_GPIOLIB=y
CONFIG_GPIO_BCM_VIRT=y
CONFIG_GPIO_BRCMSTB=y
CONFIG_PINCTRL_BCM2835=y

# Essential clocks
CONFIG_COMMON_CLK=y
CONFIG_CLK_BCM2835=y

# Essential USB (likely needed for boot)
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_DWCOTG=y
CONFIG_USB_STORAGE=y

# Essential SCSI layer
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

# Basic networking (for network boot scenarios)
CONFIG_NET=y
CONFIG_INET=y
CONFIG_IP_PNP=y
CONFIG_IP_PNP_DHCP=y

# Essential power management
CONFIG_PM=y
CONFIG_CPU_IDLE=y

# Basic security
CONFIG_SECURITY=y

# Essential crypto for BTRFS
CONFIG_CRYPTO=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_AES=y

# Container basics (if using containers)
CONFIG_NAMESPACES=y
CONFIG_CGROUPS=y

# Essential drivers built-in
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y

# Memory management essentials
CONFIG_SLUB=y

# Essential timers
CONFIG_GENERIC_CLOCKEVENTS=y

# Essential interrupt handling
CONFIG_GENERIC_IRQ_CHIP=y

# DMA for MMC
CONFIG_DMA_ENGINE=y
CONFIG_DMA_BCM2835=y

# Mailbox for firmware communication
CONFIG_BCM2835_MBOX=y

# Power domain for hardware
CONFIG_BCM2835_POWER=y
CONFIG_RASPBERRYPI_POWER=y

# Reset controller
CONFIG_RESET_CONTROLLER=y
CONFIG_RESET_RASPBERRYPI=y

# PHY support for USB
CONFIG_GENERIC_PHY=y
CONFIG_PHY_BRCM_USB=y

# Basic thermal
CONFIG_THERMAL=y
CONFIG_BCM2835_THERMAL=y

# Essential RTC for system time
CONFIG_RTC_CLASS=y

# Basic console/TTY
CONFIG_TTY=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_UNIX98_PTYS=y

# Essential kernel features
CONFIG_SYSCTL=y
CONFIG_PRINTK=y
CONFIG_BUG=y
CONFIG_FUTEX=y
CONFIG_EPOLL=y
CONFIG_SIGNALFD=y
CONFIG_EVENTFD=y
CONFIG_SHMEM=y

# Essential compression for SquashFS
CONFIG_ZLIB_INFLATE=y
CONFIG_ZSTD_DECOMPRESS=y

# Essential decompression for initramfs
CONFIG_RD_GZIP=y
CONFIG_RD_LZ4=y
CONFIG_RD_ZSTD=y

# Initramfs support
CONFIG_BLK_DEV_INITRD=y

# LED support (essential for Raspberry Pi triggers)
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_TRIGGERS=y
