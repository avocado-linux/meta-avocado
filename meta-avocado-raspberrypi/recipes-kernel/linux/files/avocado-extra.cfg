CONFIG_VETH=m
CONFIG_VIRTIO_NET=m
CONFIG_WIREGUARD=m
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=m
CONFIG_USB_CONFIGFS_SERIAL=m
CONFIG_USB_CONFIGFS_ACM=m
CONFIG_USB_CONFIGFS_OBEX=m
CONFIG_USB_CONFIGFS_NCM=m
CONFIG_USB_CONFIGFS_ECM=m
CONFIG_USB_CONFIGFS_RNDIS=m
CONFIG_USB_CONFIGFS_EEM=m
CONFIG_USB_CONFIGFS_MASS_STORAGE=m
CONFIG_USB_CONFIGFS_F_LB_SS=m
CONFIG_USB_CONFIGFS_F_FS=m
CONFIG_USB_CONFIGFS_F_UAC1=m
CONFIG_USB_CONFIGFS_F_UAC2=m
CONFIG_USB_CONFIGFS_F_MIDI=m
CONFIG_USB_CONFIGFS_F_HID=m
CONFIG_USB_CONFIGFS_F_PRINTER=m
CONFIG_USB_LIBCOMPOSITE=m

# USB Serial Adapters
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m

# USB Ethernet host (iPhone Personal Hotspot over USB).
# usbnet is the parent framework; cdc_ether and cdc_ncm cover modern iOS;
# ipheth is the Apple-specific driver that activates the netdev once usbmuxd
# unlocks the device.
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDC_ETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_IPHETH=m

# Netfilter / NAT — required to share an upstream WAN (e.g. iPhone tether)
# out to a downstream LAN (Wi-Fi AP, Ethernet bridge).
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NETFILTER_XT_MATCH_STATE=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_TARGET_MASQUERADE=m
CONFIG_IP_NF_TARGET_REJECT=m
CONFIG_IP_NF_MANGLE=m

# nftables backend (iptables-nft / nft userspace)
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_IPV4=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
