image boot.vfat {
	vfat {
		file kernel8.img { image = "u-boot.bin" }
		files = {
			@BOOT-FILES@
		}
	}
  size = 128M
}

image @IMAGE@ {
	hdimage {
		partition-table-type = "hybrid"
		fill = "true"
	}

	partition ubootenv {
		image = "uboot.env"
		in-partition-table = "false"
		offset = 1M
		size = 128K
	}

	partition boot-a {
		image = "boot.vfat"
		partition-type-uuid = "F"
		bootable = "true"
		partition-type = 0xC
		offset = 2M
	}

	partition boot-b {
		image = "boot.vfat"
		in-partition-table = "false"
		partition-type-uuid = "F"
		bootable = "true"
		partition-type = 0xC
		offset = 130M
	}

	partition rootfs-a {
		image = "avocado-image-rootfs-@MACHINE@.rootfs.squashfs"
		partition-type-uuid = "F"
		offset = 386M
	}

	partition rootfs-b {
		image = "avocado-image-rootfs-@MACHINE@.rootfs.squashfs"
		partition-type-uuid = "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
		offset = 514M
	}

	partition var {
		image = "@VAR-IMG@"
		partition-uuid = "4d21b016-b534-45c2-a9fb-5c16e091fd2d"
		partition-type = 0x8300
		offset = 642M
	}
}
