# Hardware-specific drivers as modules so they appear as individual
# kernel-module-<name> packages in the feed and stay out of the minimal
# rootfs. Keep this fragment minimal -- the upstream linux-alif recipe's
# defconfig (devkit_e8_defconfig) captures the SoC-essential drivers.

# USB userspace devices (gadget-side, libusb consumers).
CONFIG_USB_GADGET=y
