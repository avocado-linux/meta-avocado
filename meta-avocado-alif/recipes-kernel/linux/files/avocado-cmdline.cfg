# Kernel command line for alif-e8-devkit.
#
# The board has no U-Boot / no extlinux loader; TF-A jumps straight to the
# XIP kernel using ARM_PRELOADED_DTB_BASE as the DTB. The DTB chosen{bootargs}
# would normally drive the cmdline, but to avoid maintaining a DTS patch
# against the vendor tree we set CONFIG_CMDLINE here and force it over any
# DT-supplied bootargs via CMDLINE_FORCE.
#
# Trade-off: this bakes a static cmdline into the kernel image, so per-device
# cmdline mutation (AVOCADO_DEVICE_ID, etc.) at provision time is not
# supported. Per-device config has to land in /var on the SD card and be
# picked up by an early-init unit.
CONFIG_CMDLINE="root=/dev/mmcblk1p2 rootwait console=ttyS0,115200 earlycon"
CONFIG_CMDLINE_FORCE=y
