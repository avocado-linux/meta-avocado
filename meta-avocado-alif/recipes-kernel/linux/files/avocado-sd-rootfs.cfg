# SD card rootfs support for alif-e8-devkit.
#
# linux-alif's apss-sd-boot DISTRO_FEATURE pulls in sd_boot.cfg from the
# vendor layer for SDIO controller bringup; this fragment adds the rootfs
# pieces avocado expects on top of that (ext4 for /var, GPT scan to find
# the rootfs partition, NLS for FAT compatibility on the boot slot).

CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_ASCII=y
CONFIG_NLS_UTF8=y
CONFIG_NLS_CODEPAGE_437=y
