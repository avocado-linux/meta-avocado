#@TYPE: Machine
#@NAME: Alif Ensemble E8 DevKit
#@DESCRIPTION: Avocado machine configuration for the Alif Ensemble E8 DevKit (Cortex-A32)
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

# Provisioning profiles supported on alif-e8-devkit:
#   serial -- bootstrap OSPI (TF-A bl32 + xipImage + DTB) via Alif SETOOLS
#             on the host. SETOOLS is closed-source; the user installs it
#             into the SDK container manually (see
#             recipes-bsp/alif-flash/files/README.md).
#   img    -- produce the SD card disk image only (no flashing).
#   sd     -- write the SD card via the host's USB SD reader.
STONE_PROVISIONING ?= "img sd serial"

# linux-alif and TF-A in meta-alif-ensemble key off the :devkit-e8 override.
# Yocto auto-prepends MACHINE (avocado-alif-e8-devkit); we add the vendor
# short name so the upstream :devkit-e8 conditional blocks fire.
MACHINEOVERRIDES =. "devkit-e8:"

# Bring in the vendor MACHINE definition (DEFAULTTUNE, KERNEL_DEVICETREE,
# TF-A platform, OSPI/HYPRAM addresses, etc.). BBPATH-resolved through
# meta-alif-ensemble's layer.conf.
require conf/machine/devkit-e8.conf

# Avocado base machine settings (image fstypes, STONE_PROVISIONING -> override
# synthesis). Required after the vendor conf so STONE_PROVISIONING expands
# into MACHINEOVERRIDES last and stone-<profile> overrides resolve.
require conf/machine/include/avocado.inc

# Family-shared Alif Ensemble bits (provider, KERNEL_IMAGETYPE, WKS suppression).
require conf/machine/include/alif-ensemble.inc

# Enable the kernel's MMC/SD config fragment (linux-alif keys this off
# DISTRO_FEATURES "apss-sd-boot"). The avocado rootfs lives on the SD card
# while TF-A + xipImage + DTB live in OSPI flash.
DISTRO_FEATURES:append = " apss-sd-boot"

MACHINE_FEATURES += "alif ensemble"
