# Build common modules so they appear as individual kernel-module-<name>
# packages in the feed and stay out of the minimal rootfs. The upstream
# meta-renesas / SolidRun defconfigs cover SoC-essential drivers; this
# fragment is for package-feed visibility and avocado runtime needs.

# nftables stack (avocado-runtime container networking).
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_COMPAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_CHAIN_NAT=m
CONFIG_NETFILTER_XT_MATCH_COMMENT=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_MATCH_MARK=m
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
CONFIG_NF_NAT=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_TARGET_REJECT=m
# Docker 28+'s "direct access filtering" writes a raw-table PREROUTING DROP
# rule for every container on the default bridge; without the raw table,
# `docker run` fails network setup with "can't initialize iptables table
# 'raw'" (same fix as meta-avocado-nxp/recipes-kernel/linux/files/avocado-netfilter.cfg).
CONFIG_IP_NF_RAW=m
CONFIG_BRIDGE_NETFILTER=m

# Container/virtual networking.
CONFIG_VETH=m
CONFIG_VIRTIO_NET=m
CONFIG_WIREGUARD=m

# CFS bandwidth (cpu.max for cgroup v2 / Kubernetes-style runtimes).
CONFIG_CFS_BANDWIDTH=y

# USB serial adapters (common dongles used with rzv2n carriers).
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m

# Input: joystick/HID device node.
CONFIG_INPUT_JOYDEV=m

# pstore + ramoops: DRAM-backed dmesg retention across resets.
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=m

# Camera sensors used on rzv2n-sr-som carriers (defensive — defconfig
# already builds these on SolidRun's 6.1 kernel, but explicit ensures
# the kernel-module-imx678 / kernel-module-imx334 packages stay in the
# feed if upstream defconfig drifts).
CONFIG_VIDEO_IMX678=m
CONFIG_VIDEO_IMX334=m
CONFIG_USB_VIDEO_CLASS=m

# Contiguous Memory Allocator — required for the Renesas reserved-memory
# carveouts (mmngr, drp_reserved, etc.) that DMA-capable peripherals use.
CONFIG_CMA=y
CONFIG_DMA_CMA=y
