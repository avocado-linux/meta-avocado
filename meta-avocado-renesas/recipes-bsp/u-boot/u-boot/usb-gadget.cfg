# USB gadget on the SoC's USB2.0 ch0 (J5003). One identity (the ids below,
# which ums-disk.sh finds the board by) serves both functions:
# - USB mass storage (`ums 0 mmc 0|1`): the emmc and sd provision profiles
#   write the disk image through it (ums-disk.sh).
# - fastboot: bootcmd's fallback, reached when neither the eMMC nor the
#   microSD carries an OS, or when a committed slot fails to boot (a slot on
#   trial resets toward rollback instead). Provisioning does not use it, and a
#   board in fastboot doesn't mean its disk is empty.
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_DOWNLOAD=y
CONFIG_USB_GADGET_VENDOR_NUM=0x18d1
CONFIG_USB_GADGET_PRODUCT_NUM=0x0d02
CONFIG_USB_GADGET_MANUFACTURER="Avocado"

CONFIG_CMD_USB_MASS_STORAGE=y

CONFIG_USB_FUNCTION_FASTBOOT=y
CONFIG_CMD_FASTBOOT=y
CONFIG_FASTBOOT=y
CONFIG_FASTBOOT_FLASH=y
CONFIG_FASTBOOT_FLASH_MMC=y
CONFIG_FASTBOOT_FLASH_MMC_DEV=0

# 1 GiB stage buffer at the top of DRAM (4 GiB DRAM, kernel loads at 0x48080000).
CONFIG_FASTBOOT_BUF_ADDR=0x60000000
CONFIG_FASTBOOT_BUF_SIZE=0x40000000

# Partition names recognised by `fastboot flash <name>`.
CONFIG_FASTBOOT_GPT_NAME="gpt"
CONFIG_FASTBOOT_MBR_NAME="mbr"

