# The Avocado boot flow compiled into U-Boot's default environment
# (board/solidrun/rzv2n/avocado.env, installed from env/avocado-rzv2n-sr-som.txt
# by u-boot_%.bbappend), and only the slot state taken from the saved one
# (CFG_ENV_FLAGS_LIST_STATIC, 0003-*.patch). The flow then ships inside the
# FIP and is updated with it over the air; a saved environment written at
# provision time could otherwise never change, and could redefine bootcmd.
CONFIG_ENV_SOURCE_FILE="avocado"
CONFIG_ENV_WRITEABLE_LIST=y
