# Redundant U-Boot environment in the eMMC's user area, in the gap between the
# GPT and the first partition (1 MiB). Offsets must match the stone manifest's
# uboot-env entry and fw_env.config (libubootenv). SolidRun's defconfig keeps
# it in SPI NOR; it holds the slot state the compiled-in boot flow reads and
# avocadoctl writes, so it lives where Linux reaches it (/dev/mmcblk0).
# CONFIG_ENV_IS_NOWHERE is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
CONFIG_ENV_IS_IN_MMC=y
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_SYS_MMC_ENV_PART=0
# U-Boot 2024.07 still spells it SYS_REDUNDAND_ENVIRONMENT; carry both names.
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x80000
CONFIG_ENV_OFFSET_REDUND=0xA0000
# Used by the boot flow.
CONFIG_CMD_SYSBOOT=y
CONFIG_CMD_PART=y
CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SAVEENV=y
CONFIG_CMD_GPT=y
# The flow itself is compiled in (env-compiled-in.cfg), so a blank or corrupt
# saved environment boots the same way, from slot A.
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="run avocado_os_disk avocado_bootcount avocado_boot_init avocado_bootchain avocado_boot; fastboot usb 0"
