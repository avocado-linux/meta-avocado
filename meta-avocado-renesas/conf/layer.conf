# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-renesas"
BBFILE_PATTERN_meta-avocado-renesas = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-renesas = "9"

LAYERDEPENDS_meta-avocado-renesas = "core"
LAYERSERIES_COMPAT_meta-avocado-renesas = "wrynose"

# Renesas RZ and SolidRun ship scarthgap-only branches (no walnascar or
# wrynose upstream as of 2026-11). Declare the pinned vendor layers wrynose
# compatible here instead of patching each fork; bbappends below carry any
# wrynose fix-ups.
LAYERSERIES_COMPAT_meta-rz-bsp:append = " wrynose"
LAYERSERIES_COMPAT_meta-rz-distro:append = " wrynose"
LAYERSERIES_COMPAT_solidrun-rz:append = " wrynose"
LAYERSERIES_COMPAT_solidrun-rz-v2n:append = " wrynose"
LAYERSERIES_COMPAT_meta-rz-boards:append = " wrynose"
LAYERSERIES_COMPAT_rz-drpai:append = " wrynose"

# Appends with no wrynose recipe: Renesas's weston 13 / GStreamer 1.22 VSP
# and Mali patches (wrynose carries weston 15 and GStreamer 1.28; this layer
# uses upstream mesa/panfrost), and SolidRun's drpb appends, whose recipes
# the pinned rzv2n_drp-ai_driver no longer ships.
BBMASK += "meta-rz-distro/recipes-graphics/wayland/weston_13\.0\.1\.bbappend"
BBMASK += "meta-rz-distro/recipes-multimedia/gstreamer/gstreamer1\.0.*_1\.22\.12\.bbappend"
BBMASK += "meta-rzv2n/dynamic-layers/rz-drpai/recipes-(drp/drpb|firmware/drpb-fw)/"

# OE-core wrynose makes patch-status (Upstream-Status) fatal; scarthgap only
# warned. The Renesas, SolidRun and DRP-AI layers' patches carry none. Keep
# it a warning for the recipes those layers patch.
RZ_VENDOR_PATCHED_PNS = "bayer2raw gstreamer1.0-plugins-bad gstreamer1.0-plugin-vspfilter \
    gstreamer1.0-plugin-vspmfilter kernel-module-mmngr kernel-module-qos kernel-module-udmabuf \
    kernel-module-vsp2driver linux-renesas linux-renesas-rt trusted-firmware-a u-boot weston"
ERROR_QA:remove = "${@'patch-status' if d.getVar('PN') in d.getVar('RZ_VENDOR_PATCHED_PNS').split() else ''}"
WARN_QA:append = "${@' patch-status' if d.getVar('PN') in d.getVar('RZ_VENDOR_PATCHED_PNS').split() else ''}"
