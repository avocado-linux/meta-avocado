#@TYPE: Machine
#@NAME: Renesas RZ/V2H Robot RDK
#@DESCRIPTION: Machine configuration for the Renesas RZ/V2H Robotic Development Kit (WS125-V2HRDKREFZ)

# The RDK has no USB-device/fastboot port (USB3.2 are host-only; the Micro-B is
# UART). Only serial (xSPI bootloader over SCIF) and SD (rootfs) provisioning
# apply; there is no eMMC-over-fastboot path.
STONE_PROVISIONING ?= "serial sd"
MACHINEOVERRIDES =. "rzv2h-rdk:"

require conf/machine/include/avocado.inc

require conf/machine/include/rzv2h-family.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

SERIAL_CONSOLES ?= "115200;ttySC0"

# Pin linux-renesas 6.12 explicitly (the BSP also ships 6.1). 6.12 is newer than
# the RDK upstream's own 6.10 kernel, so the RDK device tree forward-ports onto it.
PREFERRED_VERSION_linux-renesas = "6.12%"

PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_PLATFORM ?= "v2h"
# TODO(gap): RDK TF-A board variant unconfirmed. The BSP TF-A ships 'evk_1' for
# v2h; the RDK's shipped bl2/fip srecs imply a distinct board (Renesas-SST rz-atf
# exposes v2h_dev_1). 'evk_1' compiles generic v2h and is the safe known-building
# default until the RDK board def is vendored. Confirm against a build.
TFA_BOARD ?= "evk_1"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 fip"
BL2_BOOT_TARGET ?= "spi mmc esd"
EXTRA_IMAGEDEPENDS += " firmware-pack"

BL2_BASE_ADDR ?= "0x08103000"
BL2_ADJUST_VMA ?= "0x08101E00"
FIP_ADJUST_VMA ?= "0x0"

# U-Boot Configuration
# TODO(gap): the RDK u-boot defconfig is not in the BSP. 'rzv2h-evk-ver1' is the
# known-good v2h default; swap to an RDK defconfig once vendored from
# Renesas-SST/u-boot and confirmed against a build.
PREFERRED_VERSION_u-boot ?= "2024.07%"
UBOOT_CONFIG ??= "rzv2h-evk-ver1"
UBOOT_CONFIG[rzv2h-evk-ver1] = "rzv2h-evk-ver1_defconfig"

# flash writer
EXTRA_IMAGEDEPENDS += " flash-writer"

# Compile DTBs with symbols so U-Boot can apply overlays at runtime.
KERNEL_DTC_FLAGS += "-@"

# RDK device tree, forward-ported from Renesas-SST/linux-rz (branch
# ubuntu/rz-v2h-rdk, rzv2h-rdk-ver1.dts) onto linux-renesas 6.12 via the
# linux-renesas bbappend.
KERNEL_DEVICETREE = "renesas/r9a09g057h44-rzv2h-rdk.dtb"

# Machine configuration. The RDK base board exposes no onboard WiFi/BT and no USB
# gadget, so drop the SolidRun usbgadget/wifi/bluetooth features.
MACHINE_FEATURES = "opengles opencl mali-g31 rtc serial usbhost"

# Deploy both Image and Image.gz; the stone FAT boot partition references the
# flat Image (U-Boot booti convention on arm64).
KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image Image.gz"

# RDK system utilities and debugging, staged into the package feed by
# packagegroup-avocado-rzv2h-rdk-extra, which expands this variable. SolidRun-only
# WiFi/BT modules (brcmfmac/cyw43455/userspace-consumer) are intentionally
# dropped; the RDK WiFi/BT bring-up is TBD from the schematic/BOM. kernel-modules
# is not listed here because that packagegroup RDEPENDs on it directly.
MACHINE_EXTRA_RRECOMMENDS:append = " \
	ethtool \
	memtester \
	stress-ng \
	iperf3 \
	libgpiod \
	libgpiod-tools \
	pciutils \
	pciutils-ids \
	usbutils"
