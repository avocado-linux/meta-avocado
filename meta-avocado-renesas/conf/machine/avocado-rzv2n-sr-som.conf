#@TYPE: Machine
#@NAME: SolidRun RZ/V2N System on Module
#@DESCRIPTION: Machine configuration for SolidRun RZ/V2N SoM on HummingBoard IIOT

STONE_PROVISIONING ?= "serial emmc sd"
MACHINEOVERRIDES =. "rzv2n-sr-som:"

require conf/machine/include/avocado.inc

require conf/machine/include/rzv2n-family.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

SERIAL_CONSOLES ?= "115200;ttySC0"
PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_PLATFORM ?= "v2n"
# SolidRun's TF-A fork adds a board variant 'sr_som' specifically for this
# SoM (plat/renesas/rz/board/v2n_sr_som/). Their fork's build doc says:
#   make PLAT=v2n BOARD=sr_som BL33=u-boot.bin bl2 fip
# Their own meta-solidrun machine.conf still pins 'evk_1', but that compiles
# in zero board-specific code (LED/PMIC are gated by defaults that are off),
# so we pick the SR-SoM-aware variant explicitly.
TFA_BOARD = "sr_som"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 fip"
BL2_BOOT_TARGET ?= "spi mmc esd"
EXTRA_IMAGEDEPENDS += " firmware-pack"

BL2_BASE_ADDR ?= "0x08103000"
BL2_ADJUST_VMA ?= "0x08101E00"
FIP_ADJUST_VMA ?= "0x0"

# U-Boot Configuration
PREFERRED_VERSION_u-boot ?= "2024.07%"
UBOOT_CONFIG ??= "rzv2n-solidrun"
UBOOT_CONFIG[rzv2n-solidrun] = "rzv2n-solidrun_defconfig"

# flash writer
EXTRA_IMAGEDEPENDS += " flash-writer"

# Compile DTBs with symbols so U-Boot can apply overlays at runtime via
# `fdt apply` / extlinux.conf `fdtoverlays`. Without -@, the base DTB lacks
# the __symbols__ node and overlays referenced by extlinux.conf silently
# fail to apply.
KERNEL_DTC_FLAGS += "-@"

KERNEL_DEVICETREE = "renesas/r9a09g056n48-hummingboard-iiot.dtb \
		renesas/rzv2n-hummingboard-iiot-panel-dsi-WJ70N3TYJHMNG0.dtbo \
		renesas/rzv2n-hummingboard-iiot-csi-camera-imx678.dtbo \
		renesas/r9a09g056n48-solidsense-aiot.dtb \
		renesas/r9a09g056n48-rzv2n-evk.dtb"

# Machine configuration
MACHINE_FEATURES = "opengles opencl mali-g31 bluetooth rtc serial usbgadget usbhost wifi"

# Linux kernel configuration. Deploy both Image and Image.gz so the stone
# manifest's FAT boot partition can reference the uncompressed Image directly
# (U-Boot's sysboot/booti expect a flat Image on arm64 by convention).
KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image Image.gz"

# include drivers & support packages
# RZ/G2LC System on Module
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = " kernel-module-brcmfmac \
	kernel-module-brcmutil \
	kernel-module-btbcm \
	kernel-module-cfg80211 \
	kernel-module-hci-uart"

# HummingBoard
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = " kernel-module-userspace-consumer"

# include drivers & support packages
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = " linux-firmware-sr-rz-cyw43455"

# RZ/V2N default packages for system utilities and debugging
MACHINE_EXTRA_RRECOMMENDS:append = " kernel-modules \
	ethtool \
	memtester \
	stress-ng \
	iperf3 \
	libgpiod \
	libgpiod-tools \
	pciutils \
	pciutils-ids \
	iw \
	wpa-supplicant \
	wireless-regdb \
	bluez5 \
	bluez5-obex \
	usbutils"

