# Initramfs decompression -- must match AVOCADO_IMAGE_INITRAMFS_TYPE.
CONFIG_RD_ZSTD=y
CONFIG_RD_GZIP=y

# Root filesystem (squashfs / erofs / overlayfs).
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_ZIP=y
CONFIG_EROFS_FS_ZIP_LZ4=y

# Block device support.
CONFIG_BLK_DEV_LOOP=y
CONFIG_EFI_PARTITION=y

# /var btrfs.
CONFIG_BTRFS_FS=y

# zram is in AVOCADO_DEFAULT_DISTRO_FEATURES, so packagegroup-avocado-
# initramfs-modules auto-pulls kernel-module-zram-${KERNEL_VERSION}.
# The upstream linux-stm32mp defconfig doesn't set CONFIG_ZRAM, so build
# it (and its zsmallocator backend + the lzo+lz4 compressors zram offers)
# as modules so the package lands in the feed.
CONFIG_ZSMALLOC=m
CONFIG_ZRAM=m
CONFIG_ZRAM_DEF_COMP_LZORLE=y
CONFIG_CRYPTO_LZO=m
CONFIG_CRYPTO_LZ4=m
