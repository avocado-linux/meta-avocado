# Build hardware-specific drivers as modules so they appear as individual
# kernel-module-<name> packages in the feed and stay out of the minimal
# rootfs. Keep this fragment minimal -- the upstream linux-stm32mp recipe's
# defconfig already captures the SoC-essential drivers; this is for
# packagegroup-feed visibility, not bring-up.

# Wi-Fi / BT (bcm43xx on the DK board).
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y
CONFIG_BRCMFMAC_USB=y
CONFIG_BT_HCIUART=m
CONFIG_BT_BCM=m
CONFIG_BT_HCIUART_BCM=y

# CFG80211 / mac80211 as modules so the firmware-bcm43xx extension can pull
# them in as kernel-module-cfg80211 etc.
CONFIG_CFG80211=m
CONFIG_MAC80211=m

# USB userspace devices (gadget-side, libusb consumers).
CONFIG_USB_GADGET=y
