#@TYPE: Machine
#@NAME: STM32MP25 Discovery Kit
#@DESCRIPTION: Avocado machine configuration for the STM32MP257F-DK board
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

STONE_PROVISIONING ?= "sd emmc serial"

MACHINEOVERRIDES =. "stm32mp25-dk:stm32mp25-disco:stm32mp2common:stm32mp25common:"

require conf/machine/include/avocado.inc
require conf/machine/include/stm32mp2-family.inc

# Vendor BSP includes from meta-st-stm32mp. These pull in the shared stm32mp
# common machine settings (CPU tuning, DT plumbing, optee/tfa/u-boot wiring)
# the BSP layer expects. Keep them after avocado.inc so STONE_PROVISIONING is
# expanded into MACHINEOVERRIDES first.
include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

DEFAULTTUNE = "cortexa35"
require conf/machine/include/arm/armv8a/tune-cortexa35.inc

# Boot scheme and supported boot devices.
BOOTSCHEME_LABELS = "optee"
BOOTDEVICE_LABELS += "sdcard"

# External device tree pulls the ST-supplied stm32mp257f-dk DTB rather than
# the in-tree kernel one. Keep this on; the FAT boot partition references the
# DTB the BSP layer builds.
EXTERNAL_DT_ENABLED = "1"
STM32MP_DT_FILES_SDCARD += "stm32mp257f-dk"
EXTERNAL_DEVICETREE_SDCARD = "stm32mp257f-dk-ca35tdcid-ostl"
EXTERNAL_DEVICETREE_SDCARD =+ "stm32mp257f-dk-ca35tdcid-ostl-m33-examples"

# Default OP-TEE board configuration used during SDK generation.
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp2common = "stm32mp257f-dk.dts"

# Suppress the upstream WIC pipeline. Avocado provisions via stone profiles
# (sd / emmc / serial); the stone manifest carries the partition layout.
WKS_FILE = ""
WKS_IMAGE_FSTYPES = ""

# Machine features. splashscreen is intentionally omitted -- the upstream
# BSP's U-Boot config patches in CONFIG_SPLASH and references
# `__splash_u_boot_logo_begin`, but that linker section is populated by
# u-boot-stm32mp-splash via the WIC pipeline we suppress (WKS_FILE=""), so
# enabling it here triggers an undefined-reference link failure. Re-enable
# once we wire the splash recipe into our extlinux/stone deploy chain.
MACHINE_FEATURES += "watchdog bluetooth wifi"
MACHINE_FEATURES += "m33copro m0copro"

# DK board ships a bcm43xx Wi-Fi/BT combo; the upstream BSP packages this
# under linux-firmware-addons-bcm43xx for both radios.
BLUETOOTH_LIST += "linux-firmware-addons-bcm43xx"
WIFI_LIST += "linux-firmware-addons-bcm43xx"

# GPU / accelerated graphics gated on the user accepting ST's EULA.
MACHINE_FEATURES += "${@'gpu' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
MACHINE_FEATURES += "${@'openvx' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
MACHINE_FEATURES += "${@'opencl' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
MACHINE_FEATURES += "${@'vulkan' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"

# M33 service auto-start at boot for the DK board.
M33_BOARDS_START_AT_STARTUP = "stm32mp257f-dk"
M33_BOARDS_START_AT_STARTUP =+ "${@bb.utils.contains('EXTERNAL_DT_ENABLED', '1', 'stm32mp257f-dk-ca35tdcid-ostl', '', d)}"

# Drivers and supplemental packages baked into the rootfs.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = " kernel-module-brcmfmac \
    kernel-module-brcmutil \
    kernel-module-btbcm \
    kernel-module-cfg80211 \
    kernel-module-hci-uart"
