# U-Boot env source: nowhere (RAM-only).
# The bootloader chain is immutable post-flash; the OS image carries its own
# extlinux.conf on the boot partition, so no persistent env is needed.
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_IS_IN_MMC is not set
CONFIG_ENV_IS_NOWHERE=y

CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="setenv boot_targets mmc1 mmc0; run distro_bootcmd"

CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_PXE=y
CONFIG_CMD_SYSBOOT=y
CONFIG_BOOTSTD_FULL=y
