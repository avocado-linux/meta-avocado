CONFIG_SUPPORT_RAW_INITRD=y
CONFIG_LEGACY_IMAGE_FORMAT=y
CONFIG_EFI_PARTITION=y
CONFIG_PARTITION_TYPE_GUID=y

# Headless bring-up. The BSP's defconfig sets CONFIG_VIDEO=y, which makes
# drivers/video/video-uclass.c compile in `video_get_u_boot_logo()`. That
# function unconditionally references `__splash_u_boot_logo_begin`, a symbol
# normally emitted into the binary by the u-boot-stm32mp-splash recipe at
# link time. We don't run that recipe (it's WIC-pipeline-driven and we
# suppress the WIC pipeline), so the symbol stays undefined and U-Boot fails
# to link. Re-enable VIDEO once we wire u-boot-stm32mp-splash into our
# deploy chain (via a do_compile[depends] in u-boot-stm32mp_%.bbappend).
# CONFIG_VIDEO is not set
# CONFIG_DM_VIDEO is not set
# CONFIG_SPLASH_SCREEN is not set
# CONFIG_VIDEO_LOGO is not set
# CONFIG_BMP is not set
# CONFIG_CMD_BMP is not set
# CONFIG_FDT_SIMPLEFB is not set
