# Serves ${DEPLOY_DIR}/avocado-feed (mounted with the rest of DEPLOY_DIR at
# /deploy, so its ../rpm symlinks resolve). Any <release>/<channel>/ prefix
# maps to the feed root: the CLI's releasever never needs to match the build.
server {
    listen 80 default_server;
    autoindex on;

    location ~ ^/[^/]+/[^/]+/(.*/repodata/.*)$ {
        alias /deploy/avocado-feed/$1;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/[^/]+/[^/]+/(.*)$ {
        alias /deploy/avocado-feed/$1;
    }
}
