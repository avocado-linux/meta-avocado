services:
  package-repo:
    build:
      context: ../package-repo
      dockerfile: Containerfile
    environment:
      - AVOCADO_SDK_REPO_RELEASE=${AVOCADO_SDK_REPO_RELEASE:-dev}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-true}
    ports:
      - "8080:80"
    volumes:
      - ${DEPLOY_DIR}/rpm:/repo:ro
    networks:
      - avocado-sdk-network
    healthcheck:
      # Command to run inside the container to check health
      # Here we try to curl the base URL. Adjust if your repo server needs a different check.
      # '-f' fails silently on HTTP errors but returns non-zero exit code
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 1s  # Check every 1 seconds
      timeout: 2s    # Wait up to 2 seconds for the check to complete
      retries: 10     # Try 10 times before marking as unhealthy
      start_period: 20s # Grace period for startup before first check failure counts

  sdk:
    image: avocadolinux/sdk:dev
    environment:
      - AVOCADO_SDK_TARGET=${AVOCADO_SDK_TARGET:-qemux86-64}
      - AVOCADO_SDK_REPO_URL=${AVOCADO_SDK_REPO_URL:-http://package-repo}
      - AVOCADO_SDK_REPO_RELEASE=${AVOCADO_SDK_REPO_RELEASE:-dev}
    depends_on:
      package-repo:
        condition: service_healthy
    entrypoint: entrypoint.sh
    volumes:
      - ./:/opt/_avocado/src:ro
      - ./_avocado:/opt/_avocado:rw
    networks:
      - avocado-sdk-network

networks:
  avocado-sdk-network:
    name: avocado-sdk-network
