[Unit]
# Module loading first: on L4T 6.8, i2c-dev comes from modules-load.d.
After=systemd-modules-load.service

[Service]
# The I2C controller loads from udev, which nothing here orders after, so
# wait up to 30 s for tegra-boardspec to read the module EEPROM. Poll the
# tool rather than a device path: the EEPROM is on bus 0 on T234 and bus 1
# on T264, and the tool reads it through at24's sysfs file or /dev/i2c-N.
# On timeout ExecStart still runs and logs its own error.
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 30 ]; do [ -n "$$(tegra-boardspec 2>/dev/null)" ] && exit 0; i=$$((i + 1)); sleep 1; done; exit 0'
