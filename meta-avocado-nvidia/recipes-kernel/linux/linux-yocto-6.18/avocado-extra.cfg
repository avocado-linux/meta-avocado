CONFIG_GPIO_PCA953X=m
CONFIG_CRYPTO_CRCT10DIF_ARM64_CE=m

# I2C MUX support for camera
CONFIG_I2C_MUX=m
CONFIG_I2C_MUX_GPIO=m
CONFIG_DRM=m
CONFIG_NETFILTER_XT_MATCH_COMMENT=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
CONFIG_NETFILTER_XT_MATCH_MARK=m
CONFIG_NF_NAT=m
CONFIG_IP_NF_NAT=m
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
CONFIG_BRIDGE_NETFILTER=m
CONFIG_SND_HDA_CODEC_HDMI=m
CONFIG_WIREGUARD=m
CONFIG_VIDEO_IMX334=m

# USB Serial Adapters
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m

# USB Gadget (required for tegraflash initrd provisioning)
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_F_MASS_STORAGE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_R8169=m
CONFIG_NET_VENDOR_REALTEK=y
CONFIG_REALTEK_PHY=m

# Crypto modules
CONFIG_CRYPTO_AES_ARM64_CE=m
CONFIG_CRYPTO_CRCT10DIF=m
CONFIG_CRYPTO_GHASH_ARM64_CE=m
CONFIG_CRYPTO_SHA1_ARM64_CE=m
CONFIG_CRYPTO_SHA2_ARM64_CE=m
CONFIG_CRYPTO_SHA256_ARM64=m

# DRM display helper
CONFIG_DRM_DISPLAY_HELPER=m

# GPIO keys
CONFIG_KEYBOARD_GPIO=m

# GPIO-backed PWM (software PWM on a GPIO line). Deps CONFIG_PWM and
# CONFIG_GPIOLIB are already =y in the linux-yocto 6.18 base config.
CONFIG_PWM_GPIO=m

# Network scheduler
CONFIG_NET_SCH_FQ_CODEL=m

# CFS bandwidth control (required for K3s/Kubernetes cpu.max cgroup v2 support)
CONFIG_CFS_BANDWIDTH=y

CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_COMPAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_CHAIN_NAT=m

# NFS Server
CONFIG_NFSD=m
CONFIG_NFSD_V4=y

# Intel 10GbE NIC (Advantech MIC-733-AO6A1 carrier ships an ixgbe-class adapter)
CONFIG_IXGBE=m

# Intel 1GbE NIC (Advantech MIC-712OX carrier: I210 management port + 6x I350
# PoE ports behind an ASMedia PCIe switch -- all driven by igb). The linux-yocto
# tegra defconfig leaves CONFIG_IGB unset, so without this the MIC-712OX has no
# management Ethernet and no PoE-port data path. CONFIG_NET_VENDOR_INTEL=y and
# CONFIG_I2C_ALGOBIT=m (igb's SFP i2c bit-bang) are already in the base config.
CONFIG_IGB=m

# Realtek RTL8852BE Wi-Fi 6 M.2 card (one of the two modules Seeed's wiki lists
# for Jetson). The feed already carries the rtw89 modules for the 8852C chips
# but none for this one. RTW89_8852BE sits inside the RTW89 menu, so RTW89 is
# set too; it selects RTW89_CORE, RTW89_PCI and the 8852B chip code. Firmware
# ships in linux-firmware-rtl8852.
CONFIG_RTW89=m
CONFIG_RTW89_8852BE=m
