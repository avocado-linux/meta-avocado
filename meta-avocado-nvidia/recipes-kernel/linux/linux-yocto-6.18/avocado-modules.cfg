# Driver coverage for Jetson boards on linux-yocto 6.18: hardware the L4T 6.8
# kernel supports that this kernel had no driver for at all. Each was unset
# here (never a built-in turned into a module), and each is a module, so the
# base image does not grow; the kernel-module packages land in the feed.
#
# CDC-ACM serial and joydev are enabled by avocado-extra.cfg.

# CAN: Bosch M_CAN (platform), and the MCP251xFD SPI CAN-FD controller common
# on carrier boards and add-on hats.
CONFIG_CAN_M_CAN=m
CONFIG_CAN_M_CAN_PLATFORM=m
CONFIG_CAN_MCP251XFD=m

# Network: Intel X5xx SR-IOV VF, Aquantia AQC10x/11x 10GbE (Atlantic), and the
# common USB adapters (Microchip LAN78xx, Prolific host-to-host, iPhone tether).
CONFIG_IXGBEVF=m
CONFIG_AQTION=m
CONFIG_USB_LAN78XX=m
CONFIG_USB_NET_PLUSB=m
CONFIG_USB_IPHETH=m

# Storage: NVMe over TCP (initiator and target) and device-mapper multipath.
CONFIG_NVME_TCP=m
CONFIG_NVME_TARGET_TCP=m
CONFIG_DM_MULTIPATH=m

# Traffic control: generic actions (tc ... action drop/pass), used by
# container networking and QoS setups.
CONFIG_NET_ACT_GACT=m

# Sensors and inputs found on carriers: LM75-class and JEDEC JC42 temperature
# sensors, GPIO-driven fans, and polled GPIO buttons.
CONFIG_SENSORS_LM75=m
CONFIG_SENSORS_JC42=m
CONFIG_SENSORS_GPIO_FAN=m
CONFIG_KEYBOARD_GPIO_POLLED=m
