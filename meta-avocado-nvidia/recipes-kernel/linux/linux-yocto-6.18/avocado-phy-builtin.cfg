# PHY drivers the Jetson carriers' Ethernet MACs need while they probe.
# nvethernet loads from the initramfs and attaches its PHY right away. A PHY
# driver that is only a module in a later extension misses that moment and the
# PHY stays on the generic driver for the whole boot, so ethtool reports no wake
# support (the generic drivers have no get_wol).
# Measured on an AGX Orin image: at boot the 10G port was on "Generic Clause 45
# PHY" and the 1G port on "Generic PHY"; the 10G port moved to the Aquantia
# driver only after a module load and a rebind, and the 1G port stayed generic.
# A modprobe.d softdep in a later extension did not help, because the PHYs
# attach before that extension is merged.
CONFIG_AQUANTIA_PHY=y
CONFIG_DP83867_PHY=y
