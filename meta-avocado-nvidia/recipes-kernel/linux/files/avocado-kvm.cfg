# KVM host. Shared by all four Jetson kernels.
#
# Built in because it cannot be anything else: arm64 KVM is a bool (its hyp
# code has to be in place before EL2 is given up). It costs nothing until a
# VMM opens /dev/kvm, and `kvm-arm.mode=none` turns it off at boot. The pieces
# that can be modules are (vhost_net, vfio-pci in the per-family fragments),
# so a project opts in by installing them and qemu-system-aarch64.
#
# Stated here because meta-tegra's enable-preempt-rt.cfg turns KVM off for the
# L4T RT kernel; this fragment is applied after it. do_configure checks it
# survived.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
