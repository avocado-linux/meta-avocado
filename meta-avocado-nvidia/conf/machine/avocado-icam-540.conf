#@TYPE: Machine
#@NAME: Advantech ICAM-540
#@DESCRIPTION: Advantech ICAM-540

require conf/machine/include/avocado-jetson.inc
require conf/machine/include/avocado.inc

MACHINEOVERRIDES =. "icam-540:"
AVOCADO_VAR_PART_DEV = "/dev/nvme0n1p16"

TNSPEC_BOOTDEV ?= "nvme0n1p1"
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

TEGRA_BOARDSKU = "0001"
KERNEL_ARGS = "mminit_loglevel=4 console=ttyTCU0,115200 firmware_class.path=/etc/firmware fbcon=map:0 nospectre_bhb console=tty0 usbcore.usbfs_memory_mb=1000 audit=0"
KERNEL_DEVICETREE = "tegra234-p3768-0000+p3767-${TEGRA_BOARDSKU}.dtb"
EXTERNAL_KERNEL_DEVICETREE = "${DEPLOY_DIR_IMAGE}/devicetree"

# Tegraflash overlay DTBs for this machine
# OVERLAY_DTB_FILE: Runtime overlays passed via --overlay_dtb to tegraflash
# TEGRA_DCE_OVERLAY: DCE-specific overlays passed via --dce_overlay_dtb to tegraflash
OVERLAY_DTB_FILE = "tegra234-p3768-0000+p3767-0000-dynamic.dtbo,tegra234-dcb-p3767-0000-hdmi.dtbo"
TEGRA_DCE_OVERLAY = "tegra234-dcb-p3767-0000-hdmi.dtbo"
# Override TEGRA_PLUGIN_MANAGER_OVERLAYS to exclude the dynamic overlay
# We provide our custom ICAM-540 version via OVERLAY_DTB_FILE instead
TEGRA_PLUGIN_MANAGER_OVERLAYS = "tegra234-carveouts.dtbo tegra-optee.dtbo"
TEGRA_FLASHVAR_BPFDTB_FILE = "tegra234-bpmp-3767-${TEGRA_BOARDSKU}-3768-super.dtb"
EMMC_BCT = "tegra234-p3767-${TEGRA_BOARDSKU}-sdram-l4t.dts"
WB0SDRAM_BCT = "tegra234-p3767-${TEGRA_BOARDSKU}-wb0sdram-l4t.dts"

require conf/machine/include/orin-nx.inc
require conf/machine/include/devkit-wifi.inc
