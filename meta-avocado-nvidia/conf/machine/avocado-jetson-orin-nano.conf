#@TYPE: Machine
#@NAME: Nvidia Jetson Orin Nano devkit
#@DESCRIPTION: Nvidia Jetson Orin Nano devkit using NVMe drive for rootfs

require conf/machine/include/avocado-jetson.inc
require conf/machine/include/avocado.inc

MACHINEOVERRIDES =. "jetson-orin-nano:"

TNSPEC_BOOTDEV ?= "nvme0n1p1"
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

require conf/machine/include/orin-nano.inc
require conf/machine/include/devkit-wifi.inc

# console=ttyTCU0 is restated so it is the LAST console= on the line. printk
# goes to every registered console, but /dev/console follows the last one, and
# orin-nano.inc ends its list with console=tty0 while also setting
# video=efifb:off. That combination gives userspace a console it cannot render
# to: the board boots and reaches a login prompt that is invisible on the only
# attached console, which reads as a silent hang with no panic (#398).
KERNEL_ARGS:append = " audit=0 nvme_core.default_ps_max_latency_us=0 pcie_aspm=off console=ttyTCU0,115200"
KERNEL_MODULE_AUTOLOAD:append = " nvme"
