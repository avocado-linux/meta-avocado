#@TYPE: Machine
#@NAME: Nvidia Jetson Orin NX
#@DESCRIPTION: Generic Jetson Orin NX SOM target. Bases on the meta-tegra
# orin-nx.inc + devkit-wifi.inc reference design (P3768 carrier) so the
# resulting tegraflash-bsp output ships every P3767 SKU's DTB / BCT / BPMP
# DTB. SOM-SKU and carrier specifics are selectable at provision time via
# a BSP extension's carrier-bsp overlay (see stone-jetson-orin-nx.json's
# tegraflash_carrier_bsp images entry and stone-provision-tegraflash.sh).

require conf/machine/include/avocado-jetson.inc
require conf/machine/include/avocado.inc

# Build a zstd-compressed runtime initramfs, overriding the Jetson-family
# cpio.gz default in avocado-jetson.inc. On the wrynose kernels the gz variant
# comes out empty while the image tooling emits a working .cpio.zst; the
# stone manifest and the extlinux initrd both follow this via
# AVOCADO_IMAGE_INITRAMFS_TYPE. The flash-time cpio.gz.cboot (boot.img) is
# unaffected -- INITRAMFS_FSTYPES still carries it.
AVOCADO_IMAGE_INITRAMFS_TYPE = "cpio.zst"

MACHINEOVERRIDES =. "jetson-orin-nx:"

TNSPEC_BOOTDEV ?= "nvme0n1p1"
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

require conf/machine/include/orin-nx.inc
require conf/machine/include/devkit-wifi.inc

KERNEL_ARGS:append = " audit=0 nvme_core.default_ps_max_latency_us=0 pcie_aspm=off"
KERNEL_MODULE_AUTOLOAD:append = " nvme"
