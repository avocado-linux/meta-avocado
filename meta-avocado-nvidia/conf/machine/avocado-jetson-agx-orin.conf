#@TYPE: Machine
#@NAME: Nvidia Jetson AGX Orin
#@DESCRIPTION: Generic Jetson AGX Orin SOM target (P3701-0005 64GB module, the
# SKU TEGRA_BOARDSKU pins) on the P3737-0000 devkit reference carrier
# (agx-orin.inc + p3737.inc); NVMe rootfs. Carrier/SOM-SKU specifics are
# selectable at provision time via a BSP extension's carrier-bsp overlay.

require conf/machine/include/avocado-jetson.inc
require conf/machine/include/avocado.inc

TEGRA_BUPGEN_SPECS ?= "fab=300;boardsku=0000;boardrev=;chipsku=00:00:00:D0;bup_type=bl \
                       fab=300;boardsku=0000;boardrev=;bup_type=kernel"
# devtool-debt: the kernel tree is chosen at build time from TEGRA_BOARDSKU.
# Ceiling: one module SKU per target (the CHECK_BOARDSKU pin).
# Upgrade trigger: a carrier or target drops the SKU pin, or flashes another P3701 SKU under the stock tree name; then select the tree at flash time in the T234 helper.
KERNEL_DEVICETREE ?= "tegra234-p3737-0000+p3701-${TEGRA_BOARDSKU}-nv.dtb"

MACHINEOVERRIDES =. "jetson-agx-orin:"

TNSPEC_BOOTDEV ?= "nvme0n1p1"
TEGRA_BOARDSKU ?= "0005"

PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

# Build a zstd-compressed runtime initramfs, overriding the Jetson-family
# cpio.gz default in avocado-jetson.inc. On the wrynose kernels the gz variant
# comes out empty while the image tooling emits a working .cpio.zst; the
# stone manifest and the extlinux initrd both follow this via
# AVOCADO_IMAGE_INITRAMFS_TYPE. The flash-time cpio.gz.cboot (boot.img) is
# unaffected -- INITRAMFS_FSTYPES still carries it.
AVOCADO_IMAGE_INITRAMFS_TYPE = "cpio.zst"

require conf/machine/include/agx-orin.inc
require conf/machine/include/p3737.inc

# console=ttyTCU0 restated last so it wins /dev/console. The meta-tegra base
# line ends with console=tty0 (and sets video=efifb:off), which gives userspace
# a console it cannot render to: a login prompt invisible on the serial port.
KERNEL_ARGS:append = " audit=0 nvme_core.default_ps_max_latency_us=0 pcie_aspm=off cma=512M console=ttyTCU0,115200"
KERNEL_MODULE_AUTOLOAD:append = " nvme"
