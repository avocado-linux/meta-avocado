# Multiconfig: jetson-l4t
#
# Builds the L4T 5.15 kernel (linux-jammy-nvidia-tegra) for the same MACHINE
# the default mc is building. Used to populate a multi-kernel feed alongside
# the default linux-yocto so avocado-cli's kernel.version resolver and
# auto-append of packagegroup-avocado-{rootfs,initramfs}-modules-${KERNEL_VERSION}
# can be exercised against a real two-kernel feed.
#
# MACHINE is intentionally NOT set here — it is inherited from the default
# multiconfig, so a single conf works for every Jetson machine in the family
# (orin-nano, orin-agx, recomputer-j301x/j401x, reterminal, etc.).
#
# Activate via the kas/feature/multi-kernel-jetson.yml overlay (which sets
# BBMULTICONFIG and adds the mc:jetson-l4t:* bitbake targets).

# `:forcevariable` is required: meta-avocado-nvidia/conf/machine/include/
# avocado-jetson.inc:5 hard-assigns PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
# and is loaded by every Jetson machine conf after this multiconfig conf.
# A plain `=` here gets clobbered; `:forcevariable` is the highest-precedence
# override and wins regardless of load order.
PREFERRED_PROVIDER_virtual/kernel:forcevariable = "linux-jammy-nvidia-tegra"

# Same MACHINE in two multiconfigs collides on bitbake's per-recipe WORKDIR:
#   ${TMPDIR}/work/<machine_arch>-<vendor>-<os>/<recipe>/<pv>-<pr>/
# is keyed on MACHINE_ARCH but not on multiconfig name. As soon as a recipe's
# signature differs across mcs (any recipe that depends on virtual/kernel:
# linux-yocto vs linux-jammy-nvidia-tegra → make-mod-scripts, kernel-devsrc,
# nvidia-kernel-oot, etc.), the two mcs race the same physical path and the
# parse-/configure-/compile-stage tasks stomp on each other's recipe-sysroot
# and source trees. Per-mc TMPDIR gives this mc its own tmp tree.
#
# DEPLOY_DIR_RPM and other sub-trees inherit ${TMPDIR}, so they're per-mc too.
# That deliberately avoids bitbake's "shared-area collision" detection which
# fires whenever two mcs produce the same NEVRA for sysroot recipes (glibc,
# libgcc, linux-libc-headers, gcc-runtime, ...). Their sigs differ across
# mcs (TMPDIR is in basehash for some recipes via subtle paths), so sstate
# can't dedupe; a shared DEPLOY_DIR_RPM would have both mcs trying to write
# the same .rpm files. With per-mc DEPLOY_DIR_RPM, each mc writes to its own
# tree and a post-build merge step composes the unified feed.
#
# Production Pulp uploads handle this naturally: avocado-pulp-upload.bbclass
# uploads each recipe's RPMs into a Pulp repo keyed on release/channel + arch
# (NOT on TMPDIR), so both mcs' RPMs land in the same Pulp repo without any
# explicit merge. Local-feed users (_repo/) need to rsync-merge tmp-jetson-l4t/
# deploy/rpm into tmp/deploy/rpm after the build (see kas overlay).
TMPDIR = "${TOPDIR}/tmp-jetson-l4t"
