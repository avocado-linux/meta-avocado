# Multiconfig: jetson-rt
#
# Builds oe-core's PREEMPT_RT kernel (linux-yocto-rt 6.18) for the same MACHINE
# the default mc is building, so the published feed carries it alongside the
# stock linux-yocto and avocado-cli's kernel.version resolver can pick between
# them. The L4T family gets the same treatment from jetson-l4t-rt.conf.
#
# Both kernels are the same upstream 6.18 yocto-kernel tree on different
# KBRANCHes (v6.18/standard/base vs v6.18/standard/preempt-rt/base), but they
# are separate recipes with separate PNs, so this switches the provider (the
# jetson-l4t shape) rather than pinning a version (the Raspberry Pi shape).
#
# MACHINE is intentionally NOT set here -- it is inherited from the default
# multiconfig, so a single conf works for every Jetson machine in the family
# (orin-nano, orin-nx, agx-orin, agx-thor, recomputer-j301x/j401x, icam-540).
#
# Activate via the kas/feature/multi-kernel-jetson.yml overlay (which sets
# BBMULTICONFIG and adds the mc:jetson-rt:* entries to
# AVOCADO_MULTIKERNEL_MC_RECIPES).

# `:forcevariable` is required: meta-avocado-nvidia/conf/machine/include/
# avocado-jetson.inc hard-assigns PREFERRED_PROVIDER_virtual/kernel =
# "linux-yocto" and is loaded by every Jetson machine conf after this
# multiconfig conf. A plain `=` here gets clobbered; `:forcevariable` is the
# highest-precedence override and wins regardless of load order.
#
# It also has to be visible as a plain getVar: oe-core's linux-yocto-rt_6.18.bb
# opens with a SkipRecipe guard that reads PREFERRED_PROVIDER_virtual/kernel
# and skips itself unless it is the preferred provider. In every other mc that
# guard is what keeps this recipe out of the graph.
PREFERRED_PROVIDER_virtual/kernel:forcevariable = "linux-yocto-rt"

# Same MACHINE in two multiconfigs collides on bitbake's per-recipe WORKDIR:
#   ${TMPDIR}/work/<machine_arch>-<vendor>-<os>/<recipe>/<pv>-<pr>/
# is keyed on MACHINE_ARCH but not on multiconfig name. As soon as a recipe's
# signature differs across mcs (anything depending on virtual/kernel:
# make-mod-scripts, kernel-devsrc, nvidia-kernel-oot, ...), the mcs race the
# same physical path and stomp on each other's recipe-sysroot and source trees.
# Per-mc TMPDIR gives this mc its own tree.
#
# DEPLOY_DIR_RPM and the other sub-trees inherit ${TMPDIR}, so they are per-mc
# too. That deliberately avoids bitbake's shared-area collision detection, which
# fires whenever two mcs write the same NEVRA for sysroot recipes (glibc, libgcc,
# linux-libc-headers, gcc-runtime, ...). Their signatures differ across mcs so
# sstate cannot dedupe them; each mc writes to its own tree and
# do_multikernel_merge composes the unified local feed afterward.
#
# Production Pulp uploads need no merge at all: avocado-pulp-upload.bbclass
# uploads each recipe's RPMs into a repo keyed on release/channel + arch, not on
# TMPDIR, so every mc's RPMs land in the same repo on their own.
TMPDIR = "${TOPDIR}/tmp-jetson-rt"

# BUILDHISTORY_DIR defaults to ${TOPDIR}/buildhistory, which is NOT under
# TMPDIR, so the isolation above does not carry it along.
# BUILDHISTORY_DIR_PACKAGE keys on ${MULTIMACH_TARGET_SYS}/${PN}: the shared
# helper recipes that keep one ${PN} across mcs (make-mod-scripts,
# kernel-devsrc, nvidia-kernel-oot, ...) would write the same path from each mc
# with a different AUTOPR -- each mc's distinct taskhash gets its own PR from
# the PR server -- and buildhistory reports a spurious "version went backwards"
# failure. All the PRs are legitimate, so track them per-mc. Same override as
# jetson-l4t.conf, jetson-l4t-rt.conf, qcom-rt.conf and raspberrypi-6_6.conf;
# any same-MACHINE multi-kernel mc needs it.
BUILDHISTORY_DIR = "${TMPDIR}/buildhistory"
