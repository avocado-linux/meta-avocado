# Multiconfig: jetson-l4t-rt
#
# Builds NVIDIA's PREEMPT_RT L4T kernel (linux-noble-nvidia-tegra-rt 6.8) for
# the same MACHINE the default mc is building. This is the RT sibling of the
# jetson-l4t mc, the way jetson-rt is the RT sibling of the default mc, so a
# Jetson feed carries four kernels: stock and RT of each tree.
#
# meta-tegra's linux-noble-nvidia-tegra-rt_6.8.bb is `require
# linux-noble-nvidia-tegra.inc` plus TEGRA_LINUX_VERSION_EXTENSION = "-rt" and
# enable-preempt-rt.cfg -- a separate recipe with a separate PN, so this
# switches the provider rather than pinning a version.
#
# MACHINE is intentionally NOT set here -- it is inherited from the default
# multiconfig, so a single conf works for every Jetson machine in the family.
#
# Activate via the kas/feature/multi-kernel-jetson.yml overlay (which sets
# BBMULTICONFIG and adds the mc:jetson-l4t-rt:* entries to
# AVOCADO_MULTIKERNEL_MC_RECIPES).

# `:forcevariable` for the same reason as jetson-l4t.conf: avocado-jetson.inc
# hard-assigns PREFERRED_PROVIDER_virtual/kernel = "linux-yocto" and is loaded
# after this file, so a plain `=` here would be clobbered.
PREFERRED_PROVIDER_virtual/kernel:forcevariable = "linux-noble-nvidia-tegra-rt"

# Per-mc TMPDIR: same WORKDIR-collision and shared-area reasoning as
# jetson-rt.conf and jetson-l4t.conf. With four multiconfigs on one MACHINE,
# every one of them needs its own tmp tree -- they differ only in which
# virtual/kernel they resolve, which is precisely the signature difference that
# makes them race.
TMPDIR = "${TOPDIR}/tmp-jetson-l4t-rt"

# Per-mc buildhistory: see jetson-rt.conf for why ${TOPDIR}/buildhistory does
# not follow TMPDIR and why the shared helper recipes' legitimate per-mc AUTOPRs
# otherwise read as "version went backwards".
BUILDHISTORY_DIR = "${TMPDIR}/buildhistory"
