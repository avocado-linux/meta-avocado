header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/oe.yml
  - repo: meta-avocado
    file: kas/vendor/ptx.yml
  - repo: meta-avocado
    file: kas/vendor/fwup.yml

env:
  AVOCADO_REPO_BASE: "http://package-repo"
  DISTRO_CODENAME: "dev"
  DISTRO_VERSION: "0.1.0"
  PARALLEL_MAKE_HIGHMEM: ""
  SDKMACHINE: "x86_64"

repos:
  meta-openembedded:
    url: https://github.com/avocado-linux/vendor-meta-openembedded
    path: meta-openembedded
    branch: scarthgap
    commit: e8fd97d86af86cdcc5a6eb3f301cbaf6a2084943
    layers:
      meta-oe:
      meta-perl:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:

  meta-lts-mixins:
    url: https://github.com/avocado-linux/vendor-meta-lts-mixins
    path: meta-lts-mixins
    branch: scarthgap/rust
    commit: 65c51abe3871d50e599366765838d1478eba093e
    layers:
      .:

  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:
      meta-avocado-shared:

distro: avocado

local_conf_header:
  meta-avocado: |
    USER_CLASSES:append = " buildhistory buildstats buildstats-summary"

    ## Debugging prior to extensions loading
    #EXTRA_IMAGE_FEATURES += " allow-empty-password allow-root-login empty-root-password post-install-logging"
    #EXTRA_INITRAMFS_FEATURES += " allow-empty-password allow-root-login empty-root-password post-install-logging"
    ## Debugging Extensions
    #ROOTFS_IMAGE_EXTRA_INSTALL:append = " avocado-extension-debug-tweaks"

  sdk: |
    CONF_VERSION = "2"
