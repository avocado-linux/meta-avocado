header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/oe.yml

env:
  AVOCADO_REPO_BASE: "http://package-repo"
  DISTRO_CODENAME: "dev/local"
  DISTRO_VERSION: "0.0.0"
  BUILD_ID: "0"
  PARALLEL_MAKE_HIGHMEM: ""
  SDKMACHINE: "x86_64"
  AVOCADO_DEV_ROOT_LOGIN: "0"
  AVOCADO_RM_WORK: "1"

repos:
  meta-openembedded:
    url: https://github.com/avocado-linux/vendor-meta-openembedded
    path: meta-openembedded
    branch: wrynose
    commit: 420222862f5a6d95023b8f5f3b7e1808b2264ef9
    layers:
      meta-oe:
      meta-perl:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-webserver:
      meta-multimedia:

  # wrynose: meta-lts-mixins backports rust to scarthgap; rust is in
  # OE-core natively from walnascar onward, so this layer is obsolete on
  # wrynose. Re-evaluate (and likely delete outright) once the wrynose
  # build is green. See docs/migrations/scarthgap-to-wrynose.md.
  # meta-lts-mixins:
  #   url: https://github.com/avocado-linux/vendor-meta-lts-mixins
  #   path: meta-lts-mixins
  #   branch: scarthgap/rust
  #   commit: c19b6da5a3afd3c892b3b1b44983e993ac6d5308
  #   layers:
  #     .:

  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:
      meta-avocado-shared:

  # Base vendor layers: always provisioned because meta-avocado-distro carries
  # unconditional bbappends/recipes that customize them (erlang, swupdate) or
  # always-on packages depend on them (fwup, cryptoauthlib in system-base).
  #
  # meta-atmel's wrynose branch is Avocado-authored (upstream stops at nanbield)
  # and only its layer.conf was ported: several of its recipes still fail to
  # parse on wrynose (S = ${WORKDIR}, missing swig.inc). cryptoauthlib is the
  # only thing consumed, so every other recipe directory is masked below.
  # meta-erlang's branch mirrors upstream.
  meta-atmel:
    url: https://github.com/avocado-linux/vendor-meta-atmel
    path: meta-atmel
    branch: wrynose
    commit: c556d36f808f75ac147c033f82f5ade24d87a1c1
    layers:
      .:

  meta-erlang:
    url: https://github.com/avocado-linux/vendor-meta-erlang
    path: meta-erlang
    branch: wrynose
    commit: e731185522a2da73e40929761e323ff2f8c20abc
    layers:
      .:

  meta-fwup:
    url: https://github.com/avocado-linux/vendor-meta-fwup.git
    path: meta-fwup
    commit: 0998acc313c44662410f397243eccec3936c8395
    branch: wrynose-avocado
    layers:
      .:

  meta-swupdate:
    url: https://github.com/avocado-linux/vendor-meta-swupdate.git
    path: meta-swupdate
    commit: 6616d4ec7c5e4fb44ce44bc4a6499f3969c35833
    branch: wrynose
    layers:
      .:

  # openjdk is base, not a feature: the always-on KOS tools kabtool and
  # publishtool (in system-base) RDEPEND on openjdk-17-jre, so their nativesdk
  # variants in the SDK pull nativesdk-openjdk-17-jre on every build.
  meta-openjdk-temurin:
    url: https://github.com/avocado-linux/vendor-meta-openjdk-temurin.git
    path: meta-openjdk-temurin
    branch: main
    commit: 01b411f4c1f45d9a18182f1ca3d6ce5db90f5f6a
    layers:
      .:

distro: avocado

local_conf_header:
  # wrynose: removed PREFERRED_VERSION_qemu* pins to "9%". They were
  # holding meta-avocado's local qemu 9.2.0 backport above OE-core
  # scarthgap's qemu. The backport has been deleted; OE-core wrynose
  # ships qemu 10.2.0 which we want unmodified.
  qemu: |

  meta-atmel: |
    BBMASK += "meta-atmel/recipes-(?!security/cryptoauthlib/)"

  git-lfs: |
    HOSTTOOLS += "git-lfs"
    FETCHCMD_git = "git -c core.fsyncobjectfiles=0"

  extra-openjdk: |
    PREFERRED_VERSION_openjdk-17-jdk ?= "17.0.12+7"
    PREFERRED_VERSION_openjdk-17-jre ?= "17.0.12+7"
    PREFERRED_VERSION_openjdk-17-jdk-native ?= "17.0.12+7"

  meta-avocado: |
    # buildhistory's version-going-backwards QA check compares each package's
    # PKGR against BUILDHISTORY_DIR, which persists across branch switches and
    # config changes in the same TMPDIR. Every time the workspace switches
    # branches or a distro-level setting changes package versions (e.g. the
    # removal of GLIBC_GENERATE_LOCALES), buildhistory falsely flags real,
    # legitimate PR changes as regressions and fails do_packagedata_setscene -
    # requiring a manual buildhistory wipe to unblock the build. Drop
    # buildhistory; keep rm_work and buildstats/buildstats-summary, which do
    # not have this failure mode.
    USER_CLASSES:append = "${@ ' rm_work' if os.environ.get('AVOCADO_RM_WORK', '1') == '1' else ''} buildstats buildstats-summary"

    LICENSE_FLAGS_ACCEPTED:append = " commercial commercial_% synaptics-killswitch"

    # Enable Fortran support globally
    FORTRAN:forcevariable = ",fortran"

    # Ensure gcc-cross is built with Fortran before gcc-runtime
    DEPENDS:append:pn-gcc-runtime = " gcc-cross-${TARGET_ARCH}"

    # Make sure the Fortran compiler is available for the target build
    GFORTRAN:class-target = "${TARGET_PREFIX}gfortran"
    FC:class-target = "${TARGET_PREFIX}gfortran"
    F77:class-target = "${TARGET_PREFIX}gfortran"

    # Enable Fortran for both cross and runtime
    FORTRAN:pn-gcc-cross-${TARGET_ARCH} = ",fortran"
    FORTRAN:pn-gcc-runtime = ",fortran"

    # Add libquadmath which is often needed with Fortran
    RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
    HOSTTOOLS += "gfortran"

  fetch: |
    # crates.io (per RFC 3463) blocks library-only User-Agents like the wget
    # default. Identify ourselves with an app name + contact so fetches aren't
    # rejected. Applies to all wget-based fetches, including the crate fetcher.
    FETCHCMD_wget = "/usr/bin/env wget -t 2 -T 100 --user-agent='avocado-linux-ci (j.schneck@peridio.com)'"

  sdk: |
    CONF_VERSION = "2"
