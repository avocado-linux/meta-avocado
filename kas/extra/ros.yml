header:
  version: 16

repos:
  meta-ros:
    url: https://github.com/avocado-linux/vendor-meta-ros.git
    path: meta-ros
    branch: scarthgap
    commit: 4aaaf8b98b05374be6ee26d18920f6a5c3e4cbbb
    layers:
      meta-ros-common:
      meta-ros2-jazzy:
      meta-ros2:

local_conf_header:
  extra-ros: |
    ROS_DISTRO = "jazzy"
    ROS_VERSION = "2"
    ROS_SUPERFLORE_GENERATED_BUILDTOOLS:append = " ${ROS_SUPERFLORE_GENERATED_WORLD_PACKAGES}"
    DISTRO_FEATURES:append = " ros2"
    PREFERRED_VERSION_octomap = "1.10.0"

    # Fix cross-compilation issues with ROS packages
    # Ensure proper library paths for target architecture
    CMAKE_PREFIX_PATH:prepend = "${STAGING_DIR_HOST}/opt/ros/jazzy:"
    PKG_CONFIG_PATH:prepend = "${STAGING_DIR_HOST}/opt/ros/jazzy/lib/pkgconfig:"
