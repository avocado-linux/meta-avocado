header:
  version: 16

repos:
  meta-ros:
    url: https://github.com/ros/meta-ros.git
    path: meta-ros
    branch: scarthgap
    commit: dc025a7f50842baa84305cc772010c5094e73e75
    layers:
      meta-ros-common:
      meta-ros2-jazzy:
      meta-ros2:

local_conf_header:
  extra-ros: |
    ROS_DISTRO = "jazzy"
    ROS_VERSION = "2"
    ROS_SUPERFLORE_GENERATED_BUILDTOOLS:append = " ${ROS_SUPERFLORE_GENERATED_WORLD_PACKAGES}"
    DISTRO_FEATURES:append = " ros2"
    PREFERRED_VERSION_octomap = "1.9.8"
    BBMASK += "meta-ros/meta-ros2-jazzy/recipes-bbappends/ros2-canopen/lely-core-libraries_%.bbappend"
