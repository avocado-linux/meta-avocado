header:
  version: 16

repos:
  meta-ros:
    url: https://github.com/ros/meta-ros.git
    path: meta-ros
    branch: scarthgap
    commit: 4a8044f2fd092f5cf5d7371aae1da4b4c961e54c
    layers:
      meta-ros-common:
      meta-ros2-humble:
      meta-ros2:

local_conf_header:
  extra-ros: |
    ROS_DISTRO = "humble"
    ROS_VERSION = "2"
    ROS_SUPERFLORE_GENERATED_BUILDTOOLS:append = " ${ROS_SUPERFLORE_GENERATED_WORLD_PACKAGES}"
    DISTRO_FEATURES:append = " ros2"
    PREFERRED_VERSION_octomap = "1.10.0"

    # Fix cross-compilation issues with ROS packages
    # Ensure proper library paths for target architecture
    CMAKE_PREFIX_PATH:prepend = "${STAGING_DIR_HOST}/opt/ros/humble:"
    PKG_CONFIG_PATH:prepend = "${STAGING_DIR_HOST}/opt/ros/humble/lib/pkgconfig:"
