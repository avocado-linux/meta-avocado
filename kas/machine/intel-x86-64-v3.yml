header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/vendor/intel.yml
    - repo: meta-avocado
      file: kas/feature/tpm.yml
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-x86-64:

# NVIDIA driver is now pulled in for all x86-64 targets via
# conf/machine/include/avocado-x86-64.inc (PKG_EXTRA_INSTALL), so no
# per-machine override is needed here.

machine: avocado-intel-x86-64-v3
