header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/feature/tpm.yml
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-qemu:

local_conf_header:
  machine-avocado-qemux86-64: |
    DISTRO_FEATURES_EXTRA:append = "seccomp virtualization"
    # Avocado qemu targets are always headless — drop display/GPU stacks
    # so chromium, qt5, weston, mesa, vulkan, etc. don't get pulled into
    # the image via packagegroup-avocado-extra's opengl/wayland gates.
    DISTRO_FEATURES:remove = "opengl wayland vulkan"

machine: avocado-qemux86-64
