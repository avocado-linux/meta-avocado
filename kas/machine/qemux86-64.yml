header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/feature/tpm.yml
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/feature/qemu-guest-agent.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-qemu:

local_conf_header:
  machine-avocado-qemux86-64: |
    DISTRO_FEATURES_EXTRA:append = "seccomp virtualization"

machine: avocado-qemux86-64
