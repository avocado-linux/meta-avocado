header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    # Community FSLC base (meta-freescale + 3rdparty): imx-base.inc, firmware-imx,
    # imx-mkimage / imx-boot, and the shared SDK extras. meta-imx layers on top.
    - repo: meta-avocado
      file: kas/vendor/freescale.yml
    # NXP proprietary meta-imx (pinned wrynose-6.18.20-2.0.0) -> Vivante GPU + VIP9000 NPU
    # eIQ ML stack (packagegroup-avocado-imx-ml, machine-gated to mx8mp-nxp-bsp).
    # Transitively pulls kas/vendor/nxp.yml, which sets IMX_DEFAULT_BSP=nxp and
    # includes arm.yml (nativesdk-gcc-arm-none-eabi for the Cortex-M7 bare-metal
    # toolchain, gated on the cortex-m MACHINE_FEATURE) + virtualization.yml.
    - repo: meta-avocado
      file: kas/vendor/nxp-evk.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-nxp:

local_conf_header:
  machine-avocado-imx8mp-evk: |
    DISTRO_FEATURES_EXTRA:append = "opengl wayland seccomp virtualization"

machine: avocado-imx8mp-evk
