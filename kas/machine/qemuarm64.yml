header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/vendor/arm.yml
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-qemu:

local_conf_header:
  machine-avocado-qemuarm64: |
    DISTRO_FEATURES_EXTRA:append = "seccomp virtualization"

machine: avocado-qemuarm64
