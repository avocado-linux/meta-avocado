header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/vendor/arm.yml
    # tpm2-tss (meta-security/meta-tpm) is required by systemd's tpm2
    # PACKAGECONFIG and by cryptsetup-var's systemd-cryptenroll. qemuarm64.conf
    # enables `systemd tpm2` + optee-ftpm, so the layer must be present (mirrors
    # the x86 machine config, which already includes this feature).
    - repo: meta-avocado
      file: kas/feature/tpm.yml
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/feature/qemu-guest-agent.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-qemu:

local_conf_header:
  machine-avocado-qemuarm64: |
    DISTRO_FEATURES_EXTRA:append = "seccomp virtualization"

machine: avocado-qemuarm64
