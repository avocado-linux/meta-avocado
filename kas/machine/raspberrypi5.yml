
header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/vendor/raspberrypi.yml
    - repo: meta-avocado
      file: kas/feature/multi-kernel-raspberrypi.yml
    - repo: meta-avocado
      file: kas/target/distro.yml
    # numba and llvmlite come from meta-python-ai, which needs meta-clang-revival
    # and, through its layer dependencies, meta-virtualization.
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/feature/python-ai.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-raspberrypi:

local_conf_header:
  machine-avocado-raspberrypi5: |

machine: avocado-raspberrypi5
