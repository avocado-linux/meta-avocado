header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/vendor/renesas.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-renesas:

  meta-solidrun-arm-rzg2lc:
    url: https://github.com/avocado-linux/vendor-meta-solidrun-arm-rzg2lc
    path: meta-solidrun-arm-rzg2lc
    branch: scarthgap_rzv2n_dev
    commit: 22cc809346a9999e246e05ebee269b9c1978409e
    layers:
      meta-rzv2n:
      meta:

  # RZ/V2N DRP-AI3 driver. Lives in this machine kas (not the shared renesas
  # vendor file) because its u-boot/kernel patches are rzv2n-specific and break
  # other Renesas machines if applied globally.
  rzv2n-drp-ai-driver:
    url: https://github.com/avocado-linux/vendor-rzv2n_drp-ai_driver
    path: rzv2n_drp-ai_driver
    branch: main
    commit: bb3e6a9283e2dda2bb4a3c25986a0a309f1db905
    layers:
      meta-rz-features/meta-rz-drpai:

local_conf_header:
  machine-avocado-rzv2n-sr-som: |
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-solidrun-extra"

machine: avocado-rzv2n-sr-som
