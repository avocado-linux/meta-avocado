header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/feature/virtualization.yml
    - repo: meta-avocado
      file: kas/target/distro.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-arm64:

local_conf_header:
  machine-arm64-uefi: |
    DISTRO_FEATURES_EXTRA:append = " opengl wayland efi seccomp virtualization"

    ROOTFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-arm64-uefi-rootfs"
    INITRAMFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-arm64-uefi-initramfs"
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-arm64-uefi-extra"

machine: avocado-arm64-uefi-v9
