header:
  version: 16
  includes:
    - repo: meta-avocado
      file: kas/base.yml
    - repo: meta-avocado
      file: kas/vendor/nxp-frdm.yml
    - repo: meta-avocado
      file: kas/vendor/freescale.yml
    - repo: meta-avocado
      file: kas/target/distro.yml
    # deepx moved from kas/extra/deepx.yml into the ai feature group; the
    # fragment now also appends the ai token, so this board gets the dx-driver
    # packages through AVOCADO_FEATURE_GROUPS instead of the old always-on path.
    - repo: meta-avocado
      file: kas/feature/ai.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado-nxp:

local_conf_header:
  avocado-imx95-frdm: |
    # i.MX 95 has a Mali GPU with Vulkan support; mali-imx depends on
    # vulkan-loader which is only built when 'vulkan' is in DISTRO_FEATURES.
    DISTRO_FEATURES_EXTRA:append = " vulkan "

machine: avocado-imx95-frdm
