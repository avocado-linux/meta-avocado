header:
  version: 16

# Feature overlay: build every alternate kernel the Jetson family carries
# alongside the default linux-yocto kernel for the active Jetson MACHINE, so the
# published feed contains ALL FOUR kernels' RPMs (kernel-${KERNEL_VERSION},
# kernel-module-*-${KERNEL_VERSION}, nv-kernel-module-*-${KERNEL_VERSION}, and
# the per-kernel
# packagegroup-avocado-{rootfs,initramfs}-modules-${KERNEL_VERSION}):
#
#   default        linux-yocto 6.18                  (stock)
#   jetson-rt      linux-yocto-rt 6.18               (PREEMPT_RT)
#   jetson-l4t     linux-noble-nvidia-tegra 6.8      (stock L4T)
#   jetson-l4t-rt  linux-noble-nvidia-tegra-rt 6.8   (PREEMPT_RT L4T)
#
# Each RT sibling is its own recipe with its own PN, so it is selected by
# PREFERRED_PROVIDER in its own multiconfig -- the same shape meta-avocado-qcom
# uses for linux-qcom / linux-qcom-rt, not the version-pinning shape Raspberry
# Pi uses.
#
# This overlay is included from every Jetson machine yml
# (kas/machine/{jetson-orin-nano,jetson-orin-nx,jetson-agx-orin,jetson-agx-thor,
# recomputer-j301x,recomputer-j401x,icam-540}.yml). Callers do not compose
# it onto the kas command line; multi-kernel is the standard build for the
# Jetson family.
#
# How it composes:
#   - BBMULTICONFIG activates each alt-kernel multiconfig, defined at
#     meta-avocado-nvidia/conf/multiconfig/<mc>.conf (per-mc TMPDIR and
#     BUILDHISTORY_DIR; PREFERRED_PROVIDER_virtual/kernel forced to that mc's
#     kernel recipe).
#   - AVOCADO_MULTIKERNEL_MC_RECIPES lists, per mc, both the kernel and the OOT
#     shim so nvidia-kernel-oot's RPMs land in the unified feed too. The OOT
#     entry is not optional on any of them: nvidia-kernel-oot is a separate
#     recipe, so it is not in an alt mc's graph just because the kernel is, and
#     without it that kernel's runtime is offered a foreign-vermagic module set
#     and refuses it. In-tree modules need nothing -- they come out of the
#     kernel recipe itself.
#
# kernel-devsrc is on NO mc's entry list, including jetson-l4t's -- so the feed
# carries the default mc's copy only, and `bitbake -g avocado-distro` confirms
# it: 149 kernel-devsrc task nodes in the default mc, zero in all three alt mcs.
#
# That is deliberate and must stay that way. kernelsrc.bbclass sets its PKGV to
# KERNEL_VERSION.split("-")[0], which strips exactly the suffix that tells the
# stock and RT halves of a family apart (6.18.35-yocto-standard and
# 6.18.35-yocto-preempt-rt both reduce to 6.18.35). Listing it for an RT mc
# would therefore publish a second, different payload under an identical NEVRA.
# Nothing in any alt mc's graph pulls it, so it is simply never built there.
#
# Build invocation (CI and dev are now identical for the distro target):
#   kas build kas/machine/jetson-orin-nano.yml
#
# `bitbake avocado-distro` transitively pulls in each alt-mc kernel + OOT
# via mcdepends, then do_multikernel_merge runs before do_compile so the
# avocado-repo.map regenerated by avocado-distro's do_compile sees the
# unified arch tree. After `kas build` exits, build/tmp/deploy/ contains all
# four kernels' RPMs and every mc's Pulp upload manifests — no caller-side
# rsync needed.
#
# SPDX is the exception, and this note used to claim otherwise:
# avocado-multikernel.bbclass deliberately does NOT merge spdx/, because every
# kernel emits SPDX files under the same unversioned package names
# (kernel.spdx.json and friends) and merging them collides in do_create_spdx.
# Each mc's SBOMs stay in its own tmp-<mc>/deploy/spdx/ and are collected
# separately if needed — now from three alt trees rather than one.
#
# Cost, since it is no longer a rounding error: four multiconfigs on one MACHINE
# means four tmp-* trees and four kernel + nvidia-kernel-oot builds per Jetson
# machine. sstate carries the shared sysroot recipes, but the kernel and OOT
# halves are genuinely rebuilt per mc — their signatures differ by which
# virtual/kernel they resolve.

local_conf_header:
  feature/multi-kernel-jetson: |
    BBMULTICONFIG += "jetson-l4t jetson-rt jetson-l4t-rt"
    AVOCADO_MULTIKERNEL_MC_RECIPES += "jetson-l4t:linux-noble-nvidia-tegra jetson-l4t:nvidia-kernel-oot"
    AVOCADO_MULTIKERNEL_MC_RECIPES += "jetson-rt:linux-yocto-rt jetson-rt:nvidia-kernel-oot"
    AVOCADO_MULTIKERNEL_MC_RECIPES += "jetson-l4t-rt:linux-noble-nvidia-tegra-rt jetson-l4t-rt:nvidia-kernel-oot"
