header:
  version: 16

# Feature overlay: build the L4T 5.15 kernel (linux-jammy-nvidia-tegra) and its
# OOT-shim recipes alongside the default linux-yocto kernel for the active
# Jetson MACHINE, so the published feed contains BOTH kernels' RPMs (kernel-
# ${KERNEL_VERSION}, kernel-module-*-${KERNEL_VERSION},
# nv-kernel-module-*-${KERNEL_VERSION}, kernel-devsrc-${KERNEL_VERSION}, and
# the per-kernel packagegroup-avocado-{rootfs,initramfs}-modules-${KERNEL_VERSION}).
#
# This overlay is included from every Jetson machine yml
# (kas/machine/{jetson-orin-nano,jetson-agx-orin,
# recomputer-j301x,recomputer-j401x,icam-540}.yml). Callers do not compose
# it onto the kas command line; multi-kernel is the standard build for the
# Jetson family.
#
# How it composes:
#   - BBMULTICONFIG += "jetson-l4t" activates the alt-kernel multiconfig
#     defined at meta-avocado-nvidia/conf/multiconfig/jetson-l4t.conf
#     (per-mc TMPDIR; PREFERRED_PROVIDER_virtual/kernel forced to
#     linux-jammy-nvidia-tegra).
#   - AVOCADO_MULTIKERNEL_MC_RECIPES lists both the kernel and the OOT shim
#     so nvidia-kernel-oot's RPMs land in the unified feed too.
#
# Build invocation (CI and dev are now identical for the distro target):
#   kas build kas/machine/jetson-orin-nano.yml
#
# `bitbake avocado-distro` transitively pulls in the alt-mc kernel + OOT
# via mcdepends, then do_multikernel_merge runs before do_compile so the
# avocado-repo.map regenerated by avocado-distro's do_compile sees the
# unified arch tree. After `kas build` exits, build/tmp/deploy/ contains
# both kernels' RPMs, both mcs' Pulp upload manifests, and both mcs' SPDX
# SBOMs — no caller-side rsync needed.

local_conf_header:
  feature/multi-kernel-jetson: |
    BBMULTICONFIG += "jetson-l4t"
    AVOCADO_MULTIKERNEL_MC_RECIPES += "jetson-l4t:linux-jammy-nvidia-tegra jetson-l4t:nvidia-kernel-oot"
