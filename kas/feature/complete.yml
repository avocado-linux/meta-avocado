header:
  version: 16

# Umbrella aggregator: includes every per-group kas/feature/<group>.yml
# fragment so that including this one file pulls every vendor layer and
# appends every feature token to AVOCADO_FEATURE_GROUPS. Boards are minimal by
# default and do NOT include this; append it explicitly at build time
# (machine.yml:kas/feature/complete.yml) to ship the full image. Dev/minimal
# targets stack a smaller set of fragments instead.
#
# Three fragments scarthgap lists here are omitted on wrynose - cameras
# (meta-basler-tools, meta-intel-realsense), ros (meta-ros) and cloud-aws
# (meta-aws). None of those forks has a wrynose branch, so including them
# would fail the layer compatibility check and take the whole build down
# rather than just skipping a group. The fragment files are still in tree with
# their scarthgap pins; add the line back here when the fork gains a branch.
  includes:
  - repo: meta-avocado
    file: kas/feature/system-base.yml
  - repo: meta-avocado
    file: kas/feature/networking.yml
  - repo: meta-avocado
    file: kas/feature/multimedia.yml
  - repo: meta-avocado
    file: kas/feature/python.yml
  - repo: meta-avocado
    file: kas/feature/graphics.yml
  - repo: meta-avocado
    file: kas/feature/qt.yml
  - repo: meta-avocado
    file: kas/feature/browsers.yml
  - repo: meta-avocado
    file: kas/feature/python-ai.yml
  - repo: meta-avocado
    file: kas/feature/clang.yml
  - repo: meta-avocado
    file: kas/feature/java.yml
  - repo: meta-avocado
    file: kas/feature/containers.yml

# Security features that are safe to ship whenever the machine can deliver
# them. Requested through the machine's own AVOCADO_SECURITY_CAPABILITIES
# declaration rather than appended outright: avocado-security-capabilities
# bb.fatals on a request the machine has not declared, and this file is built
# for every machine, so an unconditional token would take down the boards that
# have not been migrated onto the declaration. A machine that has not declared
# encrypted-var builds exactly as before.
#
# encrypted-var only. verified-boot is NOT here on purpose: it embeds the
# distro FIT key into U-Boot and enforces it, so a project's own FIT (its
# initramfs, its rootfs root hash) would not boot without replacing the
# bootloader. That is a per-product decision made with kas/feature/verified-boot.yml.
local_conf_header:
  feature/complete-security: |
    DISTRO_FEATURES:append = "${@bb.utils.contains('AVOCADO_SECURITY_CAPABILITIES', 'encrypted-var', ' encrypted-var', '', d)}"
