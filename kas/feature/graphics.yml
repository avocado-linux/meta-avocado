header:
  version: 16

repos:
  meta-wayland:
    url: https://github.com/avocado-linux/vendor-meta-wayland.git
    path: meta-wayland
    branch: wrynose
    commit: 059d0a3a31be857d1fbf464dd6ebf7b5f175a621
    layers:
      .:

  # scarthgap also pulls meta-webkit here and sets
  # PREFERRED_PROVIDER_virtual/wpebackend = "wpebackend-fdo". The fork has no
  # wrynose branch (upstream declares LAYERSERIES_COMPAT=whinlatter), so the
  # group ships weston/wayland only and wpewebkit is unavailable. The
  # corresponding wpewebkit bbappend is absent from dynamic-layers for the same
  # reason - restore both together with the layer.

local_conf_header:
  feature/graphics: |
    AVOCADO_FEATURE_GROUPS:append = " graphics"
