header:
  version: 16

local_conf_header:
  feature/sbom: |
    # SBOM SPDX 3.0
    INHERIT:remove = "create-spdx"
    INHERIT += "create-spdx-3.0"

    # The CVE_STATUS detail in each VEX statement's status notes, which
    # scarthgap's create-spdx-3.0 leaves out; see the class. cve-check.yml
    # inherits it too, so both stacks build the same SPDX.
    INHERIT += "avocado-spdx-vex-notes"

    # "all", where the create-spdx-3.0 default is "current": "current" drops
    # every CVE_STATUS whose detail is fixed-version or cpe-stable-backport,
    # and the CVE scan (kas/feature/cve-check.yml) reads Patched and Ignored
    # out of these statements. Set here too so feed builds cache the SPDX the
    # scan reads. The cost is size: the kernel's cve-exclusion data alone adds
    # about 12.4k CVE elements to every kernel package document.
    #
    # ?= rather than ??=: create-spdx-3.0 sets its own ??= "current", and of
    # two weak defaults the one parsed last wins, which is the class's.
    SPDX_INCLUDE_VEX ?= "all"

    # Debug-info kernels, so the feed publishes the kernel a CVE scan sees: the
    # kernel CVE filter needs its DWARF, and a scan built on its own kernel has
    # different package digests and gets no verdict. Switch read in
    # avocado-kernel-feed.bbclass and the linux-raspberrypi bbappend; the
    # DWARF lands in kernel-dbg, not in what a device installs.
    AVOCADO_KERNEL_DEBUGINFO = "1"
    SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto = "1"
    SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto-dev = "1"
    SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-raspberrypi = "1"
