header:
  version: 16

repos:
  meta-clang:
    url: https://github.com/avocado-linux/vendor-meta-clang.git
    path: meta-clang
    commit: b044647662a6916299238e7f2d9476d54f528263
    branch: master
    layers:
      .:

local_conf_header:
  feature/clang: |
    # bindgen, which Rust crates with C bindings run at build time, loads
    # libclang.so on the build host. The SDK has no clang, so every such build
    # had to bring its own copy. Ship libclang in the SDK host packages.
    SDK_PKG_EXTRA_INSTALL:append = " nativesdk-libclang"
