header:
  version: 16

# Feature overlay: build the linux-raspberrypi 6.6.x kernel alongside the
# default 6.12.x for the active Raspberry Pi MACHINE, so the published feed
# contains BOTH kernels' RPMs (kernel-${KERNEL_VERSION},
# kernel-module-*-${KERNEL_VERSION}, kernel-devsrc-${KERNEL_VERSION}, and the
# per-kernel packagegroup-avocado-{rootfs,initramfs}-modules-${KERNEL_VERSION}).
#
# This overlay is included from every Raspberry Pi machine yml
# (kas/machine/{raspberrypi5,raspberrypi4,raspberrypi0-2w,reterminal,
# reterminal-dm,fr202}.yml). Callers do not compose it onto the kas command
# line; multi-kernel is the standard build for the RPi family.
#
# How it composes:
#   - BBMULTICONFIG += "raspberrypi-6_6" activates the alt-kernel multiconfig
#     defined at meta-avocado-raspberrypi/conf/multiconfig/raspberrypi-6_6.conf
#     (per-mc TMPDIR + BUILDHISTORY_DIR; PREFERRED_VERSION_linux-raspberrypi
#     pinned to 6.6.%).
#   - AVOCADO_MULTIKERNEL_MC_RECIPES tells the bbclass which alt-mc recipes
#     to depend on and whose tmp-${mc}/deploy/ tree to merge into the
#     default mc's ${DEPLOY_DIR}.
#
# Build invocation (CI and dev are now identical for the distro target):
#   kas build kas/machine/raspberrypi5.yml
#
# `bitbake avocado-distro` transitively pulls in the alt-mc kernel via
# mcdepends, then do_multikernel_merge runs before do_compile so the
# avocado-repo.map regenerated by avocado-distro's do_compile sees the
# unified arch tree. After `kas build` exits, build/tmp/deploy/ contains
# both kernels' RPMs, both mcs' Pulp upload manifests, and both mcs' SPDX
# SBOMs — no caller-side rsync needed.
#
# Reterminal-specific OOT modules (kernel-module-seeed-mipi-dsi,
# kernel-module-rtc-pcf8563w, kernel-module-ltr30x, kernel-module-ili9881d,
# kernel-module-lis3lv02d) are gated by COMPATIBLE_MACHINE and so don't build
# for rpi5/rpi4/rpi0-2w/fr202. When this overlay is active for a reterminal
# build, extend AVOCADO_MULTIKERNEL_MC_RECIPES with the relevant
# raspberrypi-6_6:kernel-module-* entries so 6.6 variants of those OOT
# modules also land in the unified feed.

local_conf_header:
  feature/multi-kernel-raspberrypi: |
    BBMULTICONFIG += "raspberrypi-6_6"
    AVOCADO_MULTIKERNEL_MC_RECIPES += "raspberrypi-6_6:linux-raspberrypi"
