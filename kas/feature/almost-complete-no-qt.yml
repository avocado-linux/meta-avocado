header:
  version: 16

# The same fragments as almost-complete.yml, which no longer includes the qt
# fragment either. This file is kept so that a caller outside this repository
# that names it keeps working.
# devtool-debt: a copy of almost-complete.yml's include list. Ceiling: one
# caller that still names this file. Upgrade trigger: no caller names it, then
# delete the file and its test.
#
# meta-avocado/tests/test_feature_umbrellas.py fails when this list and
# almost-complete.yml's differ.
  includes:
  - repo: meta-avocado
    file: kas/feature/system-base.yml
  - repo: meta-avocado
    file: kas/feature/networking.yml
  - repo: meta-avocado
    file: kas/feature/multimedia.yml
  - repo: meta-avocado
    file: kas/feature/python.yml
  - repo: meta-avocado
    file: kas/feature/graphics.yml
  - repo: meta-avocado
    file: kas/feature/python-ai.yml
  - repo: meta-avocado
    file: kas/feature/clang.yml
  - repo: meta-avocado
    file: kas/feature/cloud-aws.yml
  - repo: meta-avocado
    file: kas/feature/java.yml
  - repo: meta-avocado
    file: kas/feature/containers.yml
  - repo: meta-avocado
    file: kas/feature/observability.yml
  - repo: meta-avocado
    file: kas/feature/robotics.yml

local_conf_header:
  feature/almost-complete-no-qt: |
    AVOCADO_SKIP_WEB_ENGINES = "1"
