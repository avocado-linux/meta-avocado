header:
  version: 16

# Feature overlay: build meta-qcom's PREEMPT_RT kernel (linux-qcom-rt) alongside
# the default linux-qcom for the active qcom MACHINE, so the published feed
# contains BOTH kernels' RPMs (kernel-${KERNEL_VERSION},
# kernel-module-*-${KERNEL_VERSION}, kernel-devicetree-${KERNEL_VERSION} and the
# per-kernel packagegroup-avocado-{rootfs,initramfs}-modules-${KERNEL_VERSION}).
#
# Included from kas/machine/rubikpi3.yml, the same way the Jetson and Raspberry
# Pi families include theirs -- callers do not compose it onto the kas command
# line, multi-kernel is the standard build.
#
# How it composes:
#   - BBMULTICONFIG += "qcom-rt" activates the alt-kernel multiconfig defined at
#     meta-avocado-qcom/conf/multiconfig/qcom-rt.conf (per-mc TMPDIR and
#     BUILDHISTORY_DIR; PREFERRED_PROVIDER_virtual/kernel forced to
#     linux-qcom-rt).
#   - AVOCADO_MULTIKERNEL_MC_RECIPES names the alt-mc recipe, which gives
#     avocado-distro an mcdepends on it and tells do_multikernel_merge whose
#     tmp-qcom-rt/deploy/ tree to merge into the default mc's ${DEPLOY_DIR}.
#
# Only the kernel is listed. Unlike Jetson there is no out-of-tree module shim
# to carry, and kernel-devsrc is deliberately left out: it is a separate recipe
# whose PKGV is KERNEL_VERSION.split("-")[0] (kernelsrc.bbclass), i.e. plain
# 6.18.37 for both kernels, so a second copy would be a same-NEVRA/different-
# payload collision. Nothing in the RT mc's graph pulls it, so it is simply
# never built there.
#
# Build invocation is unchanged:
#   kas build kas/machine/rubikpi3.yml
#
# `bitbake avocado-distro` transitively pulls in the alt-mc kernel via
# mcdepends, then do_multikernel_merge runs before do_compile so the
# avocado-repo.map regenerated by avocado-distro's do_compile sees the unified
# arch tree. After `kas build` exits, build/tmp/deploy/ carries both kernels'
# RPMs and both mcs' Pulp upload manifests.

local_conf_header:
  feature/multi-kernel-qcom: |
    BBMULTICONFIG += "qcom-rt"
    AVOCADO_MULTIKERNEL_MC_RECIPES += "qcom-rt:linux-qcom-rt"
