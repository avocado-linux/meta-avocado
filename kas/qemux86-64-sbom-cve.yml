# qemux86-64 with the SPDX 3.0 SBOM and the image CVE scan.
#
# The repo convention is colon composition (kas build machine.yml:ci/mirrors.yml),
# but bakar derives its build directory from the first YAML's stem, so composing
# on the command line would land in build-qemux86-64 alongside unrelated runs.
# This wrapper exists to give the SBOM/CVE end-to-end its own build directory.
#
# The report is image scope, and the default target here:
#
#   kas build kas/qemux86-64-sbom-cve.yml
#
# builds avocado-image-rootfs, scans its SBOM and writes the report. Not
# avocado-distro: the image scan class would also run on the packages-only
# images, which write no SBOM. sbom-cve-check reads the SPDX documents, so the
# scan can also run on a build that did not stack it from the start, as long as
# that build's SPDX carries what kas/feature/sbom.yml sets (SPDX_INCLUDE_VEX
# "all" and the VEX status notes).

header:
  version: 16
  includes:
    - machine/qemux86-64.yml
    - feature/sbom.yml
    - feature/cve-check-image.yml

target:
  - avocado-cve-report

# SPDX_INCLUDE_SOURCES is deliberately NOT set here. Measured 2026-08-20: it does
# make sbom-cve-check's compiled-source kernel filter fire, but the filter removed
# only 76 of 2,094 kernel findings (3.6%) while costing 19x SPDX storage
# (0.276 -> 5.36 GB), 333x on the per-image document (7.5 MB -> 2.50 GB), 3.5x
# build time, and ~50 GB of RAM to parse that document. The kernel filter needs
# only the kernel's compiled-source list, which kas/feature/sbom.yml turns on
# for the kernel recipes alone (see "Kernel CVEs" in meta-avocado-sbom/README).
