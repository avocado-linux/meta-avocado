# raspberrypi4 with the SPDX 3.0 SBOM and the image CVE scan.
#
# The RPi counterpart of qemuarm64-sbom-cve.yml, and it exists for the same
# reason: the build directory is derived from the first YAML's stem, so
# composing machine/raspberrypi4.yml:feature/sbom.yml on the command line would
# land in build-raspberrypi4 alongside unrelated runs.
#
# The report is image scope, and the default target here:
#
#   kas build kas/raspberrypi4-sbom-cve.yml
#
# builds avocado-image-rootfs, scans its SBOM and writes the report. Not
# avocado-distro: the image scan class would also run on the packages-only
# images, which write no SBOM. sbom-cve-check reads the SPDX documents, so the
# scan can also run on a build that did not stack it from the start, as long as
# that build's SPDX carries what kas/feature/sbom.yml sets (SPDX_INCLUDE_VEX
# "all" and the VEX status notes).
#
# machine/raspberrypi4.yml stacks feature/multi-kernel-raspberrypi.yml, but the
# 6.6 kernel it adds is built by avocado-distro, not by this target. The report
# covers the 6.12 kernel the image installs.

header:
  version: 16
  includes:
    - machine/raspberrypi4.yml
    - feature/sbom.yml
    - feature/cve-check-image.yml

target:
  - avocado-cve-report
