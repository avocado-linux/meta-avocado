# qemuarm64 with the SPDX 3.0 SBOM and the image CVE scan.
#
# The arm64 counterpart of qemux86-64-sbom-cve.yml, and it exists for the same
# reason: bakar derives its build directory from the first YAML's stem, so
# composing machine/qemuarm64.yml:feature/sbom.yml on the command line would
# land in build-qemuarm64 alongside unrelated runs.
#
# The report is image scope, and the default target here:
#
#   kas build kas/qemuarm64-sbom-cve.yml
#
# builds avocado-image-rootfs, scans its SBOM and writes the report. Not
# avocado-distro: the image scan class would also run on the packages-only
# images, which write no SBOM. sbom-cve-check reads the SPDX documents, so the
# scan can also run on a build that did not stack it from the start, as long as
# that build's SPDX carries what kas/feature/sbom.yml sets (SPDX_INCLUDE_VEX
# "all" and the VEX status notes).
#
# See qemux86-64-sbom-cve.yml for why SPDX_INCLUDE_SOURCES is deliberately unset.

header:
  version: 16
  includes:
    - machine/qemuarm64.yml
    - feature/sbom.yml
    - feature/cve-check-image.yml

target:
  - avocado-cve-report
