header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/nxp.yml

repos:
  # FRDM family (imx91, imx93, imx95) pins meta-imx to the NXP
  # wrynose-6.18.20-2.0.0 release. url/path/layers come from kas/vendor/nxp.yml.
  #
  # The FRDM machine configurations live in meta-imx-bsp itself from whinlatter
  # onward, and the FRDM device trees are native to the 6.18 kernel, so the
  # separate meta-imx-frdm layer (6.6-only, lf-6.6.36-2.1.0) is no longer needed.
  #
  # wrynose-6.18.20-2.0.0 rather than whinlatter-6.18.2-1.0.0 because only the
  # former lists wrynose in LAYERSERIES_COMPAT_fsl-bsp-release.
  meta-imx:
    branch: wrynose-6.18.20-2.0.0
    commit: 52516b92a70669eb58b805810f2a27a07c874771
