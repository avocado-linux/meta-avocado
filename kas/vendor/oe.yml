header:
  version: 16

env:
  BB_GIT_SHALLOW: "0"
  BB_GENERATE_SHALLOW_TARBALLS: "1"
  BB_GIT_SHALLOW_DEPTH: "1"
  PRSERV_HOST: "localhost:0"
  BB_SIGNATURE_HANDLER: "OEEquivHash"
  BB_HASHSERVE: "auto"

build_system: oe

repos:
  bitbake:
    url: https://github.com/avocado-linux/vendor-bitbake
    path: bitbake
    # <base>-avocado patch branch (vendor/update.sh rebases it onto upstream
    # 2.18): carries the cgroup-aware scheduler regulation, see
    # BB_MAX_MEMORY_USAGE in kas/ci/mirrors.yml.
    branch: "2.18-avocado"
    commit: 3792554ff774a7eb072c29fbbdf1f727054b7aeb
    layers:
      .: disabled

  openembedded-core:
    url: https://github.com/avocado-linux/vendor-openembedded-core
    path: openembedded-core
    branch: wrynose-avocado
    commit: 0c69588b1d06111911aa91fd8c0dd28c18edcb08
    layers:
      meta:

