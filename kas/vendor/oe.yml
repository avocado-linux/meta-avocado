header:
  version: 16

env:
  BB_GIT_SHALLOW: "0"
  BB_GENERATE_SHALLOW_TARBALLS: "1"
  BB_GIT_SHALLOW_DEPTH: "1"
  PRSERV_HOST: "localhost:0"
  BB_SIGNATURE_HANDLER: "OEEquivHash"
  BB_HASHSERVE: "auto"

build_system: oe

repos:
  bitbake:
    url: https://github.com/avocado-linux/vendor-bitbake
    path: bitbake
    # race-review-fixes = 2.8-avocado + mkdirhier EEXIST/ESTALE retries and the
    # asyncrpc client connect/handshake budgets - cold-review fixes for the
    # cross-node build race (a stalled hashserv/prserv connect no longer wedges
    # the client).
    #
    # Rebased onto the current 2.8-avocado tip for this merge. The branch had
    # been cut from an older base, so pinning it while scarthgap moved forward
    # would have dropped eleven commits that landed on 2.8-avocado in the
    # meantime - among them the fetch2 deb/ipk member-name and striplevel
    # validation, the shallow-ref quoting, RPM --no-absolute-filenames, and the
    # hashserv unihash validation. Keeping the race fixes is not worth losing
    # those, so the branch moved rather than the pin.
    branch: "race-review-fixes"
    commit: 81d1e0e96a7a9a88ffc4171137b581bf97c33236
    layers:
      .: disabled

  openembedded-core:
    url: https://github.com/avocado-linux/vendor-openembedded-core
    path: openembedded-core
    branch: scarthgap-avocado
    commit: 06b1c4f636f21d29d0786c79bc325000aa80547e
    layers:
      meta:
