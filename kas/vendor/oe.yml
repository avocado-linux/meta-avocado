header:
  version: 16

env:
  BB_GIT_SHALLOW: "0"
  BB_GENERATE_SHALLOW_TARBALLS: "1"
  BB_GIT_SHALLOW_DEPTH: "1"
  PRSERV_HOST: "localhost:0"
  BB_SIGNATURE_HANDLER: "OEEquivHash"
  BB_HASHSERVE: "auto"

build_system: oe

repos:
  bitbake:
    url: https://github.com/avocado-linux/vendor-bitbake
    path: bitbake
    # race-review-fixes = 2.8-avocado + mkdirhier EEXIST/ESTALE retries and the
    # asyncrpc client connect timeout - cold-review fixes for the cross-node
    # build race (a stalled hashserv/prserv connect no longer wedges the client).
    branch: "race-review-fixes"
    commit: 999cc46ab92b64fb2dc4fbdebf133f1257ced278
    layers:
      .: disabled

  openembedded-core:
    url: https://github.com/avocado-linux/vendor-openembedded-core
    path: openembedded-core
    branch: scarthgap-avocado
    commit: e8e93ce1a7a952caf0859f1952eaa9fcb08856f6
    layers:
      meta:

