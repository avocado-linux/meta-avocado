header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

repos:
  meta-raspberrypi:
    url: https://github.com/avocado-linux/vendor-meta-raspberrypi
    path: meta-raspberrypi
    branch: scarthgap
    commit: cd677051d18d4af2f043ac1ab58509ae5f594cf6
    layers:
      .:

local_conf_header:
  vendor-raspberrypi: |
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-raspberrypi-extra"
    SDK_PKG_EXTRA_INSTALL:append = " packagegroup-avocado-raspberrypi-sdk"
    BBMASK += "meta-raspberrypi/recipes-bsp/u-boot/"
    DISTRO_FEATURES_EXTRA:append = "opengl wayland seccomp virtualization"
