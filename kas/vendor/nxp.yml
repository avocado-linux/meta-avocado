header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/arm.yml
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:

  # NXP proprietary i.MX BSP base (meta-imx). This file intentionally does NOT
  # pin a branch/commit: each board family that needs the NXP BSP sets its own
  # meta-imx pin (see nxp-frdm.yml, compulab.yml) so families can track
  # different NXP releases without forcing cross-family revalidation. kas deep
  # -merges the per-family {branch, commit} onto this {url, path, layers}.
  # Base ML recipes (neutron, litert, tensorflow-lite, nnstreamer) that
  # meta-imx-ml's i.MX deltas require. LAYERDEPENDS is freescale-layer +
  # meta-python, both already present. Its wrynose branch is LAYERSERIES_COMPAT
  # with wrynose.
  meta-freescale-ml:
    url: https://github.com/avocado-linux/vendor-meta-freescale-ml.git
    path: meta-freescale-ml
    branch: wrynose
    commit: 1330790bc6cdd3808260a16383d928e05a0e0eeb
    layers:
      .:

  meta-imx:
    url: https://github.com/avocado-linux/vendor-meta-imx.git
    path: meta-imx
    layers:
      meta-imx-bsp:
      meta-imx-v2x:
      # meta-imx-ml holds only the i.MX deltas now: NXP moved the base ML
      # recipes out to meta-freescale-ml in meta-imx e6e7f71d02 ("Clean up
      # recipes as the changes are upstreamed to meta-freescale-ml"). So
      # neutron_3.1.1.bb `require`s a neutron_1.0.0.bb that lives there, and the
      # tim-vx / nnstreamer / tensorflow-lite appends have no base recipe
      # without it. That is why this layer was disabled; it is not going to
      # become self-contained, so vendor meta-freescale-ml below instead.
      meta-imx-ml:

local_conf_header:
  vendor-nxp: |
    IMX_DEFAULT_BSP = "nxp"
    DISTRO_FEATURES_EXTRA:append = "opengl wayland seccomp virtualization"
    ROOTFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-imx-rootfs"
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-imx-extra"
    # NPU/eIQ ML stack -> feed. Per-SoC: the VIP9000 VX delegate on mx8mp, the
    # eIQ Neutron delegate on mx95. Empty on machines with no NPU.
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-imx-ml"
    BB_GIT_SHALLOW:pn-nativesdk-uuu = "0"
    BB_GIT_SHALLOW_DEPTH:pn-nativesdk-uuu = "0"
    # meta-freescale renamed udev-rules-imx.bb to udev-rules-imx_1.0.bb for
    # wrynose; meta-imx's append is unversioned so it no longer matches and
    # dangles on every machine that pulls this layer. Masking falls back to
    # meta-freescale's own 10-imx.rules, which differs only in a
    # SUBSYSTEM=="neutron" line and galcore 0660-vs-0666.
    BBMASK += "meta-imx/meta-imx-bsp/recipes-core/udev/udev-rules-imx.bbappend"
