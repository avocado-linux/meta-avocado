header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/nxp.yml

repos:
  # imx93-frdm pins meta-imx to the NXP wrynose-6.18.20-2.0.0 release. The
  # url/path/layers come from kas/vendor/nxp.yml; only the refspec is set here.
  #
  # Separate from nxp-frdm.yml, which imx91-frdm and imx95-frdm still share on
  # 6.6.36-2.1.0. Splitting follows the same per-family pattern as
  # compulab.yml and the intent nxp.yml states: a family tracks its own NXP
  # release without forcing revalidation of the others. imx95-frdm in
  # particular pins linux-imx to 6.6.52 via SRCREV in
  # meta-avocado-nxp/recipes-kernel/linux/linux-imx_%.bbappend, which a 6.18
  # base would contradict.
  #
  # Why 6.18 for this board: the 6.6.36 SPL does not boot i.MX93 Rev1.2
  # silicon. It initialises the PMIC and trains DDR, then stops before
  # selecting a boot device, so the failure is identical whether the boot
  # container arrives from an SD card or over USB serial download. NXP's own
  # 6.6.36 FRDM image reproduces it on the same board, and the 6.18.2 firmware
  # the board ships with boots that same hardware.
  #
  # meta-imx-frdm is deliberately absent rather than re-pinned. It exists only
  # on lf-6.6.36-2.1.0 - its sole branch, already at upstream HEAD - and from
  # whinlatter onward the FRDM machine configurations, including the
  # imx93-11x11-lpddr4x-frdm.conf that avocado-imx93-frdm.conf requires, live
  # in meta-imx-bsp itself. The i.MX93 FRDM device trees that layer supplied as
  # kernel patches are native to the 6.18 kernel.
  #
  # wrynose-6.18.20-2.0.0 rather than whinlatter-6.18.2-1.0.0 because only the
  # former lists wrynose in LAYERSERIES_COMPAT_fsl-bsp-release, and this branch
  # tracks the wrynose OE-core series.
  meta-imx:
    branch: wrynose-6.18.20-2.0.0
    commit: 52516b92a70669eb58b805810f2a27a07c874771

    # meta-imx-ml does not parse at this release and contributes nothing to this
    # board, so it is disabled rather than carried and worked around.
    #
    # Two independent breakages, both from the layer expecting a companion set
    # Avocado does not assemble:
    #
    #   ERROR: ParseError at meta-imx-ml/recipes-libraries/neutron/
    #   neutron_3.1.1.bb:1: Could not include required file
    #   recipes-libraries/neutron/neutron_1.0.0.bb
    #
    # (walnascar carried neutron_1.0.0.bb, whinlatter replaced it with
    # neutron_2.2.1.bb, and wrynose ships only neutron_3.1.1.bb while still
    # requiring the 1.0.0 file), and then
    #
    #   ERROR: No recipes in default available for:
    #     .../tim-vx/tim-vx_1.2.2.bbappend
    #     .../tvm/tvm_0.7.0.bbappend
    #     .../nnshark/nnshark_2023.11.imx.bbappend
    #     .../nnstreamer-edge/nnstreamer-edge_0.2.6.bbappend
    #     .../nnstreamer/nnstreamer_2.4.2.bbappend
    #
    # Excluding costs nothing here. packagegroup-avocado-imx-ml states that only
    # the i.MX8M Plus with its Vivante VIP9000 NPU gets the VX-delegate eIQ
    # stack and that the group is empty on every other machine, so the layer
    # already contributed no packages to an i.MX93 image. This board's NPU is an
    # Ethos-U65, which is not served by that stack.
    #
    # Scoped to this file, so the machines still on the 6.6.36 BSP keep the
    # layer, where its recipes do parse. Revisit if NXP ships a
    # self-contained meta-imx-ml or Avocado grows an Ethos-U ML feed.
    layers:
      meta-imx-ml: disabled

local_conf_header:
  imx93-dangling-appends: |
    # meta-freescale renamed udev-rules-imx.bb to udev-rules-imx_1.0.bb for
    # wrynose. meta-imx's append is unversioned, so it no longer matches, and
    # the branch tip still ships it that way. Masking falls back to
    # meta-freescale's own 10-imx.rules, which differs from meta-imx's copy in
    # exactly two lines: it omits SUBSYSTEM=="neutron" and keeps galcore at
    # 0660 rather than 0666. Neither has a consumer on this board - i.MX93 has
    # no Vivante GPU, so no galcore node exists, and the image ships no NPU
    # software to open a neutron node as a non-root user.
    #
    # Scoped to this machine because the rename is specific to the wrynose
    # meta-freescale branch this board's meta-imx pairing pulls in; the
    # gstreamer1.0-plugins-imx and nnstreamer masks that used to sit alongside
    # this one are machine-agnostic and now live in
    # fsl-imx-preferred-env.inc, where every fsl-imx-preferred-env.inc machine
    # sees them.
    BBMASK += "meta-imx/meta-imx-bsp/recipes-core/udev/udev-rules-imx.bbappend"
