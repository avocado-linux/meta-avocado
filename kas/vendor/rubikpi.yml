header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

repos:
  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom
    path: meta-qcom
    branch: scarthgap
    commit: ec80a36bce11d8182b4bb2a6fa0359adfeccde0a

  meta-qcom-hwe:
    url: https://github.com/qualcomm-linux/meta-qcom-hwe
    path: meta-qcom-hwe
    branch: scarthgap
    commit: 61d7b15a840af1263fc3efa50a6a082d463d4dbe
    layers:
      .:

  meta-qcom-distro:
    url: https://github.com/qualcomm-linux/meta-qcom-distro
    path: meta-qcom-distro
    branch: scarthgap
    commit: d8e9c3a6e568f0b3a0e6ac32349f3e6646ca2163
    layers:
      .:

local_conf_header:
  meta-qcom: |
    DISTRO_FEATURES_EXTRA:append= " opengl vulkan wayland seccomp virtualization"
    INITRAMFS_IMAGE_BUNDLE ?= "1"
    INITRAMFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-qcom-initramfs"
    ROOTFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-qcom-base"
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-qcom-extra"
    PACKAGECONFIG:remove:pn-qtbase = " eglfs"
    PACKAGECONFIG:remove:pn-qtwayland = " xcomposite-egl"
