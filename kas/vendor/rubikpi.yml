header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

# RUBIK Pi 3 on the upstream-kernel Qualcomm BSP.
#
# meta-qcom's wrynose branch is Qualcomm's upstream line: linux-qcom 6.18,
# mesa/freedreno, mainline venus/audioreach, public boot firmware. The
# downstream "custom" BSP (meta-qcom-hwe: linux-qcom-custom 6.6, adreno,
# fastrpc, PAL audio) is scarthgap-only upstream - its main branch was emptied
# and its tags stop at QLI.1.9 - so there is no wrynose HWE to move to and it
# is gone from this layer set. meta-qcom-distro is gone too: nothing here used
# it, and its LAYERDEPENDS (selinux, sota, tpm, xfce, security) are not layers
# this distro carries.
#
# meta-qcom wrynose LAYERDEPENDS on the meta-lts-mixins linux-firmware layer
# for the 20260810 linux-firmware that splits the qcm6490 blobs into per-block
# packages (linux-firmware-qcom-qcm6490-*, ...-qcs6490-thundercomm-rubikpi3-audio).
#
# URLs point at the upstream repos for now: the avocado-linux mirrors'
# wrynose branches are 167 (meta-qcom) commits behind and do not contain
# these commits yet. Fast-forward the mirrors, then swap the URLs back.
repos:
  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom
    path: meta-qcom
    branch: wrynose
    commit: 18bb43fd5cb616b3079717a6ff15815172c63446

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    path: meta-lts-mixins
    branch: wrynose/linux-firmware
    commit: 8bfc4ae8cf7fc835a23d7a27830f866617d9808f
    layers:
      .:

local_conf_header:
  meta-qcom: |
    DISTRO_FEATURES_EXTRA:append = " opengl vulkan wayland seccomp virtualization"
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-qcom-extra"
    PACKAGECONFIG:remove:pn-qtbase = " eglfs"
    PACKAGECONFIG:remove:pn-qtwayland = " xcomposite-egl"
