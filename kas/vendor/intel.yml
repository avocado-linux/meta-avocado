header:
  version: 16

repos:
  meta-intel:
    url: https://github.com/avocado-linux/vendor-meta-intel.git
    path: meta-intel
    branch: wrynose
    commit: 79a9681ce83f6bf36aede3aeb8c1707d29bca329
    layers:
      .:

local_conf_header:
  vendor-intel: |
    PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
    DISTRO_FEATURES_EXTRA:append = " opengl wayland efi seccomp virtualization"

    ROOTFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-x86-64-rootfs "
    INITRAMFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-x86-64-initramfs"
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-x86-64-extra"
