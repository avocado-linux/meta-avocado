header:
  version: 16

repos:
  meta-tegra:
    url: https://github.com/avocado-linux/vendor-meta-tegra
    path: meta-tegra
    branch: wrynose
    commit: 727633deca9b72643112d1aebadafb736dad60c0
    layers:
      .:

  meta-tegra-community:
    url: https://github.com/avocado-linux/vendor-meta-tegra-community
    path: meta-tegra-community
    branch: wrynose
    commit: f9600de48fd7c7dfd711af71430f2afb3705cf33
    layers:
      .:

local_conf_header:
  vendor-nvidia: |
    TEGRA_INITRD_FLASH_INITRAMFS_FSTYPES = "cpio.gz.cboot"
    DISTRO_FEATURES_EXTRA:append = "opengl wayland seccomp virtualization efi"
    LICENSE_FLAGS_ACCEPTED:append = " commercial_faad2 commercial_x264"

    ROOTFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-rootfs "
    INITRAMFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-initramfs"
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-extra"
    SDK_PKG_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-sdk-extra"

    # libnvidia-container's Makefile derives MAJOR/MINOR/PATCH from
    # `git describe --tags` in ${S}; shallow tarballs strip tags and break
    # do_compile with "Invalid major version".
    BB_GIT_SHALLOW:pn-libnvidia-container = "0"
    BB_GIT_SHALLOW_DEPTH:pn-libnvidia-container = "0"

    # python3-onnx is provided by BOTH the CUDA meta-tegra-community `onnx`
    # recipe and the generic meta-python-ai `python3-onnx` recipe. Pin the
    # runtime package to the meta-tegra-community build (recipe PN "onnx") so
    # the tegra feed ships the CUDA-aligned ONNX, consistent with python3-torch
    # / torchvision above.
    PREFERRED_RPROVIDER_python3-onnx = "onnx"
