header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/nxp.yml

repos:
  # The i.MX8MP EVK is a board provided directly by meta-imx (no extra vendored
  # BSP layer, unlike the CompuLab family's meta-bsp-imx8mp), so this file only
  # pins the NXP release. Tracks 6.6.52-2.2.0 to share a single meta-imx pin with
  # the CompuLab i.MX8MP family (kas/vendor/compulab.yml) -- same silicon, one
  # release to revalidate across both i.MX8MP boards. url/path/layers come from
  # kas/vendor/nxp.yml.
  meta-imx:
    branch: scarthgap-6.6.52-2.2.0
    commit: a0cf309d2e2d544111e520f572db8dff335eca01
