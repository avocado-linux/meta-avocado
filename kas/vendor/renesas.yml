  - repo: meta-avocado
    file: kas/vendor/arm.yml
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:

  meta-renesas:
