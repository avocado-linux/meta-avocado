header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/arm.yml
  - repo: meta-avocado
    file: kas/feature/virtualization.yml
  - repo: meta-avocado
    file: kas/feature/complete.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:

  meta-renesas:
    url: https://github.com/avocado-linux/vendor-meta-renesas
    path: meta-renesas
    branch: scarthgap/rz
    commit: b396a94cc9c0a1e491c3a0426416cb8a1dfcb04f
    layers:
      meta-rz-bsp:
      meta-rz-distro:

  rzv2n-drp-ai-driver:
    url: https://github.com/avocado-linux/vendor-rzv2n_drp-ai_driver
    path: rzv2n_drp-ai_driver
    branch: main
    commit: bb3e6a9283e2dda2bb4a3c25986a0a309f1db905
    layers:
      meta-rz-features/meta-rz-drpai:

local_conf_header:
  vendor-renesas: |
    DISTRO_FEATURES_EXTRA:append = " opengl wayland vulkan virtualization seccomp"
