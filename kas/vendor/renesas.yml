    path: meta-renesas
    branch: scarthgap/rz
    commit: 2655d4aaa30be9b5b293e9df14393c6c4b7ffddb
    layers:
      meta-rz-bsp:
      meta-rz-distro:

  rzv2n-drp-ai-driver:
