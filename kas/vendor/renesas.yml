header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/arm.yml
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:

  meta-renesas:
    url: https://github.com/avocado-linux/vendor-meta-renesas
    path: meta-renesas
    branch: scarthgap/rz
    commit: b396a94cc9c0a1e491c3a0426416cb8a1dfcb04f
    layers:
      meta-rz-bsp:
      meta-rz-distro:

# NOTE: SoC-specific DRP-AI driver layers (renesas-rz/rzv2n_drp-ai_driver,
# rzv2h_drp-ai_driver) are intentionally NOT included here. They carry
# machine-specific u-boot/kernel patches (e.g. the rzv2n ether-setting patch
# touches include/configs/rzv2n-*.h) that break sibling Renesas machines if
# applied globally. Wire each in its own machine kas instead.

local_conf_header:
  vendor-renesas: |
    DISTRO_FEATURES_EXTRA:append = " opengl wayland vulkan virtualization seccomp"
