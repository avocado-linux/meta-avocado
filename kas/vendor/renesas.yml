    path: rzv2n_drp-ai_driver
    branch: main
    commit: 067406d1a699e737d2a037a0aec952c30b2a3cdd
    layers:
      meta-rz-features/meta-rz-drpai:

local_conf_header:
  vendor-renesas: |
    DISTRO_FEATURES_EXTRA:append = " opengl wayland vulkan virtualization seccomp"
