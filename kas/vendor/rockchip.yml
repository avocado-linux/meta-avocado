header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/arm.yml
  # meta-virtualization provides the docker recipe that
  # packagegroup-avocado-extra (in meta-avocado) RDEPENDs on. Required for
  # any avocado-distro target build to resolve.
  - repo: meta-avocado
    file: kas/feature/virtualization.yml

repos:
  meta-avocado:
    path: meta-avocado
    layers:
      meta-avocado:

  meta-rockchip:
    url: https://github.com/avocado-linux/vendor-meta-rockchip
    path: meta-rockchip
    branch: wrynose
    commit: 9d02575bfd9ca5e87c394f593f2bbdbdee914d4e
    layers:
      .:

local_conf_header:
  vendor-rockchip: |
    PKG_EXTRA_INSTALL:append = " packagegroup-avocado-rockchip-extra"
    SDK_PKG_EXTRA_INSTALL:append = " packagegroup-avocado-rockchip-sdk"
    DISTRO_FEATURES_EXTRA:append = " opengl wayland seccomp virtualization"
