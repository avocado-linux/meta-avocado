header:
  version: 16
  includes:
  - repo: meta-avocado
    file: kas/vendor/nxp.yml

repos:
  # CompuLab family pins meta-imx to the NXP wrynose-6.18.20-2.0.0 release,
  # matching meta-bsp-imx8mp's wrynose-6.18.20-2.0.0 branch below.
  # url/path/layers come from kas/vendor/nxp.yml.
  meta-imx:
    branch: wrynose-6.18.20-2.0.0
    commit: 52516b92a70669eb58b805810f2a27a07c874771

  # CompuLab i.MX8M Plus BSP: machine defs (ucm-imx8m-plus, iot-gate-imx8plus,
  # ...), u-boot-compulab, linux-compulab. Self-contained for boot+kernel; the
  # meta-compulab / meta-compulab-bsp / meta-imx8mp-isp "extra" layers are
  # desktop/multimedia/camera only and are intentionally omitted for the
  # headless Avocado SOM/gateway base.
  meta-bsp-imx8mp:
    url: https://github.com/avocado-linux/vendor-meta-bsp-imx8mp.git
    path: meta-bsp-imx8mp
    branch: wrynose-6.18.20-2.0.0
    commit: 1280452795289f22900083d2f7b4d6406113f9f2
    layers:
      .:

local_conf_header:
  vendor-compulab: |
    # NXP proprietary multimedia/codec licenses (meta-imx).
    LICENSE_FLAGS_ACCEPTED:append = " commercial"
    # CompuLab DDR variant: d1d8 / d2 / d4 (see meta-bsp-imx8mp README).
    DRAM_CONF ?= "d4"
    # nxp-demo-experience comes from meta-imx-demo, which Avocado does not
    # vendor, so the CompuLab append has nothing to attach to.
    BBMASK += "meta-bsp-imx8mp/recipes-nxp-demo-experience/"
    # meta-bsp-imx8mp builds u-boot and the kernel from CompuLab's branch tips
    # (AUTOREV): every parse runs `git ls-remote` and every build takes
    # whatever was pushed last. Pin them; bump together with the layer above.
    SRCREV:pn-u-boot-compulab = "a6efdcc99eb71a14f7778187ad97f11a153c6a80"
    SRCREV:pn-compulab-bootloader = "a6efdcc99eb71a14f7778187ad97f11a153c6a80"
    SRCREV:pn-linux-compulab = "88176b86a91ae88c434f57fcca2e4081bb3ca65a"
    SRCREV:pn-linux-compulab-mfgtool = "88176b86a91ae88c434f57fcca2e4081bb3ca65a"
