header:
  version: 16

# CI overlay configuration that uses mirrors instead of shared directories
# to avoid locking issues when building in parallel on the same machine
#
# Usage: kas build machine.yml:ci/mirrors.yml
# This overlays the CI mirror configuration on top of any machine config

env:
  SOURCE_MIRROR_URL: "http://molcajete:30082/downloads"
  SSTATE_MIRROR_URL: "http://molcajete:30082/sstate/PATH;downloadfilename=PATH"
  CI_MIRROR_ONLY: "0"

local_conf_header:
  ci-mirrors: |
    DL_DIR = "${TMPDIR}/downloads"
    SSTATE_DIR = "${TMPDIR}/sstate-cache"

    SOURCE_MIRROR_URL ?= "${@os.getenv('SOURCE_MIRROR_URL', 'http://molcajete:30082/downloads')}"
    PREMIRRORS:prepend = "git://.*/.* ${SOURCE_MIRROR_URL} ftp://.*/.* ${SOURCE_MIRROR_URL} http://.*/.* ${SOURCE_MIRROR_URL} https://.*/.* ${SOURCE_MIRROR_URL} "

    SSTATE_MIRRORS ?= "file://.* ${@os.getenv('SSTATE_MIRROR_URL', 'http://molcajete:30082/sstate/PATH;downloadfilename=PATH')}"

    BB_FETCH_PREMIRRORONLY = "${@'1' if os.getenv('CI_MIRROR_ONLY', '0') == '1' else '0'}"

    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K STOPTASKS,/tmp,100M,100K HALT,${TMPDIR},100M,1K HALT,${DL_DIR},100M,1K HALT,${SSTATE_DIR},100M,1K HALT,/tmp,10M,1K"

    # Backpressure: pause new task dispatch when system pressure exceeds thresholds.
    # Values are microseconds of stall per second (1000000 = 100% stall).
    # In-flight tasks always finish; only NEW task starts are paused.
    # See bitbake/lib/bb/runqueue.py exceeds_max_pressure() for the implementation.
    # BB_PRESSURE_MAX_MEMORY=20000  -> 2% memory stall, pause early to head off OOM during chromium-class links
    # BB_PRESSURE_MAX_CPU=500000    -> 50% CPU stall, OK to push CPU; only pause under heavy contention
    # BB_PRESSURE_MAX_IO=100000     -> 10% IO stall, prevent thrashing on tmpdir / cache writes
    BB_PRESSURE_MAX_MEMORY = "20000"
    BB_PRESSURE_MAX_CPU    = "500000"
    BB_PRESSURE_MAX_IO     = "100000"

    # Chromium's link phase is memory-heavy: max_jobs_per_link is bound to PARALLEL_MAKE
    # in chromium-gn.inc. Globally we run -j4 (see iac build task env);
    # cap chromium tighter to bound peak link-time memory.
    PARALLEL_MAKE:pn-chromium-ozone-wayland = "-j 2"
    PARALLEL_MAKE:pn-chromium-x11 = "-j 2"
