header:
  version: 16

# CI overlay that enables the avocado-pulp-upload bbclass. Layered on top of
# the machine config (and usually mirrors.yml) to upload RPMs to Pulp as they
# are written during the build, rather than in a post-build pass.
#
# Usage: kas build machine.yml:ci/mirrors.yml:ci/pulp-upload.yml --target TARGET
#
# Required environment (passed through from the caller, e.g. a Tekton task
# with envFrom ci-pulp-credentials):
#   PULP_BASE_URL
#   PULP_USERNAME
#   PULP_PASSWORD
#   DISTRO_CODENAME   (release/channel, e.g. "2026/edge")
#
# Nothing is hardcoded. If PULP_BASE_URL is empty, the bbclass aborts with
# bb.fatal rather than falling back to any default.

env:
  AVOCADO_PULP_UPLOAD: "1"
  PULP_BASE_URL: ""
  PULP_USERNAME: ""
  PULP_PASSWORD: ""
  # Path to a CA bundle (system roots + the internal package-ca) the bbclass
  # trusts when uploading over TLS. Passed through to the bitbake datastore
  # because bitbake strips SSL_CERT_FILE from the worker env, so urllib (running
  # inside the worker) would otherwise fail to verify the package-ca cert. Empty
  # = use the ambient default trust store (fine for a publicly-trusted Pulp).
  PULP_CA_BUNDLE: ""
  # Large-RPM upload tuning. Files bigger than AVOCADO_PULP_CHUNK_SIZE bytes are
  # uploaded via Pulp's chunked /uploads/ API in AVOCADO_PULP_UPLOAD_PARALLEL
  # concurrent streams (resilient, no per-request gunicorn-timeout risk, and
  # fills the VPN pipe a single stream leaves idle). Smaller files stay a single
  # POST. Empty = bbclass defaults (16 MiB chunks / 4 parallel).
  AVOCADO_PULP_CHUNK_SIZE: ""
  AVOCADO_PULP_UPLOAD_PARALLEL: ""
  # How many of a single recipe's RPMs to dedup+upload concurrently. Fan-out
  # recipes (glibc-locale ~1900 tiny RPMs, kernel modules) otherwise serialize
  # thousands of small WAN round-trips and dominate the build tail. Empty =
  # bbclass default (8).
  AVOCADO_PULP_RECIPE_PARALLEL: ""
  # SDK-build filter. Set to "1" for `avocado-sdk` builds so only the SDK-arch
  # packages (*-avocadosdk + all_avocadosdk) are published — the target/cross RPMs
  # an SDK build produces as deps belong to the distro feed, not the SDK repo.
  # Empty/"0" = publish everything the build produced (correct for distro builds).
  AVOCADO_PULP_UPLOAD_SDK_ONLY: ""
  # Space-separated list of recipe PNs whose RPMs should NOT be published to
  # Pulp. Use for aggregator metapackages (packagegroups, etc.) whose binary
  # output is machine-dependent/non-deterministic but which no one should
  # install directly — yocto still builds and packages them locally so image
  # construction works, we just skip the Pulp upload.
  AVOCADO_PULP_UPLOAD_EXCLUDE: "packagegroup-avocado-sdk-all"
