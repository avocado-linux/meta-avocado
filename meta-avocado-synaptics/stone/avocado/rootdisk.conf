require-fwup-version="1.4.0"

# Environment Variables
#
# AVOCADO_SDK_RUNTIME_DIR:                          (Required) Path to the images directory
# AVOCADO_IMAGE_BOOTLOADER:                         (Required) filename of the bootloader image
# AVOCADO_IMAGE_BOOT:                               (Required) filename of the boot image
# AVOCADO_IMAGE_ROOTFS:                             (Required) filename of the rootfs image
# AVOCADO_IMAGE_VAR:                                (Required) filename of the var image
#
# Meta Data
# AVOCADO_OS_CODENAME:                              (Required) Codename of the OS
# AVOCADO_OS_DESCRIPTION:                           (Required) Description of the OS
# AVOCADO_OS_VERSION:                               (Required) Version of the OS
# AVOCADO_OS_PLATFORM:                              (Required) Platform of the OS
# AVOCADO_OS_ARCHITECTURE:                          (Required) Architecture of the OS
# AVOCADO_OS_AUTHOR:                                (Optional) Author of the OS
# AVOCADO_OS_VCS_IDENTIFIER:                        (Optional) VCS identifier of the OS
# AVOCADO_OS_MISC:                                  (Optional) Misc information about the OS
#
# Device Info
# AVOCADO_DISK_UUID:                                (Required) UUID of the disk
# AVOCADO_DISK_BLOCK_SIZE:                          (Optional) Defaults to 512
#
# Factory Settings Partition
# AVOCADO_PARTITION_FACTORY_SETTINGS_TYPE:          (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_FACTORY_SETTINGS_UUID:          (Optional) Defaults to 0c3c8e38-f9b8-4a44-8c2c-3e3e1c4d5f01
# AVOCADO_PARTITION_FACTORY_SETTINGS_OFFSET:        (Required) Offset in blocks
# AVOCADO_PARTITION_FACTORY_SETTINGS_BLOCKS:        (Required) Number of blocks
#
# Key A Partition
# AVOCADO_PARTITION_KEY_A_TYPE:                     (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_KEY_A_UUID:                     (Optional) Defaults to 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c02
# AVOCADO_PARTITION_KEY_A_OFFSET:                   (Required) Offset in blocks
# AVOCADO_PARTITION_KEY_A_BLOCKS:                   (Required) Number of blocks
#
# TZK A Partition
# AVOCADO_PARTITION_TZK_A_TYPE:                     (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_TZK_A_UUID:                     (Optional) Defaults to 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d03
# AVOCADO_PARTITION_TZK_A_OFFSET:                   (Required) Offset in blocks
# AVOCADO_PARTITION_TZK_A_BLOCKS:                   (Required) Number of blocks
#
# Key B Partition
# AVOCADO_PARTITION_KEY_B_TYPE:                     (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_KEY_B_UUID:                     (Optional) Defaults to 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e04
# AVOCADO_PARTITION_KEY_B_OFFSET:                   (Required) Offset in blocks
# AVOCADO_PARTITION_KEY_B_BLOCKS:                   (Required) Number of blocks
#
# TZK B Partition
# AVOCADO_PARTITION_TZK_B_TYPE:                     (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_TZK_B_UUID:                     (Optional) Defaults to 4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f05
# AVOCADO_PARTITION_TZK_B_OFFSET:                   (Required) Offset in blocks
# AVOCADO_PARTITION_TZK_B_BLOCKS:                   (Required) Number of blocks
#
# Bootloader A Partition
# AVOCADO_PARTITION_BL_A_TYPE:                      (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_BL_A_UUID:                      (Optional) Defaults to 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9006
# AVOCADO_PARTITION_BL_A_OFFSET:                    (Required) Offset in blocks
# AVOCADO_PARTITION_BL_A_BLOCKS:                    (Required) Number of blocks
#
# Bootloader B Partition
# AVOCADO_PARTITION_BL_B_TYPE:                      (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_BL_B_UUID:                      (Optional) Defaults to 6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f900107
# AVOCADO_PARTITION_BL_B_OFFSET:                    (Required) Offset in blocks
# AVOCADO_PARTITION_BL_B_BLOCKS:                    (Required) Number of blocks
#
# Boot A Partition
# AVOCADO_PARTITION_BOOT_TYPE:                      (Optional) Defaults to BC13C2FF-59E6-4262-A352-B275FD6F7172
# AVOCADO_PARTITION_BOOT_A_UUID:                    (Optional) Defaults to a03d7687-5997-43da-b713-1bf14fdf34b2
# AVOCADO_PARTITION_BOOT_A_OFFSET:                  (Required) Offset in blocks
# AVOCADO_PARTITION_BOOT_A_BLOCKS:                  (Required) Number of blocks
#
# Boot B Partition
# AVOCADO_PARTITION_BOOT_B_UUID:                    (Optional) Defaults to ad8d457d-b534-4b48-8dc4-14568f13070c
# AVOCADO_PARTITION_BOOT_B_OFFSET:                  (Required) Offset in blocks
# AVOCADO_PARTITION_BOOT_B_BLOCKS:                  (Required) Number of blocks
#
# Firmware A Partition
# AVOCADO_PARTITION_FIRMWARE_A_TYPE:                (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_FIRMWARE_A_UUID:                (Optional) Defaults to 7a8b9c0d-1e2f-3a4b-5c6d-7e8f90010208
# AVOCADO_PARTITION_FIRMWARE_A_OFFSET:              (Required) Offset in blocks
# AVOCADO_PARTITION_FIRMWARE_A_BLOCKS:              (Required) Number of blocks
#
# Firmware B Partition
# AVOCADO_PARTITION_FIRMWARE_B_TYPE:                (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_FIRMWARE_B_UUID:                (Optional) Defaults to 8b9c0d1e-2f3a-4b5c-6d7e-8f9001020309
# AVOCADO_PARTITION_FIRMWARE_B_OFFSET:              (Required) Offset in blocks
# AVOCADO_PARTITION_FIRMWARE_B_BLOCKS:              (Required) Number of blocks
#
# RootFS A Partition
# AVOCADO_PARTITION_ROOTFS_TYPE:                    (Optional) Defaults to 4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709
# AVOCADO_PARTITION_ROOTFS_A_UUID:                  (Optional) Defaults to 668df1af-eeb4-481e-956c-422ad7afe99b
# AVOCADO_PARTITION_ROOTFS_A_OFFSET:                (Required) Offset in blocks
# AVOCADO_PARTITION_ROOTFS_A_BLOCKS:                (Required) Number of blocks
#
# RootFS B Partition
# AVOCADO_PARTITION_ROOTFS_B_UUID:                  (Optional) Defaults to d4cdbff1-1874-4e62-9db6-55dc077af11d
# AVOCADO_PARTITION_ROOTFS_B_OFFSET:                (Required) Offset in blocks
# AVOCADO_PARTITION_ROOTFS_B_BLOCKS:                (Required) Number of blocks
#
# Fastlogo A Partition
# AVOCADO_PARTITION_FASTLOGO_A_TYPE:                (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_FASTLOGO_A_UUID:                (Optional) Defaults to 9c0d1e2f-3a4b-5c6d-7e8f-90010203040a
# AVOCADO_PARTITION_FASTLOGO_A_OFFSET:              (Required) Offset in blocks
# AVOCADO_PARTITION_FASTLOGO_A_BLOCKS:              (Required) Number of blocks
#
# Fastlogo B Partition
# AVOCADO_PARTITION_FASTLOGO_B_TYPE:                (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_FASTLOGO_B_UUID:                (Optional) Defaults to 0d1e2f3a-4b5c-6d7e-8f90-01020304050b
# AVOCADO_PARTITION_FASTLOGO_B_OFFSET:              (Required) Offset in blocks
# AVOCADO_PARTITION_FASTLOGO_B_BLOCKS:              (Required) Number of blocks
#
# Devinfo Partition
# AVOCADO_PARTITION_DEVINFO_TYPE:                   (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_DEVINFO_UUID:                   (Optional) Defaults to 1e2f3a4b-5c6d-7e8f-9001-0203040506c0
# AVOCADO_PARTITION_DEVINFO_OFFSET:                 (Required) Offset in blocks
# AVOCADO_PARTITION_DEVINFO_BLOCKS:                 (Required) Number of blocks
#
# Misc Partition (used as U-Boot environment store for boot slot tracking)
# AVOCADO_PARTITION_MISC_TYPE:                      (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_MISC_UUID:                      (Optional) Defaults to 2f3a4b5c-6d7e-8f90-0102-030405060700
# AVOCADO_PARTITION_MISC_OFFSET:                    (Required) Offset in blocks
# AVOCADO_PARTITION_MISC_OFFSET_REDUND:             (Required) Offset of redundant env in blocks (typically MISC_OFFSET + MISC_BLOCKS/2)
# AVOCADO_PARTITION_MISC_BLOCKS:                    (Required) Number of blocks
#
# Var Partition
# AVOCADO_PARTITION_VAR_TYPE:                       (Optional) Defaults to 0FC63DAF-8483-4772-8E79-3D69D8477DE4
# AVOCADO_PARTITION_VAR_UUID:                       (Optional) Defaults to 4d21b016-b534-45c2-a9fb-5c16e091fd2d
# AVOCADO_PARTITION_VAR_OFFSET:                     (Required) Offset in blocks
# AVOCADO_PARTITION_VAR_BLOCKS:                     (Required) Number of blocks
# AVOCADO_PARTITION_VAR_EXPAND:                     (Optional) Defaults to true
#
# Kernel Cmdline
# AVOCADO_CMDLINE_EXTRA:                            (Optional) Extra kernel commandline arguments

define(BLOCK_SIZE, "${AVOCADO_DISK_BLOCK_SIZE:-512}")
define(DISK_UUID, "${AVOCADO_DISK_UUID}")

# Factory Settings
define(FACTORY_SETTINGS_PART_TYPE, "${AVOCADO_PARTITION_FACTORY_SETTINGS_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(FACTORY_SETTINGS_PART_UUID, "${AVOCADO_PARTITION_FACTORY_SETTINGS_UUID:-0c3c8e38-f9b8-4a44-8c2c-3e3e1c4d5f01}")
define(FACTORY_SETTINGS_PART_OFFSET, "${AVOCADO_PARTITION_FACTORY_SETTINGS_OFFSET}")
define(FACTORY_SETTINGS_PART_BLOCKS, "${AVOCADO_PARTITION_FACTORY_SETTINGS_BLOCKS}")

# Key A
define(KEY_A_PART_TYPE, "${AVOCADO_PARTITION_KEY_A_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(KEY_A_PART_UUID, "${AVOCADO_PARTITION_KEY_A_UUID:-1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c02}")
define(KEY_A_PART_OFFSET, "${AVOCADO_PARTITION_KEY_A_OFFSET}")
define(KEY_A_PART_BLOCKS, "${AVOCADO_PARTITION_KEY_A_BLOCKS}")

# TZK A
define(TZK_A_PART_TYPE, "${AVOCADO_PARTITION_TZK_A_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(TZK_A_PART_UUID, "${AVOCADO_PARTITION_TZK_A_UUID:-2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d03}")
define(TZK_A_PART_OFFSET, "${AVOCADO_PARTITION_TZK_A_OFFSET}")
define(TZK_A_PART_BLOCKS, "${AVOCADO_PARTITION_TZK_A_BLOCKS}")

# Key B
define(KEY_B_PART_TYPE, "${AVOCADO_PARTITION_KEY_B_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(KEY_B_PART_UUID, "${AVOCADO_PARTITION_KEY_B_UUID:-3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e04}")
define(KEY_B_PART_OFFSET, "${AVOCADO_PARTITION_KEY_B_OFFSET}")
define(KEY_B_PART_BLOCKS, "${AVOCADO_PARTITION_KEY_B_BLOCKS}")

# TZK B
define(TZK_B_PART_TYPE, "${AVOCADO_PARTITION_TZK_B_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(TZK_B_PART_UUID, "${AVOCADO_PARTITION_TZK_B_UUID:-4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f05}")
define(TZK_B_PART_OFFSET, "${AVOCADO_PARTITION_TZK_B_OFFSET}")
define(TZK_B_PART_BLOCKS, "${AVOCADO_PARTITION_TZK_B_BLOCKS}")

# Bootloader A
define(BL_A_PART_TYPE, "${AVOCADO_PARTITION_BL_A_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(BL_A_PART_UUID, "${AVOCADO_PARTITION_BL_A_UUID:-5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9006}")
define(BL_A_PART_OFFSET, "${AVOCADO_PARTITION_BL_A_OFFSET}")
define(BL_A_PART_BLOCKS, "${AVOCADO_PARTITION_BL_A_BLOCKS}")

# Bootloader B
define(BL_B_PART_TYPE, "${AVOCADO_PARTITION_BL_B_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(BL_B_PART_UUID, "${AVOCADO_PARTITION_BL_B_UUID:-6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f900107}")
define(BL_B_PART_OFFSET, "${AVOCADO_PARTITION_BL_B_OFFSET}")
define(BL_B_PART_BLOCKS, "${AVOCADO_PARTITION_BL_B_BLOCKS}")

# Boot
define(BOOT_PART_TYPE, "${AVOCADO_PARTITION_BOOT_TYPE:-BC13C2FF-59E6-4262-A352-B275FD6F7172}")
define(BOOT_A_PART_UUID, "${AVOCADO_PARTITION_BOOT_A_UUID:-a03d7687-5997-43da-b713-1bf14fdf34b2}")
define(BOOT_A_PART_OFFSET, "${AVOCADO_PARTITION_BOOT_A_OFFSET}")
define(BOOT_A_PART_BLOCKS, "${AVOCADO_PARTITION_BOOT_A_BLOCKS}")
define(BOOT_B_PART_UUID, "${AVOCADO_PARTITION_BOOT_B_UUID:-ad8d457d-b534-4b48-8dc4-14568f13070c}")
define(BOOT_B_PART_OFFSET, "${AVOCADO_PARTITION_BOOT_B_OFFSET}")
define(BOOT_B_PART_BLOCKS, "${AVOCADO_PARTITION_BOOT_B_BLOCKS}")

# Firmware
define(FIRMWARE_A_PART_TYPE, "${AVOCADO_PARTITION_FIRMWARE_A_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(FIRMWARE_A_PART_UUID, "${AVOCADO_PARTITION_FIRMWARE_A_UUID:-7a8b9c0d-1e2f-3a4b-5c6d-7e8f90010208}")
define(FIRMWARE_A_PART_OFFSET, "${AVOCADO_PARTITION_FIRMWARE_A_OFFSET}")
define(FIRMWARE_A_PART_BLOCKS, "${AVOCADO_PARTITION_FIRMWARE_A_BLOCKS}")
define(FIRMWARE_B_PART_TYPE, "${AVOCADO_PARTITION_FIRMWARE_B_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(FIRMWARE_B_PART_UUID, "${AVOCADO_PARTITION_FIRMWARE_B_UUID:-8b9c0d1e-2f3a-4b5c-6d7e-8f9001020309}")
define(FIRMWARE_B_PART_OFFSET, "${AVOCADO_PARTITION_FIRMWARE_B_OFFSET}")
define(FIRMWARE_B_PART_BLOCKS, "${AVOCADO_PARTITION_FIRMWARE_B_BLOCKS}")

# RootFS
define(ROOTFS_PART_TYPE, "${AVOCADO_PARTITION_ROOTFS_TYPE:-4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709}")
define(ROOTFS_A_PART_UUID, "${AVOCADO_PARTITION_ROOTFS_A_UUID:-668df1af-eeb4-481e-956c-422ad7afe99b}")
define(ROOTFS_A_PART_OFFSET, "${AVOCADO_PARTITION_ROOTFS_A_OFFSET}")
define(ROOTFS_A_PART_BLOCKS, "${AVOCADO_PARTITION_ROOTFS_A_BLOCKS}")
define(ROOTFS_B_PART_UUID, "${AVOCADO_PARTITION_ROOTFS_B_UUID:-d4cdbff1-1874-4e62-9db6-55dc077af11d}")
define(ROOTFS_B_PART_OFFSET, "${AVOCADO_PARTITION_ROOTFS_B_OFFSET}")
define(ROOTFS_B_PART_BLOCKS, "${AVOCADO_PARTITION_ROOTFS_B_BLOCKS}")

# Fastlogo
define(FASTLOGO_A_PART_TYPE, "${AVOCADO_PARTITION_FASTLOGO_A_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(FASTLOGO_A_PART_UUID, "${AVOCADO_PARTITION_FASTLOGO_A_UUID:-9c0d1e2f-3a4b-5c6d-7e8f-90010203040a}")
define(FASTLOGO_A_PART_OFFSET, "${AVOCADO_PARTITION_FASTLOGO_A_OFFSET}")
define(FASTLOGO_A_PART_BLOCKS, "${AVOCADO_PARTITION_FASTLOGO_A_BLOCKS}")
define(FASTLOGO_B_PART_TYPE, "${AVOCADO_PARTITION_FASTLOGO_B_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(FASTLOGO_B_PART_UUID, "${AVOCADO_PARTITION_FASTLOGO_B_UUID:-0d1e2f3a-4b5c-6d7e-8f90-01020304050b}")
define(FASTLOGO_B_PART_OFFSET, "${AVOCADO_PARTITION_FASTLOGO_B_OFFSET}")
define(FASTLOGO_B_PART_BLOCKS, "${AVOCADO_PARTITION_FASTLOGO_B_BLOCKS}")

# Devinfo
define(DEVINFO_PART_TYPE, "${AVOCADO_PARTITION_DEVINFO_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(DEVINFO_PART_UUID, "${AVOCADO_PARTITION_DEVINFO_UUID:-1e2f3a4b-5c6d-7e8f-9001-0203040506c0}")
define(DEVINFO_PART_OFFSET, "${AVOCADO_PARTITION_DEVINFO_OFFSET}")
define(DEVINFO_PART_BLOCKS, "${AVOCADO_PARTITION_DEVINFO_BLOCKS}")

# Misc (used as U-Boot environment store for boot slot tracking)
define(MISC_PART_TYPE, "${AVOCADO_PARTITION_MISC_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(MISC_PART_UUID, "${AVOCADO_PARTITION_MISC_UUID:-2f3a4b5c-6d7e-8f90-0102-030405060700}")
define(MISC_PART_OFFSET, "${AVOCADO_PARTITION_MISC_OFFSET}")
define-eval(MISC_PART_OFFSET_REDUND, "${AVOCADO_PARTITION_MISC_OFFSET} + ${AVOCADO_PARTITION_MISC_BLOCKS} / 2")
define(MISC_PART_BLOCKS, "${AVOCADO_PARTITION_MISC_BLOCKS}")
define-eval(MISC_ENV_BLOCKS, "${AVOCADO_PARTITION_MISC_BLOCKS} / 2")

# Var
define(VAR_PART_TYPE, "${AVOCADO_PARTITION_VAR_TYPE:-0FC63DAF-8483-4772-8E79-3D69D8477DE4}")
define(VAR_PART_UUID, "${AVOCADO_PARTITION_VAR_UUID:-4d21b016-b534-45c2-a9fb-5c16e091fd2d}")
define(VAR_PART_NAME, "${AVOCADO_PARTITION_VAR_NAME:-home}")
define(VAR_PART_OFFSET, "${AVOCADO_PARTITION_VAR_OFFSET}")
define(VAR_PART_BLOCKS, "${AVOCADO_PARTITION_VAR_BLOCKS}")
define(VAR_PART_EXPAND, "${AVOCADO_PARTITION_VAR_EXPAND:-true}")
# GPT attribute bit 56 ("grow to disk") when the manifest says expand: true -
# stone derives it from that field. The device's initramfs reads it back
# (avocado-var-grow) to know whether to extend the partition to the disk
# before /var is opened; nothing about the build has to know how the device
# was provisioned.
define(VAR_PART_FLAGS, "${AVOCADO_PARTITION_VAR_FLAGS:-0x0}")

# Firmware archive metadata
meta-product = ${AVOCADO_OS_CODENAME}
meta-description = ${AVOCADO_OS_DESCRIPTION}
meta-version = ${AVOCADO_OS_VERSION}
meta-platform = ${AVOCADO_OS_PLATFORM}
meta-architecture = ${AVOCADO_OS_ARCHITECTURE}
meta-author = ${AVOCADO_OS_AUTHOR}
meta-vcs-identifier = ${AVOCADO_OS_VCS_IDENTIFIER}
meta-misc = ${AVOCADO_OS_MISC}

gpt gpt {
    guid = ${DISK_UUID}
    partition 0 {
        block-offset = ${FACTORY_SETTINGS_PART_OFFSET}
        block-count = ${FACTORY_SETTINGS_PART_BLOCKS}
        type = ${FACTORY_SETTINGS_PART_TYPE}
        guid = ${FACTORY_SETTINGS_PART_UUID}
    }
    partition 1 {
        block-offset = ${KEY_A_PART_OFFSET}
        block-count = ${KEY_A_PART_BLOCKS}
        type = ${KEY_A_PART_TYPE}
        guid = ${KEY_A_PART_UUID}
    }
    partition 2 {
        block-offset = ${TZK_A_PART_OFFSET}
        block-count = ${TZK_A_PART_BLOCKS}
        type = ${TZK_A_PART_TYPE}
        guid = ${TZK_A_PART_UUID}
    }
    partition 3 {
        block-offset = ${KEY_B_PART_OFFSET}
        block-count = ${KEY_B_PART_BLOCKS}
        type = ${KEY_B_PART_TYPE}
        guid = ${KEY_B_PART_UUID}
    }
    partition 4 {
        block-offset = ${TZK_B_PART_OFFSET}
        block-count = ${TZK_B_PART_BLOCKS}
        type = ${TZK_B_PART_TYPE}
        guid = ${TZK_B_PART_UUID}
    }
    partition 5 {
        block-offset = ${BL_A_PART_OFFSET}
        block-count = ${BL_A_PART_BLOCKS}
        type = ${BL_A_PART_TYPE}
        guid = ${BL_A_PART_UUID}
    }
    partition 6 {
        block-offset = ${BL_B_PART_OFFSET}
        block-count = ${BL_B_PART_BLOCKS}
        type = ${BL_B_PART_TYPE}
        guid = ${BL_B_PART_UUID}
    }
    partition 7 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_BLOCKS}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_A_PART_UUID}
        boot = true
    }
    partition 8 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_BLOCKS}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_B_PART_UUID}
        boot = true
    }
    partition 9 {
        block-offset = ${FIRMWARE_A_PART_OFFSET}
        block-count = ${FIRMWARE_A_PART_BLOCKS}
        type = ${FIRMWARE_A_PART_TYPE}
        guid = ${FIRMWARE_A_PART_UUID}
    }
    partition 10 {
        block-offset = ${FIRMWARE_B_PART_OFFSET}
        block-count = ${FIRMWARE_B_PART_BLOCKS}
        type = ${FIRMWARE_B_PART_TYPE}
        guid = ${FIRMWARE_B_PART_UUID}
    }
    partition 11 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_BLOCKS}
        type = ${ROOTFS_PART_TYPE}
        guid = ${ROOTFS_A_PART_UUID}
    }
    partition 12 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_BLOCKS}
        type = ${ROOTFS_PART_TYPE}
        guid = ${ROOTFS_B_PART_UUID}
    }
    partition 13 {
        block-offset = ${FASTLOGO_A_PART_OFFSET}
        block-count = ${FASTLOGO_A_PART_BLOCKS}
        type = ${FASTLOGO_A_PART_TYPE}
        guid = ${FASTLOGO_A_PART_UUID}
    }
    partition 14 {
        block-offset = ${FASTLOGO_B_PART_OFFSET}
        block-count = ${FASTLOGO_B_PART_BLOCKS}
        type = ${FASTLOGO_B_PART_TYPE}
        guid = ${FASTLOGO_B_PART_UUID}
    }
    partition 15 {
        block-offset = ${DEVINFO_PART_OFFSET}
        block-count = ${DEVINFO_PART_BLOCKS}
        type = ${DEVINFO_PART_TYPE}
        guid = ${DEVINFO_PART_UUID}
    }
    partition 16 {
        block-offset = ${MISC_PART_OFFSET}
        block-count = ${MISC_PART_BLOCKS}
        type = ${MISC_PART_TYPE}
        guid = ${MISC_PART_UUID}
    }
    partition 17 {
        block-offset = ${VAR_PART_OFFSET}
        block-count = ${VAR_PART_BLOCKS}
        type = ${VAR_PART_TYPE}
        guid = ${VAR_PART_UUID}
        name = ${VAR_PART_NAME}
        expand = ${VAR_PART_EXPAND}
        flags = ${VAR_PART_FLAGS}
    }
}

# The misc partition is used as a U-Boot environment store for A/B boot slot
# tracking. Primary env lives at the start of misc; redundant at the midpoint.
uboot-environment uboot-env {
    block-offset = ${MISC_PART_OFFSET}
    block-offset-redund = ${MISC_PART_OFFSET_REDUND}
    block-count = ${MISC_ENV_BLOCKS}
}

file-resource bootloader.img {
    host-path = "${AVOCADO_SDK_RUNTIME_DIR}/${AVOCADO_IMAGE_BOOTLOADER}"
    assert-size-lte = ${BL_A_PART_BLOCKS}
}
file-resource boot.img {
    host-path = "${AVOCADO_SDK_RUNTIME_DIR}/${AVOCADO_IMAGE_BOOT}"
    assert-size-lte = ${BOOT_A_PART_BLOCKS}
}
file-resource rootfs.img {
    host-path = "${AVOCADO_SDK_RUNTIME_DIR}/${AVOCADO_IMAGE_ROOTFS}"
    assert-size-lte = ${ROOTFS_A_PART_BLOCKS}
}
file-resource var.img {
    host-path = "${AVOCADO_SDK_RUNTIME_DIR}/${AVOCADO_IMAGE_VAR}"
    assert-size-lte = ${VAR_PART_BLOCKS}
}

# This firmware task writes everything to the destination media.
# This should only be run for the first installation.
task complete {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        uboot_clearenv(uboot-env)
        gpt_write(gpt)
    }

    on-resource bootloader.img { raw_write(${BL_A_PART_OFFSET}) }
    on-resource boot.img { raw_write(${BOOT_A_PART_OFFSET}) }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-resource var.img { raw_write(${VAR_PART_OFFSET}) }

    on-finish {
        uboot_setenv(uboot-env, "avocado_boot_slot", "a")
        uboot_setenv(uboot-env, "avocado_device_id", "\${AVOCADO_DEVICE_ID}")
        uboot_setenv(uboot-env, "avocado_device_cert", "\${AVOCADO_DEVICE_CERT}")
        uboot_setenv(uboot-env, "avocado_device_key", "\${AVOCADO_DEVICE_KEY}")

        uboot_setenv(uboot-env, "peridio_vsn_current", "\${PERIDIO_VERSION}")
        uboot_setenv(uboot-env, "a.avocado_platform", "${AVOCADO_OS_PLATFORM}")
        uboot_setenv(uboot-env, "a.avocado_architecture", "${AVOCADO_OS_ARCHITECTURE}")
        uboot_setenv(uboot-env, "cmdline_extra", "\${AVOCADO_CMDLINE_EXTRA}")

        # Clear out any old data in the B partitions that might be mistaken for
        # a file system. This is mostly to avoid confusion in humans when
        # reprogramming devices with unknown contents.
        raw_memset(${BOOT_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
    }
}

task upgrade.a {
    # This task upgrades the A partition, so make sure we're running
    # on B.
    require-uboot-variable(uboot-env, "avocado_boot_slot", "b")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "b.avocado_platform", "${AVOCADO_OS_PLATFORM}")
    require-uboot-variable(uboot-env, "b.avocado_architecture", "${AVOCADO_OS_ARCHITECTURE}")

    on-init {
        info("Upgrading boot slot A")

        # Clear some firmware information just in case this update gets
        # interrupted midway. If this partition was bootable, it's not going to
        # be soon.
        uboot_unsetenv(uboot-env, "a.avocado_version")
        uboot_unsetenv(uboot-env, "a.avocado_platform")
        uboot_unsetenv(uboot-env, "a.avocado_architecture")
        uboot_unsetenv(uboot-env, "a.avocado_uuid")

        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_BLOCKS})
    }

    on-resource boot.img {
        delta-source-raw-offset=${BOOT_B_PART_OFFSET}
        delta-source-raw-count=${BOOT_B_PART_BLOCKS}
        raw_write(${BOOT_A_PART_OFFSET})
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_BLOCKS}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Reset the validation status and boot to A
        uboot_setenv(uboot-env, "avocado_boot_slot", "a")
        uboot_setenv(uboot-env, "a.avocado_platform", "${AVOCADO_OS_PLATFORM}")
        uboot_setenv(uboot-env, "a.avocado_architecture", "${AVOCADO_OS_ARCHITECTURE}")
    }
}

task upgrade.b {
    # This task upgrades the B partition, so make sure we're running
    # on A.
    require-uboot-variable(uboot-env, "avocado_boot_slot", "a")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "a.avocado_platform", "${AVOCADO_OS_PLATFORM}")
    require-uboot-variable(uboot-env, "a.avocado_architecture", "${AVOCADO_OS_ARCHITECTURE}")

    on-init {
        info("Upgrading boot slot B")

        # Clear some firmware information just in case this update gets
        # interrupted midway.
        uboot_unsetenv(uboot-env, "b.avocado_version")
        uboot_unsetenv(uboot-env, "b.avocado_platform")
        uboot_unsetenv(uboot-env, "b.avocado_architecture")
        uboot_unsetenv(uboot-env, "b.avocado_uuid")

        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_BLOCKS})
    }

    on-resource boot.img {
        delta-source-raw-offset=${BOOT_A_PART_OFFSET}
        delta-source-raw-count=${BOOT_A_PART_BLOCKS}
        raw_write(${BOOT_B_PART_OFFSET})
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_BLOCKS}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    on-finish {
        # Reset the validation status and boot to B next time.
        uboot_setenv(uboot-env, "avocado_boot_slot", "b")
        uboot_setenv(uboot-env, "b.avocado_platform", "${AVOCADO_OS_PLATFORM}")
        uboot_setenv(uboot-env, "b.avocado_architecture", "${AVOCADO_OS_ARCHITECTURE}")
    }
}

task upgrade.wrong {
    require-uboot-variable(uboot-env, "a.avocado_platform", "${AVOCADO_OS_PLATFORM}")
    require-uboot-variable(uboot-env, "a.avocado_architecture", "${AVOCADO_OS_ARCHITECTURE}")
    on-init {
        error("Please check the media being upgraded. It doesn't look like either the A or B boot slots are active.")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${AVOCADO_OS_PLATFORM} and architecture=${AVOCADO_OS_ARCHITECTURE}")
    }
}
