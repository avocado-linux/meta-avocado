#@TYPE: Machine
#@NAME: Grinn Astra 1680 SBC
#@DESCRIPTION: Grinn SBC based on the Synaptics Astra SL1680 SoC

STONE_PROVISIONING ?= "img sd"
GRINN_MACHINE = "${MACHINE_SHORT_NAME}"
MACHINEOVERRIDES =. "${GRINN_MACHINE}:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-synaptics.inc

require conf/machine/grinn-astra-1680-sbc.conf

ENABLE_RESCUE_MODE = "0"

SYNA_KERNEL_DTS_FILE:${GRINN_MACHINE} = "synaptics/grinn-astra-1680-sbc.dtb"
SYNA_U_BOOT_DTS_FILE:${GRINN_MACHINE} = "grinn-astra-1680-sbc.dtb"
SYNA_SDK_CONFIG_NAME = "sl1680_poky_aarch64_rdk"

PREFERRED_VERSION_meson = "1.7.0"
PREFERRED_VERSION_meson-native = "1.7.0"

IMAGE_MACHINE_SUFFIX = "-${MACHINE_SHORT_NAME}"

INITRAMFS_IMAGE_BUNDLE = "1"
INITRAMFS_IMAGE = "core-image-initramfs-boot"
ROOT_FSTYPES = "erofs-lz4 synaimg"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

AVOCADO_VAR_PART_DEV = "/dev/disk/by-partlabel/var"
