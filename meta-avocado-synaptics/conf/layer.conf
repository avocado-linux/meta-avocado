# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# The chromium bbappend is parsed only when meta-browser is provisioned. It sat
# on the static recipes-*/ path above while kas/extra.yml force-pulled that layer
# on every build; with the browsers group opt-in, grinn-astra-1680-sbc (the only
# machine that adds this layer) no longer pulls it by default, and a static
# bbappend would hard-fail parse with "No recipes in default available for:".
BBFILES_DYNAMIC += " \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/recipes-*/*/*.bb \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-avocado-synaptics"
BBFILE_PATTERN_meta-avocado-synaptics = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-synaptics = "10"

LAYERDEPENDS_meta-avocado-synaptics = "core"
LAYERSERIES_COMPAT_meta-avocado-synaptics = "wrynose"
