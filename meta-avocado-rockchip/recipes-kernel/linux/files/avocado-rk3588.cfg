# RK3588-specific config additions on top of rk3588_linux_defconfig.
#
# The BSP defconfig (rk3588.inc:11) builds most rk3588 device drivers as =y
# so they can't appear in the package feed as kernel-module-* RPMs. Flipping
# them to =m wholesale tends to break the BSP's own assumptions (some are
# required at boot before initramfs); do that surgically per driver after a
# first build confirms which actually need to be modular for avocado-cli's
# extension model. Keep this file minimal until then.
#
# Storage drivers we rely on for stone provisioning:
CONFIG_NVME_CORE=m
CONFIG_BLK_DEV_NVME=m
