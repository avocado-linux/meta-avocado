# Avocado-required kernel config (per distro/docs/adding-a-machine-target.md §10).
# Cribbed from meta-avocado-raspberrypi/recipes-kernel/linux/files/avocado-core.cfg.

# Initramfs decompression -- must match AVOCADO_IMAGE_INITRAMFS_TYPE (cpio.zst).
CONFIG_RD_ZSTD=y
CONFIG_RD_GZIP=y

# Root filesystem (avocado uses erofs for rootfs, btrfs for /var, squashfs in
# the package feed for sysext/confext). OVERLAY_FS lets sysexts mount cleanly.
CONFIG_BTRFS_FS=y
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_ZIP=y
CONFIG_OVERLAY_FS=y

CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_FILE_CACHE=y
# CONFIG_SQUASHFS_DECOMP_SINGLE is not set
CONFIG_SQUASHFS_DECOMP_MULTI=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_LZ4=n
CONFIG_SQUASHFS_LZO=n
CONFIG_SQUASHFS_XZ=n
CONFIG_SQUASHFS_ZSTD=y
CONFIG_SQUASHFS_4K_DEVBLK_SIZE=y
# CONFIG_SQUASHFS_EMBEDDED is not set
CONFIG_SQUASHFS_FRAGMENT_CACHE_SIZE=3

# Block device + partition support for stone-provisioned disks.
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y
CONFIG_BLK_DEV_LOOP=y

# Misc.
CONFIG_CRYPTO_LZ4=m
CONFIG_ZRAM=m
