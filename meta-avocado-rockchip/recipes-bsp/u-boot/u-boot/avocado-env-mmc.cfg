# Redundant U-Boot environment on the boot MMC, in the gap between u-boot.itb
# (8-16 MiB) and the first partition (32 MiB). Rockchip's mmc_get_env_dev()
# follows /chosen/u-boot,spl-boot-device, so an SD boot reads the SD's copy
# and an eMMC boot the eMMC's. Offsets must match the stone manifest's
# uboot-env entry and avocado-uboot-env's fw_env.config.
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x1000000
CONFIG_ENV_OFFSET_REDUND=0x1040000
# The boot flow in env/${MACHINE}.txt uses these.
CONFIG_CMD_SYSBOOT=y
CONFIG_CMD_FDT=y
CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SAVEENV=y
