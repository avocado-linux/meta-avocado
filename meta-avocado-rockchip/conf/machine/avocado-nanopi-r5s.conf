#@TYPE: Machine
#@NAME: NanoPi R5S (Avocado)
#@DESCRIPTION: FriendlyELEC NanoPi R5S (Rockchip RK3568, 4x A55)

STONE_PROVISIONING ?= "img sd emmc sd-usb"
# A/B through a U-Boot environment avocadoctl flips (fw_setenv): see
# recipes-bsp/u-boot/u-boot/env/${MACHINE}.txt.
BOOTVARS = "ubootenv"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:nanopi-r5s:"
UBOOT_ENV_SIZE = "0x20000"

# Plain Image + DTB in the boot FAT, as the stone manifest lays them out.
# Must be set before rk3568.inc: rockchip-defaults.inc picks the fitImage
# include and the extlinux KERNEL/FDT paths from it.
RK_KERNEL_FITIMAGE = "False"

require conf/machine/include/avocado.inc
require conf/machine/include/rk3568.inc
require conf/machine/include/avocado-rockchip.inc

KERNEL_DEVICETREE = "rockchip/rk3568-nanopi-r5s.dtb"
UBOOT_MACHINE     = "nanopi-r5s-rk3568_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# One extlinux.conf for both boot slots and both disks: U-Boot expands the
# variable in APPEND (bitbake leaves the unknown reference as written).
# avocado_root_partuuid is the slot's rootfs on the disk U-Boot booted from
# (env/${MACHINE}.txt); partition GUIDs are random per provision, so it can't
# name the other disk.
# ponytail: a lost U-Boot env (both redundant copies bad) falls back to the
# compiled-in default env, where avocado_boot_slot is unset and root= names no
# partition; compile the flow in (CONFIG_ENV_SOURCE_FILE) if that ever matters.
UBOOT_EXTLINUX_ROOT = "root=PARTUUID=${avocado_root_partuuid}"

# The var partition by label: base-files' 61-avocado-var rule takes it only on
# the disk the root PARTUUID is on, so with Avocado on both the eMMC and a
# microSD, /var (and avocado-var-grow) follow the disk that booted.
AVOCADO_VAR_PART_DEV = "/dev/disk/by-partlabel/var"
