#@TYPE: Machine
#@NAME: Orange Pi 5 Plus (Avocado)
#@DESCRIPTION: Xunlong Orange Pi 5 Plus (Rockchip RK3588, 4x A76 + 4x A55)

STONE_PROVISIONING ?= "img sd"
MACHINEOVERRIDES =. "orangepi-5-plus:"

require conf/machine/include/avocado.inc
require conf/machine/include/rk3588.inc
require conf/machine/include/avocado-rockchip.inc

# rk3588-orangepi-5-plus.dts landed in mainline v6.7; linux-yocto 6.6 ships
# with scarthgap doesn't include it (its yocto-kernel-cache lacks the OPi 5+
# definitions). linux-yocto-dev tracks upstream master and has it.
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-dev"

KERNEL_DEVICETREE = "rockchip/rk3588-orangepi-5-plus.dtb"
UBOOT_MACHINE     = "orangepi-5-plus-rk3588_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
