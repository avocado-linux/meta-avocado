# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-sdk"
BBFILE_PATTERN_meta-avocado-sdk = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-sdk = "8"

LAYERDEPENDS_meta-avocado-sdk = "core"
LAYERSERIES_COMPAT_meta-avocado-sdk = "wrynose"
