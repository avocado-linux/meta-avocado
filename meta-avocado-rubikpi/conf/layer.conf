# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-rubikpi"
BBFILE_PATTERN_meta-avocado-rubikpi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-rubikpi = "9"

LAYERDEPENDS_meta-avocado-rubikpi = "core"
LAYERSERIES_COMPAT_meta-avocado-rubikpi = "wrynose"

PREFERRED_PROVIDER_virtual/mesa = "mesa-gl"
PREFERRED_PROVIDER_virtual/libgl = "mesa-gl"
