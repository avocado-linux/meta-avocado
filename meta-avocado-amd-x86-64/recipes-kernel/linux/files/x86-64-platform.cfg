# x86-64 platform additions on top of yocto-kernel-cache's amd-x86-64 BSP.
#
# The BSP (bsp/amd-x86/amd-x86-64-standard.scc: the standard ktype baseline
# plus amd-x86.cfg and the common-pc fragments) provides the bulk of the
# config. This file carries only what it leaves off or sets differently where
# that matters here - each line below was checked against a merge of the BSP
# without this file. Keep it that way: a line the BSP already produces belongs
# in the BSP, not here.

# systemd: PSI backs systemd-oomd, CHECKPOINT_RESTORE gives kcmp(), and the
# AF_ALG hash interface is used before modules can load (BSP builds it =m).
CONFIG_PSI=y
CONFIG_CHECKPOINT_RESTORE=y
CONFIG_CRYPTO_USER_API_HASH=y

# x2APIC and interrupt remapping - UEFI firmware on current x86 parts hands
# over in x2APIC mode.
CONFIG_X86_X2APIC=y
CONFIG_IRQ_REMAP=y

# EFI runtime map (kexec) and bootloader control (systemd-boot's
# LoaderEntryOneShot / reboot-to-firmware).
CONFIG_EFI_RUNTIME_MAP=y
CONFIG_EFI_BOOTLOADER_CONTROL=m

# Firmware loading for drivers probed from the rootfs.
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_COMPRESS=y

# Early framebuffer console until amdgpu (a module) takes over.
CONFIG_FB_SIMPLE=y
CONFIG_DRM_SIMPLEDRM=y

# Storage beyond the BSP's AHCI/NVMe/usb-storage.
CONFIG_ATA_GENERIC=y
CONFIG_CHR_DEV_SG=y
CONFIG_USB_OHCI_PCI=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_SDHCI_ACPI=y

# Discrete NIC modules the BSP does not build (it builds e1000e/igb/xgbe in).
CONFIG_IXGBE=m
CONFIG_ICE=m

# Bluetooth
CONFIG_BT=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_BCM=m
CONFIG_BT_RTL=m

# Platform Security Processor (PCI 1022:15c7). The firmware TPM stays on
# tpm_crb_acpi; this driver is the PSP mailbox the kernel otherwise never
# talks to (TEE, platform access).
CONFIG_CRYPTO_DEV_CCP=y
CONFIG_CRYPTO_DEV_CCP_DD=m
CONFIG_CRYPTO_DEV_SP_PSP=y

# Sensor Fusion Hub (PCI 1022:164a).
CONFIG_AMD_SFH_HID=m

# Audio Coprocessor, ACP 6.3 (PCI 1022:15e2 rev 0x63). ACP_CONFIG picks the
# legacy pci-ps driver or SOF per platform; the FCH HD Audio link on this
# carrier has no codec, so the ACP is the only analog audio path the SoC has.
CONFIG_SND_SOC=m
CONFIG_SND_AMD_ACP_CONFIG=m
CONFIG_SND_SOC_AMD_PS=m
CONFIG_SND_SOC_AMD_PS_MACH=m

# XDNA NPU (PCI 1022:1502); firmware amdnpu/1502_00 ships in the rootfs.
CONFIG_DRM_ACCEL=y
CONFIG_DRM_ACCEL_AMDXDNA=m

# Container networking. br_netfilter stays a module (the BSP builds it in) so
# kernel-module-br-netfilter exists - the shared docker extension depends on
# that package by name.
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_BRIDGE_NETFILTER=m
