# x86-64 platform baseline for the AMD layer.
#
# kernel-yocto's do_kernel_configme builds the config off allnoconfig, not
# alldefconfig, whenever a KBUILD_DEFCONFIG-seeded sources/defconfig exists
# (merge_config.sh -n). x86_64_defconfig leaves most of what a real x86-64
# board needs to Kconfig's "default y", and under allnoconfig none of those
# defaults fire. Every symbol below has to be requested explicitly.
#
# The vendor-neutral half of meta-avocado-x86-64's x86-efi.cfg, which does the
# same job for Intel. That fragment is not reused directly because it also builds
# Intel-only drivers (LPSS, i915, iwlwifi, BT_INTEL, coretemp); this machine
# keeps its vendor payload AMD-only, the same reason its machine conf avoids
# avocado-x86-64.inc. Keep the two in sync when either changes.

CONFIG_64BIT=y
CONFIG_X86_64=y
CONFIG_SMP=y

CONFIG_X86_X2APIC=y
CONFIG_IRQ_REMAP=y

# Machine-Check Exceptions (hardware error reporting)
CONFIG_X86_MCE=y

# ACPI - EFI depends on it. Without it CONFIG_EFI and CONFIG_EFI_STUB silently
# drop out, the bzImage is not a PE binary, and systemd-boot refuses it:
# "Error loading EFI binary \bzImage: Unsupported".
CONFIG_ACPI=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_ACPI_THERMAL=y
CONFIG_X86_ACPI_CPUFREQ=m

# EFI / systemd-boot
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_RUNTIME_MAP=y
CONFIG_EFI_BOOTLOADER_CONTROL=m
CONFIG_EFIVAR_FS=y
CONFIG_EFI_MIXED=y

# Early console
CONFIG_SERIAL_EARLYCON=y
CONFIG_EFI_EARLYCON=y
CONFIG_EARLY_PRINTK=y

# Firmware loader (GPU, WiFi, Bluetooth firmware)
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_COMPRESS=y

# UEFI framebuffer and console
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FB_SIMPLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_VT_HW_CONSOLE_BINDING=y
CONFIG_DRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_SIMPLEDRM=y

# NVMe
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y

# AHCI/SATA
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_GENERIC=y

# SCSI (USB storage and SATA both surface as /dev/sd*)
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_CHR_DEV_SG=y
CONFIG_BLK_DEV_BSG=y

# USB storage and HID - the provisioning medium is a USB stick
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_STORAGE=y
CONFIG_USB_PCI=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_OHCI_PCI=y
CONFIG_HID_SUPPORT=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_ATKBD=y

# MMC/eMMC/SD
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_SDHCI_ACPI=y

# Ethernet - discrete NIC vendors, not the SoC vendor
CONFIG_NET_VENDOR_INTEL=y
CONFIG_E1000E=m
CONFIG_IGB=m
CONFIG_IXGBE=m
CONFIG_ICE=m
CONFIG_NET_VENDOR_REALTEK=y
CONFIG_R8169=m

# PTP (required by ICE)
CONFIG_PTP_1588_CLOCK=y
CONFIG_PCI_MSI=y

# WiFi stack
CONFIG_WIRELESS=y
CONFIG_WLAN=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RFKILL=m

# Bluetooth
CONFIG_BT=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_BCM=m
CONFIG_BT_RTL=m

# Audio. SND_HDA_INTEL is the generic HD-Audio controller driver, AMD's included.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCI=y
CONFIG_SND_HDA=y
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_HDA_CODEC_HDMI=m
CONFIG_SND_HDA_CODEC_REALTEK=m
CONFIG_SND_HDA_GENERIC=m

CONFIG_HWMON=y

# Networking (containers, VPN, tunneling)
CONFIG_NET_NS=y
CONFIG_TUN=m
CONFIG_VETH=m
CONFIG_BRIDGE=m
CONFIG_NET_SCH_FQ_CODEL=m
CONFIG_FUSE_FS=m
CONFIG_CUSE=m

CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_BRIDGE_NETFILTER=m
