# AMD-specific hardware support (R8000 HoneyComb: Ryzen R8000 COM6 Compact, Zen4)
#
# yocto-kernel-cache's amd-x86-64 BSP (bsp/amd-x86/amd-x86.cfg) already covers
# the FCH UART (X86_AMD_PLATFORM_DEVICE, SERIAL_8250_DW), pinctrl, IOMMU,
# microcode, amdgpu (=m, so its firmware loads from the rootfs), k10temp and
# AMD PMC. Only what it leaves off belongs here.

# TPM 2.0: discrete chip wired over SPI per the vendor's block diagram. The
# FCH usually exposes it through the TIS MMIO window (tpm.cfg's TCG_TIS), so
# this is the fallback for a board that routes it to the SPI controller.
CONFIG_TCG_TIS_SPI=y
