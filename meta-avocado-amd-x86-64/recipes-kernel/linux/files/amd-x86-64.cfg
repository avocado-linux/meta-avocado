# AMD-specific hardware support (R8000 HoneyComb: Ryzen R8000 COM6 Compact, Zen4)

# kernel-yocto's do_kernel_configme passes merge_config.sh "-n" (allnoconfig
# base, not alldefconfig) whenever a KBUILD_DEFCONFIG-seeded sources/defconfig
# already exists, which x86_64_defconfig-based builds always do. Under
# allnoconfig, Kconfig's computed default for CONFIG_64BIT
# (arch/x86/Kconfig: default "$(ARCH)" != "i386") never fires - every kernel
# module and vmlinux built 32-bit until this was set explicitly. Intel's
# sibling fragment (meta-avocado-x86-64/recipes-kernel/linux/files/x86-efi.cfg)
# carries the same two lines for the same reason; that fragment is not in
# scope here (SRC_URI:append:avocado-x86-64 does not apply to this machine).
CONFIG_64BIT=y
CONFIG_X86_64=y

# GPU: Radeon iGPU
CONFIG_DRM_AMDGPU=y

# CPU temperature/power sensors
CONFIG_SENSORS_K10TEMP=m
CONFIG_AMD_PMC=y

# TPM 2.0: discrete chip wired over SPI per the vendor's block diagram.
# tpm.cfg (shared with Intel) only enables TIS/CRB; CRB alone is the wrong
# interface for an SPI-attached discrete TPM.
CONFIG_TCG_TIS_SPI=y
