# AMD-specific hardware support (R8000 HoneyComb: Ryzen R8000 COM6 Compact, Zen4)

# Serial console. The FCH UARTs are memory-mapped DesignWare 8250s enumerated
# through ACPI (AMDI0020), not legacy 16550s at 0x3F8, so the generic 8250 driver
# alone never finds them: firmware prints to the header UART and the kernel goes
# silent right after the systemd-boot handoff. AMD's counterpart of Intel's
# CONFIG_X86_INTEL_LPSS. SPCR lets a bare `earlycon` find the port the firmware
# itself uses.
CONFIG_X86_AMD_PLATFORM_DEVICE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_ACPI_SPCR_TABLE=y

# GPU: Radeon iGPU
CONFIG_DRM_AMDGPU=y

# CPU temperature/power sensors
CONFIG_SENSORS_K10TEMP=m
CONFIG_AMD_PMC=y

# TPM 2.0: discrete chip wired over SPI per the vendor's block diagram.
# tpm.cfg (shared with Intel) only enables TIS/CRB; CRB alone is the wrong
# interface for an SPI-attached discrete TPM.
CONFIG_TCG_TIS_SPI=y
