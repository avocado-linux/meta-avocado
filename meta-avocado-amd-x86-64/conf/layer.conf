# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-amd-x86-64"
BBFILE_PATTERN_meta-avocado-amd-x86-64 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-amd-x86-64 = "9"

# amd-x86-64.cfg lives here but is applied by meta-avocado-x86-64's relocated
# bbappend (linux-yocto_%.bbappend), which cannot see ${LAYERDIR} at parse
# time - expose the dir as a var, mirroring meta-avocado-nxp's
# AVOCADO_NXP_KERNEL_FILESDIR.
AVOCADO_AMD_X86_64_KERNEL_FILESDIR := "${LAYERDIR}/recipes-kernel/linux/files"

LAYERDEPENDS_meta-avocado-amd-x86-64 = "core meta-avocado-x86-64"
LAYERSERIES_COMPAT_meta-avocado-amd-x86-64 = "wrynose"
