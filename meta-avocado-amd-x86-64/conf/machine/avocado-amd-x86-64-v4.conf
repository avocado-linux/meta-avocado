#@TYPE: Machine
#@NAME: AMD x86-64-v4 machine
#@DESCRIPTION: x86-64-v4 (AVX-512) for CPUs with full AVX-512 support
#
# Target processor and codename:
#   AMD: Ryzen R8000 COM6 Compact (Zen4, Hawk Point, SolidRun HoneyComb)
#
# NOTE: This is a standalone AMD sibling to the meta-avocado-x86-64 Intel
# family. It shares only the x86-64-v4 tune include with that family -
# it does NOT require conf/machine/include/avocado-x86-64.inc, since that
# include unconditionally installs packagegroup-avocado-nvidia-gpu on every
# x86-64 target, which is wrong for this board's Radeon iGPU. The generic
# settings that include also carries (boot method, serial console, kernel
# image type, var partition device) are duplicated below instead.
#
# Key instruction sets: AVX-512 (F, VL, BW, CD, DQ)

STONE_PROVISIONING ?= "img usb"
MACHINEOVERRIDES =. "avocado-amd-x86-64:"

require conf/machine/include/avocado.inc

DEFAULTTUNE ?= "x86-64-v4"
require conf/machine/include/x86/tune-x86-64-v4.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto:avocado-amd-x86-64-v4 = "7.2%"

MACHINE_FEATURES += "x86 pci efi"

KERNEL_IMAGETYPE = "bzImage"

# FCH DesignWare UART, expected at ttyS4 - see avocado-boot-amd.conf's debt marker.
SERIAL_CONSOLES ?= "115200;ttyS4"

EFI_PROVIDER = "systemd-boot"
AVOCADO_BOOTLOADER = "uefi"

# The plaintext var partition. /var actually mounts /dev/disk/by-avocado/var,
# which resolves here unless the initrd opened a LUKS mapping over it
# (docs/security-capabilities.md).
AVOCADO_VAR_PART_DEV = "/dev/disk/by-partlabel/var"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "v86d"

# Ensure kernel modules are built as packages (loadable, not built-in)
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# QEMU usermode cannot emulate AVX-512 instructions via TCG, so disable
# the exe_wrapper that Meson uses for cross-compilation sanity checks.
MACHINE_FEATURES_OPTED_OUT += "qemu-usermode"

# What this machine can deliver on the security side; read by
# avocado-security-capabilities.bbclass before the tpm2 request below is
# honoured. Discrete TPM 2.0 over SPI; no encrypted-var wiring yet.
AVOCADO_SECURITY_CAPABILITIES = "tpm2"

DISTRO_FEATURES += "tpm2"
PACKAGECONFIG:append:pn-systemd = " tpm2"
