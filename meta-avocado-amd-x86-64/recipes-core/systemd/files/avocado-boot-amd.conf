title Avocado OS
linux /bzImage
initrd /initramfs.cpio.zst
# root= names slot A only as the fallback for a boot where the slot cannot be
# determined. stone delivers this one file to both ESPs byte for byte, so no
# spelling of root= here can select a slot; avocado-slot-root-generator does
# that in the initramfs from the LoaderDevicePartUUID the firmware set.
#
# The header UART is an FCH DesignWare UART, not the legacy ttyS0. With four
# legacy slots reserved (CONFIG_SERIAL_8250_RUNTIME_UARTS=4) the first ACPI UART
# should enumerate as ttyS4. Bare `earlycon` takes the port from the firmware's
# SPCR table, so kernel output reaches the header whatever the index turns out to be.
#
# devtool-debt: ttyS4 is inferred, not observed, and keep_bootcon double-prints
# once the real console is up. Ceiling: first bring-up boots only.
# Upgrade trigger: a boot's dmesg names the FCH UART's ttyS line - set that
# here and in SERIAL_CONSOLES, and drop keep_bootcon.
options root=PARTLABEL=rootfs-a ro earlycon keep_bootcon console=tty0 console=ttyS4,115200n8
