# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado-distro"
BBFILE_PATTERN_meta-avocado-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-distro = "9"

LAYERDEPENDS_meta-avocado-distro = "core"
LAYERSERIES_COMPAT_meta-avocado-distro = "scarthgap"
