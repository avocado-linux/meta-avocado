# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes/bbappends that extend a vendor feature layer parse only when that
# layer's collection is present, so a build that does not opt into the feature
# (its vendor layer absent) does not fail on a missing class or a dangling
# bbappend. Each entry is keyed on the vendor layer's BBFILE_COLLECTIONS name.
BBFILES_DYNAMIC += " \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/recipes-*/*/*.bb \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/recipes-*/*/*.bbappend \
    webkit:${LAYERDIR}/dynamic-layers/webkit/recipes-*/*/*.bb \
    webkit:${LAYERDIR}/dynamic-layers/webkit/recipes-*/*/*.bbappend \
    wayland:${LAYERDIR}/dynamic-layers/wayland/recipes-*/*/*.bb \
    wayland:${LAYERDIR}/dynamic-layers/wayland/recipes-*/*/*.bbappend \
    meta-openjdk-temurin:${LAYERDIR}/dynamic-layers/meta-openjdk-temurin/recipes-*/*/*.bb \
    meta-openjdk-temurin:${LAYERDIR}/dynamic-layers/meta-openjdk-temurin/recipes-*/*/*.bbappend \
    meta-aws:${LAYERDIR}/dynamic-layers/meta-aws/recipes-*/*/*.bb \
    meta-aws:${LAYERDIR}/dynamic-layers/meta-aws/recipes-*/*/*.bbappend \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/ros2-jazzy-layer/recipes-*/*/*.bb \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/ros2-jazzy-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-avocado-distro"
BBFILE_PATTERN_meta-avocado-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-distro = "10"

LAYERDEPENDS_meta-avocado-distro = "core"
LAYERSERIES_COMPAT_meta-avocado-distro = "scarthgap"
