# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes / bbappends gated on the presence of other vendor layers. Files
# live under dynamic-layers/<collection>/... so the static BBFILES glob
# above doesn't pick them up unconditionally; bitbake only parses them
# when the named layer collection is in BBFILE_COLLECTIONS. Lets us keep
# avocado-side fixes in tree across times when the upstream vendor layer
# is disabled in kas (e.g. while waiting on wrynose support), which is now
# the normal case rather than the exception: every feature layer is opt-in.
#
# No webkit entry here, unlike scarthgap: webkit has no wrynose branch, so there
# is no bbappend for it to gate and an entry pointing at an empty directory would
# only suggest otherwise. ros2-jazzy-layer gates the GTSAM bbappend.
BBFILES_DYNAMIC += " \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/ros2-jazzy-layer/recipes-*/*/*.bb \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/ros2-jazzy-layer/recipes-*/*/*.bbappend \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/recipes-*/*/*.bb \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/recipes-*/*/*.bbappend \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/recipes-*/*/*.bb \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/recipes-*/*/*.bbappend \
    wayland:${LAYERDIR}/dynamic-layers/wayland/recipes-*/*/*.bb \
    webkit:${LAYERDIR}/dynamic-layers/webkit/recipes-*/*/*.bb \
    webkit:${LAYERDIR}/dynamic-layers/webkit/recipes-*/*/*.bbappend \
    wayland:${LAYERDIR}/dynamic-layers/wayland/recipes-*/*/*.bbappend \
    meta-aws:${LAYERDIR}/dynamic-layers/meta-aws/recipes-*/*/*.bb \
    meta-aws:${LAYERDIR}/dynamic-layers/meta-aws/recipes-*/*/*.bbappend \
"
BBFILE_COLLECTIONS += "meta-avocado-distro"
BBFILE_PATTERN_meta-avocado-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado-distro = "10"

LAYERDEPENDS_meta-avocado-distro = "core"
LAYERSERIES_COMPAT_meta-avocado-distro = "wrynose"
