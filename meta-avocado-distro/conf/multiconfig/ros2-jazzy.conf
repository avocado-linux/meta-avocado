# Multiconfig: ros2-jazzy
#
# The ros2-jazzy add-on feed (docs/addon-feeds.md): ROS 2 Jazzy for the same
# MACHINE as the default config, built into its own TMPDIR and published as
# target/<machine>-ros2-jazzy and sdk/<machine>-ros2-jazzy beside the base
# feed instead of inside it. A project opts in with
# `distro.feeds: [ros2-jazzy]`.
#
# The default config masks meta-ros entirely (kas/feature/ros.yml). Here it is
# unmasked, except for meta-ros's bbappends to recipes the base feed also
# ships: those would rebuild a base package with different content, and a ROS
# package linked against that copy would not match the base package a device
# actually installs. Masked, every base recipe hashes as it does in the
# default config and comes from the same sstate.
TMPDIR = "${TOPDIR}/tmp-ros2-jazzy"
BUILDHISTORY_DIR = "${TMPDIR}/buildhistory"

# Not masked: libeigen_%.bbappend makes the empty libeigen package ROS recipes
# depend on (meta-oe's is header-only). The base feed does not ship libeigen,
# so only the add-on carries it.
#
# meta-ros-common also carries its own libyaml, which would replace oe-core's
# (and pyyaml-native with it) under the same name and version.
AVOCADO_ROS_BBMASK = " \
    meta-ros/meta-ros-common/recipes-support/libyaml/ \
    meta-ros/meta-ros-common/recipes-extended/bash/bash_%.bbappend \
    meta-ros/meta-ros-common/recipes-support/boost/boost_%.bbappend \
    meta-ros/meta-ros-common/recipes-support/ceres-solver/ceres-solver_%.bbappend \
    meta-ros/meta-ros-common/recipes-multimedia/ffmpeg/ffmpeg_%.bbappend \
    meta-ros/meta-ros-common/recipes-graphics/freeglut/freeglut_%.bbappend \
    meta-ros/meta-ros2/recipes-graphics/jasper/jasper_%.bbappend \
    meta-ros/meta-ros-common/recipes-graphics/jasper/jasper_%.bbappend \
    meta-ros/meta-ros-common/recipes-devtools/lapack/lapack_%.bbappend \
    meta-ros/meta-ros-common/recipes-graphics/mesa/libglu_%.bbappend \
    meta-ros/meta-ros-common/recipes-multimedia/libogg/libogg_%.bbappend \
    meta-ros/meta-ros-common/recipes-graphics/libraw/libraw_%.bbappend \
    meta-ros/meta-ros-common/recipes-multimedia/libtheora/libtheora_%.bbappend \
    meta-ros/meta-ros-common/recipes-graphics/libxv/libxv_%.bbappend \
    meta-ros/meta-ros-common/dynamic-layers/meta-python-ai/recipes-support/openblas/openblas_%.bbappend \
    meta-ros/meta-ros-common/recipes-dbs/postgresql/postgresql_%.bbappend \
    meta-ros/meta-ros-common/recipes-devtools/python/python3-matplotlib_%.bbappend \
    meta-ros/meta-ros-common/recipes-devtools/python/python3_%.bbappend \
    meta-ros/meta-ros-common/recipes-devtools/python/python3-pyproj_%.bbappend \
    meta-ros/meta-ros2/dynamic-layers/meta-qt6/recipes-python/pyqt6/python3-pyqt6_%.bbappend \
    meta-ros/meta-ros-common/recipes-bsp/bootfiles/rpi-config_%.bbappend \
    meta-ros/meta-ros-common/recipes-support/swig/swig_%.bbappend \
    meta-ros/meta-ros-common/recipes-devtools/yaml-cpp/yaml-cpp_%.bbappend \
"
