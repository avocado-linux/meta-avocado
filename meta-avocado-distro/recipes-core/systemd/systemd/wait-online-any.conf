[Service]
# systemd ships 80-wired.network, which matches every ether link, so networkd
# manages each one. systemd-networkd-wait-online then waits for ALL managed
# links and exits 1 after its 120s timeout if any of them never comes up.
#
# On a board with more than one Ethernet port and only one cable - which is the
# normal bench and field case - that means network-online.target is reached 120s
# late on every boot, and every unit ordered after it pays the same delay.
# Observed on FRDM-IMX93, where eth1 is unpopulated: `systemctl start docker`
# blocked for just over two minutes before dockerd was even executed.
#
# --any reports online as soon as one managed link is up, which is what a device
# with a single uplink actually means by "online". A product that genuinely
# requires several links up before a service starts should express that with
# RequiredForOnline= on the specific interfaces rather than by making every
# board wait for a port that may not be connected.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
