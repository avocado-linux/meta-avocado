[Unit]
# systemd-networkd.service sets DefaultDependencies=no and is ordered against
# neither sysinit.target nor avocado-extension.service, so it can read its
# configuration before extensions have merged. An extension that ships a
# .network or .netdev file under /usr/lib/systemd/network then races networkd:
# on a cold boot networkd may already have enumerated its links and not see the
# extension's profile until something reloads it.
#
# After= is ordering only. It adds no Wants= or Requires=, so networkd still
# starts when avocado-extension.service is skipped (an empty /var/lib/avocado,
# or the initrd, which uses avocado-extension-initrd.service instead).
After=avocado-extension.service
