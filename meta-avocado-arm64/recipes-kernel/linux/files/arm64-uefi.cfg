# arm64 UEFI machines on top of the in-tree defconfig, which already carries
# ACPI, EFI, SMMUv3, NVMe, xhci (ACPI PNP0D15 included), the 8250/PL011 UARTs,
# mlx5 and r8169. Board drivers stay modules; BSP extensions install them.

# MediaTek MT7925 Wi-Fi 7 (PCIe), as on the DGX Spark; its Bluetooth half is
# already in defconfig
CONFIG_MT7925E=m

# USB boot stick (the usb provisioning profile)
CONFIG_USB_UAS=y

# The NVIDIA open GPU driver owns NVIDIA GPUs here
# CONFIG_DRM_NOUVEAU is not set

# Firmware TPMs reached through CRB over FF-A (DGX OS uses this on the Spark)
CONFIG_TCG_CRB=y
CONFIG_TCG_ARM_CRB_FFA=y
CONFIG_ARM_FFA_TRANSPORT=y

# The Tegra CBB error driver binds the fabrics of NVIDIA ACPI SoCs (NVDA1070:
# Grace, GB10) from a pure_initcall. DGX OS keeps it off the GB10 with
# initcall_blacklist=tegra234_cbb_init; off here instead, so no board needs a
# command line for it. Grace loses fabric error logging, nothing else.
# CONFIG_SOC_TEGRA_CBB is not set

# Mellanox ConnectX RDMA (RoCE): verbs for NCCL/MPI, e.g. Sparks linked by QSFP
CONFIG_INFINIBAND=m
CONFIG_INFINIBAND_USER_ACCESS=m
CONFIG_MLX5_INFINIBAND=m

# ConnectX firmware flashing (devlink flash)
CONFIG_MLXFW=m

# Native PCIe hot-plug on the root ports
CONFIG_HOTPLUG_PCI_PCIE=y

# HD Audio controllers enumerated by ACPI rather than PCI (GB10 HDMI audio)
CONFIG_SND_HDA_ACPI=m

# ACPI Time and Alarm device (wake timers)
CONFIG_ACPI_TAD=m

# /sys/firmware/dmi/entries, read by fwupd and inventory tools
CONFIG_DMI_SYSFS=m

# Lazy IOTLB invalidation, as DGX OS 6.11 (NVIDIA's 7.0 goes further, to
# passthrough). Strict invalidation costs DMA throughput on GPUs and 100G+
# NICs; translation stays on.
CONFIG_IOMMU_DEFAULT_DMA_LAZY=y

# NVIDIA UVM on coherent (ATS) GPUs such as GB10 and Grace Hopper binds
# process address spaces through the SMMU: nvidia-uvm only builds its ATS path
# with CONFIG_IOMMU_SVA, and without it cuInit() fails with
# CUDA_ERROR_NOT_INITIALIZED. ARM_SMMU_V3_SVA selects IOMMU_SVA and IOMMU_IOPF.
CONFIG_ARM_SMMU_V3_SVA=y

# UVM's HMM path (discrete GPUs) needs device-private memory
CONFIG_ZONE_DEVICE=y
CONFIG_DEVICE_PRIVATE=y

# GPUDirect RDMA: peer-to-peer DMA between the GPU and ConnectX
CONFIG_PCI_P2PDMA=y

# zram-generator.conf asks for lz4; without the backend zram falls back to
# lzo-rle and logs 'algorithm "lz4" not recognised' every boot
CONFIG_ZRAM_BACKEND_LZ4=y

# The rest of the RDMA stack rdma-core loads at boot (rdma-load-modules):
# IPoIB, the user MAD interface (ibstat, opensm) and iSER. rpcrdma is already =m.
CONFIG_INFINIBAND_IPOIB=m
CONFIG_INFINIBAND_USER_MAD=m
CONFIG_INFINIBAND_ISER=m

# ACPI on arm64 servers and workstations, as DGX OS sets:
# FFH OpRegion handler (SMCCC): GB10's \_SB.FANx._FST reads fan speed through
# it; without it the acpi_fan hwmon returns EIO and ACPI logs AE_NOT_EXIST.
CONFIG_ACPI_FFH=y
# Firmware-first PCIe AER through APEI/GHES
CONFIG_ACPI_APEI_PCIEAER=y
# Arm Generic Diagnostic Dump and Reset (SDEI)
CONFIG_ACPI_AGDI=y
# PCI slot identification (pairs with native PCIe hotplug)
CONFIG_ACPI_PCI_SLOT=y
# ACPI IPMI OpRegion, for servers with a BMC
CONFIG_ACPI_IPMI=m

# The defconfig's Raspberry Pi 5 RP1 driver selects PCI_DYNAMIC_OF_NODES, which
# on an ACPI system (no of_root) logs "PCI: OF: of_root node is NULL, cannot
# create PCI host bridge node" for every host bridge at err priority. A Pi 5 is
# not a UEFI machine.
# CONFIG_MISC_RP1 is not set
# CONFIG_PCI_DYNAMIC_OF_NODES is not set
