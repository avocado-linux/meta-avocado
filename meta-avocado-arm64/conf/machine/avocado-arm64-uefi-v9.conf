#@TYPE: Machine
#@NAME: arm64 UEFI, Armv9-A
#@DESCRIPTION: Armv9.0-A (SVE2) ACPI/UEFI systems
#
# Target processors and systems:
#   NVIDIA: Grace (Neoverse V2), DGX Spark / GB10 (Cortex-X925 + A725)
#   Arm Neoverse: N2, V2, V3 (AWS Graviton4, Microsoft Cobalt 100,
#                 Google Axion)
#
# Key instruction sets: SVE2, SVE, NEON, LSE atomics, crypto (AES/SHA/PMULL)
# Does NOT require: Armv9.2 additions (GB10 has them, Grace does not)

STONE_PROVISIONING ?= "img usb"
MACHINEOVERRIDES =. "arm64-uefi-v9:"

require conf/machine/include/avocado.inc
require conf/machine/include/avocado-arm64-uefi.inc

DEFAULTTUNE ?= "armv9a-crypto"
require conf/machine/include/arm/arch-armv9a.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"

# Assessed: no TPM is reachable on the boards this level targets so far (DGX
# OS sees none on the Spark), and there is no encrypted-var wiring yet.
AVOCADO_SECURITY_CAPABILITIES = ""
