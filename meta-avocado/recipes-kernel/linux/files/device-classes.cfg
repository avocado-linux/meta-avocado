# Device classes customers plug into any board, built as modules so a runtime
# installs only what it uses (through extensions). Shared by every vendor
# kernel that requires avocado-device-classes-kernel.inc.
#
# Options a kernel already builds in (=y) are deliberately absent: an =m line
# would demote them, and a built-in that becomes a module changes what each
# kernel provides. Before requiring this from a new kernel, check none of
# these lines is =y in its .config (see the .inc). The two =y lines are
# booleans (menus/features), not modules: BT_LE, INPUT_JOYSTICK, HIDRAW and
# NETFILTER_XTABLES_LEGACY.

# USB serial: microcontrollers, LiDARs, motor drivers, GNSS, modems
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_SIMPLE=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_OPTION=m
CONFIG_USB_SERIAL_WWAN=m
CONFIG_USB_SERIAL_QUALCOMM=m
CONFIG_USB_SERIAL_SIERRAWIRELESS=m
CONFIG_USB_SERIAL_F81232=m
CONFIG_USB_SERIAL_XR=m
CONFIG_USB_ACM=m

# CAN: the socket protocols, virtual CAN, and the common USB and SPI controllers
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_GW=m
CONFIG_CAN_ISOTP=m
CONFIG_CAN_J1939=m
CONFIG_CAN_VCAN=m
CONFIG_CAN_VXCAN=m
CONFIG_CAN_SLCAN=m
CONFIG_CAN_DEV=m
CONFIG_CAN_GS_USB=m
CONFIG_CAN_PEAK_USB=m
CONFIG_CAN_KVASER_USB=m
CONFIG_CAN_8DEV_USB=m
CONFIG_CAN_EMS_USB=m
CONFIG_CAN_ESD_USB=m
CONFIG_CAN_MCP251XFD=m
CONFIG_CAN_MCP251X=m

# Container networking: what Docker, Podman and k3s create (bridges, veth pairs, NAT, overlay networks)
CONFIG_BRIDGE=m
CONFIG_VETH=m
CONFIG_BRIDGE_NETFILTER=m
CONFIG_NF_TABLES=m
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_REDIR=m
CONFIG_NFT_COMPAT=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_FIB_INET=m
CONFIG_NFT_LIMIT=m
CONFIG_NFT_LOG=m
CONFIG_NF_NAT=m
CONFIG_NF_CONNTRACK=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_TARGET_MASQUERADE=m
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
CONFIG_NETFILTER_XT_MARK=m
CONFIG_IP6_NF_IPTABLES=m
# The legacy x_tables tables iptables-legacy (and Docker by default) use.
# PREEMPT_RT kernels can't have them (NETFILTER_XTABLES_LEGACY depends on
# !PREEMPT_RT upstream): there, containers use the nftables backend.
CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_IP_NF_IPTABLES_LEGACY=m
CONFIG_IP6_NF_IPTABLES_LEGACY=m
CONFIG_IP6_NF_FILTER=m
CONFIG_IP6_NF_NAT=m
CONFIG_IP_VS=m
CONFIG_VXLAN=m
CONFIG_IPVLAN=m
CONFIG_DUMMY=m
CONFIG_VLAN_8021Q=m
CONFIG_BONDING=m
CONFIG_WIREGUARD=m

# Input: gamepads and joysticks for teleoperation
CONFIG_INPUT_JOYSTICK=y
CONFIG_INPUT_JOYDEV=m
CONFIG_JOYSTICK_XPAD=m
CONFIG_HID_SONY=m
CONFIG_HID_PLAYSTATION=m
CONFIG_HID_NINTENDO=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_LOGITECH_HIDPP=m
# /dev/hidraw: what SDL, HIDAPI and most game-controller, security-key and
# USB-sensor libraries open. HID_LOGITECH_DJ depends on it.
CONFIG_HIDRAW=y
CONFIG_HID_STEAM=m

# USB audio
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_ALOOP=m

# Bluetooth: classic, LE, USB and UART controllers
CONFIG_BT=m
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_BNEP=m
CONFIG_BT_HIDP=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIUART=m

# USB Ethernet and cellular data
CONFIG_USB_USBNET=m
CONFIG_USB_RTL8152=m
CONFIG_USB_NET_AX88179_178A=m
CONFIG_USB_NET_AX8817X=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_CDC_EEM=m
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_NET_SMSC95XX=m
CONFIG_USB_NET_SMSC75XX=m
CONFIG_USB_LAN78XX=m
CONFIG_USB_NET_CDC_MBIM=m
CONFIG_USB_NET_QMI_WWAN=m
CONFIG_USB_NET_CDC_SUBSET=m
