CONFIG_DM_VERITY=y
CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y
CONFIG_DM_INTEGRITY=y
CONFIG_INTEGRITY_SIGNATURE=y
CONFIG_INTEGRITY_ASYMMETRIC_KEYS=y
CONFIG_INTEGRITY_TRUSTED_KEYRING=y
CONFIG_INTEGRITY_PLATFORM_KEYRING=y
CONFIG_INTEGRITY_MACHINE_KEYRING=y
# CONFIG_INTEGRITY_CA_MACHINE_KEYRING is not set
CONFIG_LOAD_UEFI_KEYS=y
CONFIG_ASYMMETRIC_KEY_TYPE=y
CONFIG_ASYMMETRIC_PUBLIC_KEY_SUBTYPE=y
CONFIG_X509_CERTIFICATE_PARSER=y
# CONFIG_PKCS8_PRIVATE_KEY_PARSER is not set
# CONFIG_PKCS7_MESSAGE_PARSER is not set
CONFIG_SYSTEM_TRUSTED_KEYRING=y
CONFIG_SYSTEM_EXTRA_CERTIFICATE=y
CONFIG_SYSTEM_EXTRA_CERTIFICATE_SIZE=4096
CONFIG_SECONDARY_TRUSTED_KEYRING=y
CONFIG_SYSTEM_BLACKLIST_KEYRING=y
# Verity's per-read cost is one SHA-256 per 4 KiB block, and the generic C
# fallback is roughly an order of magnitude slower than the ARMv8 CE
# instructions, so pin the hardware path rather than inherit it from whichever
# defconfig the kernel started from. The symbol moved: through 6.15 it is the
# crypto-API driver CRYPTO_SHA2_ARM64_CE (=m on nvidia's fragments, unset on
# NXP's); from 6.16 SHA-256 lives in lib/crypto and the arch-optimised code is
# CRYPTO_LIB_SHA256_ARCH, with CE dispatch decided at runtime. Each line is a
# no-op on kernels where its symbol does not exist (verified 6.18.20 on
# imx8mp-evk: SHA2_ARM64_CE absent, LIB_SHA256_ARCH=y), so both are listed.
# Built-in, not a module: the rootfs verity path (roothash= on the cmdline)
# needs it before any module can be loaded.
CONFIG_CRYPTO_SHA2_ARM64_CE=y
CONFIG_CRYPTO_LIB_SHA256_ARCH=y
