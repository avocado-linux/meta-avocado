# Do not let udev auto-load the OP-TEE fTPM driver from the microsoft,ftpm DT
# modalias at coldplug: that happens at kernel-init time, before tee-supplicant
# is running, so the fTPM's REE-FS session fails and the device never appears.
# optee-ftpm-setup loads it explicitly (blacklist does not block modprobe by
# name) once tee-supplicant is up.
blacklist tpm_ftpm_tee
