# In the initrd, optee-ftpm-setup.service runs the only tee-supplicant, on the
# fTPM's persistent store. optee-client's tee-ftpm-modprobe.service would otherwise start
# there too (tee-supplicant.service is WantedBy=basic.target): a second
# supplicant on the default store, in the initramfs tmpfs. The supplicant
# device admits one, so one of them fails, and if the packaged one wins the
# fTPM's state is lost at reboot. On a running system it is left as shipped.
[Unit]
ConditionPathExists=!/etc/initrd-release
