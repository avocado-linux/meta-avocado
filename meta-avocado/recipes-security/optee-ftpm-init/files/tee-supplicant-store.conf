# On the running system the fTPM's store must be served by a supplicant whose
# root is the real root. The initrd's supplicant cannot do it, even when it
# survives the switch: switch-root changes the root of pid 1 only, so that
# daemon stays rooted in the emptied initramfs and every path it opens after
# the switch, the store included, resolves there, in RAM.
#
# optee-ftpm-setup.sh mounts the store under /run, which moves into the real
# root, and writes the -f option for it to the environment file read here.
# Without that file (the initrd found no store, or could not mount it) the
# default below still keeps the supplicant off its compiled-in /var/lib/tee:
# this unit starts before the real /var is mounted, and a supplicant that
# cannot create its store directory exits, taking the fTPM with it. The fTPM
# then works from /run, without persistence, as on a skipped store before.
#
# This covers optee-client's tee-supplicant.service (the L4T unit). meta-arm's
# tee-supplicant@.service template, used where optee-client comes from
# meta-arm, does not read this drop-in.
#
# Started ahead of sysinit.target and the systemd TPM units: the fTPM issues
# storage requests from its first NV write on, and a request with no
# supplicant behind it kills the trusted application until the next reset.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=sysinit.target tpm2.target systemd-tpm2-setup-early.service systemd-tpm2-setup.service shutdown.target

[Service]
Environment=OPTARGS=-f /run/teestore
EnvironmentFile=-/run/optee-ftpm/supplicant.env
