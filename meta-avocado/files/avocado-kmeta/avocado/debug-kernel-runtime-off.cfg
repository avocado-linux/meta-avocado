# Applied after features/debug/debug-kernel.scc when AVOCADO_KERNEL_DEBUGINFO
# is "1", only where a layer opts in with AVOCADO_KERNEL_DEBUGINFO_RUNTIME_OFF
# = "1" (avocado-kernel-feed.bbclass), because there DEBUG_KERNEL is off without
# the switch. DEBUG_KERNEL un-gates these: kernel-cache fragments the BSP
# already includes request some, and the rest default on under them or under
# DEBUG_KERNEL. Turning them back off leaves the switch changing debug info
# only. KDB_DEFAULT_ENABLE and KDB_CONTINUE_CATASTROPHIC are values under
# KGDB_KDB and go with it.

# Requested by cfg/debug/kgdb/debug-kgdb.cfg and features/kgdb/kgdb.cfg
# CONFIG_KGDB is not set
# CONFIG_KGDB_KDB is not set
# CONFIG_KGDB_SERIAL_CONSOLE is not set
# CONFIG_KGDB_LOW_LEVEL_TRAP is not set
# CONFIG_KGDB_HONOUR_BLOCKLIST is not set
# CONFIG_KDB_KEYBOARD is not set
# CONFIG_CONSOLE_POLL is not set

# Requested by cfg/debug/sched/debug-sched.cfg, features/cgroups/cgroups.cfg
# and cfg/debug/rcu/debug-rcu-trace.cfg
# CONFIG_SCHED_DEBUG is not set
# CONFIG_CGROUP_DEBUG is not set
# CONFIG_RCU_TRACE is not set

# Default on under DEBUG_KERNEL
# CONFIG_DEBUG_MISC is not set
# CONFIG_X86_DEBUG_FPU is not set
