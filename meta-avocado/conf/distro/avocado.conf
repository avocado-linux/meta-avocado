INITRAMFS_FSTYPES ?= "cpio.zst"
ROOT_FSTYPES ?= "erofs-lz4"

INITRAMFS_IMAGE = "avocado-image-initramfs"
INITRAMFS_IMAGE_BUNDLE ?= "0"
INITRAMFS_IMAGE_NAME = "${INITRAMFS_IMAGE}-${MACHINE_SHORT_NAME}"

# 'efi' is a DISTRO feature here even though the machines that care declare
# MACHINE_FEATURES += "efi". The two are not interchangeable and the difference
# was costing us: systemd's own PACKAGECONFIG default filters DISTRO_FEATURES
# (oe-core systemd_259.5.bb: bb.utils.filter('DISTRO_FEATURES', '... efi ...')),
# so a machine feature never reached it and EVERY Avocado image - x86-64
# included, not just the arm boards - shipped a systemd built with -Defi=false.
#
# What that cost: systemd mounts efivarfs itself from PID 1, gated on
# is_efi_boot(), which is compiled out without EFI support. So a board that
# booted through the EFI stub came up with /sys/firmware/efi/efivars present and
# EMPTY, because nothing had mounted it - indistinguishable from firmware that
# exposes no variables until you go looking at /proc/filesystems.
#
# Turning it on also sets -Dbootloader=enabled, so systemd-boot gets BUILT for
# every machine. It is only built, not installed: nothing here adds it to an
# image, and the boards select their bootloader through AVOCADO_BOOTLOADER.
AVOCADO_DEFAULT_DISTRO_FEATURES = "multiarch ptest systemd usrmerge secureboot security pam ldconfig openssl zram efi"
DISTRO_FEATURES_EXTRA ?= ""
DISTRO_FEATURES:append = " ${AVOCADO_DEFAULT_DISTRO_FEATURES} ${DISTRO_FEATURES_DEFAULTS} ${DISTRO_FEATURES_EXTRA}"

INIT_MANAGER = "systemd"
PACKAGECONFIG:append:pn-systemd = " sysext cryptsetup"

INHERIT += "avocado-sysusers"

# The rootfs is erofs (read-only) but /var is a persistent partition, which
# oe-core's read_only_rootfs_hook does not model: finding no pre-generated key
# in /etc/ssh, it points sshd at sshd_config_readonly with host keys under
# OPENSSH_HOST_KEY_DIR_READONLY_CONFIG, whose oe-core default is
# ${localstatedir}/run/ssh - tmpfs. That presents a new host key on every
# reboot, breaking every client's known_hosts and the SSH connection
# `avocado container dev up` depends on to reconnect after one.
#
# Pointing it at /var/lib/ssh instead lets the existing first-boot keygen in
# sshd_check_keys land the keys somewhere that survives a reboot, with no
# image post-processing and no dependence on oe-core's internal ordering of
# IMAGE_PREPROCESS_COMMAND vs ROOTFS_POSTPROCESS_COMMAND entries.
OPENSSH_HOST_KEY_DIR_READONLY_CONFIG = "/var/lib/ssh"

# W1 (2026 per-target repo topology, plan.md Workstream 1): every (machine, channel)
# owns ONE Pulp repo covering all its target arches (machine arch, shared tunes, noarch)
# with its own repomd, instead of pooling shared/noarch arches across machines. This is
# the 2026 line (wrynose); the var defaults off in avocado-arch-utils.bbclass, so
# 2024/scarthgap keeps the pooled layout until backport.
AVOCADO_PERTARGET_REPOS = "1"

require conf/distro/avocado.inc
