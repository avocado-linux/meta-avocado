BB_CONF_FRAGMENT_SUMMARY = "AvocadoOS avocado-icam-540 build configuration (generated from kas)"
BB_CONF_FRAGMENT_DESCRIPTION = "MACHINE, DISTRO, environment defaults and local.conf settings for the avocado-icam-540 target. Generated by scripts/kas2bitbake-setup.py from kas/machine/icam-540.yml -- do not edit by hand. Build with: bitbake avocado-distro"

MACHINE = "avocado-icam-540"
DISTRO = "avocado"

# Environment defaults (from kas `env`). These are also
# listed in bb-env-passthrough-additions so the invoking
# shell environment can still override them; `?=` defers
# to a value imported from the environment when present.
BB_GIT_SHALLOW ?= "0"
BB_GENERATE_SHALLOW_TARBALLS ?= "1"
BB_GIT_SHALLOW_DEPTH ?= "1"
PRSERV_HOST ?= "localhost:0"
BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ?= "auto"
AVOCADO_REPO_BASE ?= "http://package-repo"
DISTRO_CODENAME ?= "dev/local"
DISTRO_VERSION ?= "0.0.0"
BUILD_ID ?= "0"
PARALLEL_MAKE_HIGHMEM ?= ""
SDKMACHINE ?= "x86_64"
AVOCADO_DEV_ROOT_LOGIN ?= "0"
AVOCADO_RM_WORK ?= "1"

# --- kas local_conf_header: meta-avocado ---
USER_CLASSES:append = "${@ ' rm_work' if os.environ.get('AVOCADO_RM_WORK', '1') == '1' else ''} buildhistory buildstats buildstats-summary"

LICENSE_FLAGS_ACCEPTED:append = " commercial commercial_% synaptics-killswitch"

# Enable Fortran support globally
FORTRAN:forcevariable = ",fortran"

# Ensure gcc-cross is built with Fortran before gcc-runtime
DEPENDS:append:pn-gcc-runtime = " gcc-cross-${TARGET_ARCH}"

# Make sure the Fortran compiler is available for the target build
GFORTRAN:class-target = "${TARGET_PREFIX}gfortran"
FC:class-target = "${TARGET_PREFIX}gfortran"
F77:class-target = "${TARGET_PREFIX}gfortran"

# Enable Fortran for both cross and runtime
FORTRAN:pn-gcc-cross-${TARGET_ARCH} = ",fortran"
FORTRAN:pn-gcc-runtime = ",fortran"

# Add libquadmath which is often needed with Fortran
RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
HOSTTOOLS += "gfortran"

# --- kas local_conf_header: fetch ---
# crates.io (per RFC 3463) blocks library-only User-Agents like the wget
# default. Identify ourselves with an app name + contact so fetches aren't
# rejected. Applies to all wget-based fetches, including the crate fetcher.
FETCHCMD_wget = "/usr/bin/env wget -t 2 -T 100 --user-agent='avocado-linux-ci (j.schneck@peridio.com)'"

# --- kas local_conf_header: sdk ---
CONF_VERSION = "2"

# --- kas local_conf_header: vendor-nvidia ---
TEGRA_INITRD_FLASH_INITRAMFS_FSTYPES = "cpio.gz.cboot"
DISTRO_FEATURES_EXTRA:append = "opengl wayland seccomp virtualization efi"
LICENSE_FLAGS_ACCEPTED:append = " commercial_faad2 commercial_x264"

ROOTFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-rootfs "
INITRAMFS_IMAGE_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-initramfs"
PKG_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-extra"
SDK_PKG_EXTRA_INSTALL:append = " packagegroup-avocado-tegra-sdk-extra"

# libnvidia-container's Makefile derives MAJOR/MINOR/PATCH from
# `git describe --tags` in ${S}; shallow tarballs strip tags and break
# do_compile with "Invalid major version".
BB_GIT_SHALLOW:pn-libnvidia-container = "0"
BB_GIT_SHALLOW_DEPTH:pn-libnvidia-container = "0"

# --- kas local_conf_header: feature/multi-kernel-jetson ---
BBMULTICONFIG += "jetson-l4t"
AVOCADO_MULTIKERNEL_MC_RECIPES += "jetson-l4t:linux-jammy-nvidia-tegra jetson-l4t:nvidia-kernel-oot"

# --- kas local_conf_header: extra-qt5 ---
PACKAGECONFIG:append:pn-qtbase = " gles2 eglfs kms gbm harfbuzz"
PACKAGECONFIG:append:pn-qtmultimedia = " gstreamer"

# --- kas local_conf_header: extra-openjdk ---
# OpenJDK 17 configuration
# Use OpenJDK 17 as the default Java version
PREFERRED_VERSION_openjdk-17-jdk ?= "17.0.12+7"
PREFERRED_VERSION_openjdk-17-jre ?= "17.0.12+7"
PREFERRED_VERSION_openjdk-17-jdk-native ?= "17.0.12+7"
