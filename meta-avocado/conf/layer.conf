# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avocado"
BBFILE_PATTERN_meta-avocado = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avocado = "7"

addpylib ${LAYERDIR}/lib avocado_sdk_metadata

LAYERDEPENDS_meta-avocado = "core"
LAYERSERIES_COMPAT_meta-avocado = "scarthgap"

# Where this layer lives, for avocado.inc to ask git which commit it is at.
# Bound here because LAYERDIR is only meaningful while this file is parsed.
AVOCADO_LAYER_DIR := "${LAYERDIR}"
addpylib ${LAYERDIR}/lib avocado_distro
