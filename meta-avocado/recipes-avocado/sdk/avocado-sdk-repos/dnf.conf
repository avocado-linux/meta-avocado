# see `man dnf.conf` for defaults and possible options

[main]
gpgcheck=True
# Kernel family packages (base kernel, modules, devsrc, OOT shims) are
# installonly so multiple kernel generations can coexist in the same rpm db
# without dnf trying to replace one with another during installs. Combined
# with every kernel-family package carrying KERNEL_VERSION in its name, this
# lets a rolling feed hold several kernels side by side cleanly.
installonlypkgs=kernel-*,nv-kernel-module-*
installonly_limit=3
clean_requirements_on_remove=True
best=False
skip_if_unavailable=True
