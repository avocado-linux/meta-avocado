image boot.vfat {
	vfat {
		files = {
			"avocado-image-initramfs-@MACHINE@.cpio.zst",
			"Image"
		}
	}
  size = 128M
}

image recovery.vfat {
	vfat {
		files = {
			"avocado-image-initramfs-@MACHINE@.cpio.zst",
		}
	}
  size = 128M
}

image @IMAGE@ {
	hdimage {
		partition-table = true
		gpt = true
	}

	partition ubootenv {
		image = "uboot.env"
		partition-type-uuid = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
		offset = 1M
		size = 128K
	}

	partition boot-a {
		image = "boot.vfat"
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		bootable = "true"
		offset = 2M
	}

	partition boot-b {
		image = "boot.vfat"
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		bootable = "false"
		offset = 130M
	}

	partition recovery {
		image = "recovery.vfat"
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		bootable = "false"
		offset = 258M
	}

	partition rootfs-a {
		image = "avocado-image-rootfs-@MACHINE@.rootfs.squashfs"
		partition-type-uuid = "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
		offset = 386M
	}

	partition rootfs-b {
		image = "avocado-image-rootfs-@MACHINE@.rootfs.squashfs"
		partition-type-uuid = "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
		offset = 514M
	}

	partition var {
		image = "@VAR-IMG@"
		partition-uuid = "4d21b016-b534-45c2-a9fb-5c16e091fd2d"
		partition-type = 0x8300
		offset = 642M
	}
}
