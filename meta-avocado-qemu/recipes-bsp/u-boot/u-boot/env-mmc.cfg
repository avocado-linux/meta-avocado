# CONFIG_ENV_IS_IN_FLASH is not set
# Wrynose: U-Boot 2026.01 renamed SYS_REDUNDAND_ENVIRONMENT (note the typo)
# to ENV_REDUNDANT in env/Kconfig. Old name is silently ignored, so the
# fragment had no effect and U-Boot defaulted to non-redundant env layout
# ([CRC:4][data:env_size-4]) while fwup writes redundant layout
# ([CRC:4][flag:1][data:env_size-5]). Result: U-Boot computes CRC over a
# byte range that's offset by 1 from fwup's range and reports "bad CRC,
# using default environment" — booting without our avocado_boot_init /
# bootcmd, falling through to bootflow scan that finds nothing.
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x100000
CONFIG_ENV_OFFSET_REDUND=0x140000
CONFIG_ENV_IS_IN_MMC=y
CONFIG_MMC_PCI=y
CONFIG_MMC_SDHCI=y
CONFIG_CMD_MMC=y
CONFIG_MMC=y
