#@TYPE: Machine
#@NAME: QEMU ARM64 machine
#@DESCRIPTION: Machine configuration for running an ARM64 system on QEMU


BOOTVARS = "ubootenv"
STONE_PROVISIONING ?= "img direct"
MACHINEOVERRIDES =. "bootvars-${BOOTVARS}:qemuarm64-secureboot:qemuarm64:"

require conf/machine/include/avocado.inc

require ${COREBASE}/meta/conf/machine/qemuarm64.conf

KMACHINE = "qemuarm64"

UBOOT_ENV_SIZE = "0x20000"

# secure=on can't ever use KVM, so force it off
QEMU_USE_KVM = ""

QB_MACHINE = "-machine virt,secure=on,highmem=off,acpi=off"
QB_MEM = "-m 1024"
QB_DEFAULT_FSTYPE = "wic.qcow2"
QB_DEFAULT_BIOS = "flash.bin"
QB_FSINFO = "wic:no-kernel-in-fs"
QB_ROOTFS_OPT = ""
QB_KERNEL_ROOT = "/dev/vda2"

WKS_FILE ?= "avocado-qemuarm64.wks"
DEPENDS:append:pn-avocado-img-bootfiles = " trusted-firmware-a"
IMAGE_BOOT_FILES = "${KERNEL_IMAGETYPE}"

MACHINE_FEATURES += " optee-ftpm"

PACKAGECONFIG:append:pn-systemd = " tpm2"

# /var is a LUKS2 container that cryptsetup-var.service formats (first boot) and
# opens in the initramfs. Mount /var from the dm-crypt mapper rather than the raw
# partition: var.mount then implicitly orders after dev-mapper-var.device, which
# only appears once cryptsetup-var has opened the container - so the mount waits
# for the unlock instead of racing it and dropping to emergency mode. (Same fix
# as qemux86-64; here the key is sealed to the OP-TEE fTPM rather than swtpm.)
AVOCADO_VAR_PART_DEV = "/dev/mapper/var"
