#@TYPE: Machine
#@NAME: QEMU x86-64 machine
#@DESCRIPTION: Machine configuration for running an x86-64 system on QEMU


STONE_PROVISIONING ?= "img direct"
MACHINEOVERRIDES =. "qemux86-64:"

# UEFI boot method (default uboot comes from conf/machine/include/avocado.inc).
# The stone / img-bootfiles / sdk bbappends gate boot artifacts on this.
AVOCADO_BOOTLOADER = "uefi"

require conf/machine/include/avocado.inc

KMACHINE = "qemux86-64"

DEPENDS:append:pn-qemu-native = " swtpm-native"

PREFERRED_PROVIDER_virtual/xserver ?= "xserver-xorg"
PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles3 ?= "mesa"

require conf/machine/include/qemu.inc
DEFAULTTUNE ?= "core2-64"
require conf/machine/include/x86/tune-x86-64-v3.inc
require conf/machine/include/x86/qemuboot-x86.inc

KERNEL_IMAGETYPE = "bzImage"

SERIAL_CONSOLES ?= "115200;ttyS0"

# Install swrast and glx if opengl is in DISTRO_FEATURES and x32 is not in use.
# This is because gallium swrast driver was found to crash X server on startup in qemu x32.
XSERVER = "xserver-xorg \
           ${@bb.utils.contains('DISTRO_FEATURES', 'opengl', \
           bb.utils.contains('TUNE_FEATURES', 'mx32', '', 'mesa-driver-swrast xserver-xorg-extension-glx', d), '', d)} \
           xf86-video-cirrus \
           xf86-video-fbdev \
           xf86-video-vmware \
           xf86-video-modesetting \
           xf86-video-vesa \
           xserver-xorg-module-libint10 \
           "

MACHINE_FEATURES += " x86 pci efi"
# tpm2 in MACHINE_FEATURES (not just DISTRO_FEATURES) so OVMF is built with its
# TCG2/TPM driver (PACKAGECONFIG tpm -> TPM_ENABLE=TRUE). Without it OVMF never
# does TPM2_Startup or measures PCRs, the kernel sees an un-started TPM, and the
# cryptsetup-var PCR-7 enroll fails.
MACHINE_FEATURES += " tpm2"
DISTRO_FEATURES += " tpm2"

# tpm2 is requested unconditionally two lines above, on every build of this
# machine - not opt-in via a kas feature. So this declaration is load-bearing
# for every qemux86-64 build, not just an encrypted-var one: once
# avocado-security-capabilities.bbclass flips to refuse-on-absent, an
# unmigrated machine with an unconditional DISTRO_FEATURES request would fail
# outright, on every build, with no way to opt out. No optee/optee-ftpm here
# (that route is OP-TEE TrustZone, ARM-only) - this machine's TPM2 is the
# real/virtual device route via OVMF+swtpm, requested as tpm2, not ftpm.
AVOCADO_SECURITY_CAPABILITIES = "encrypted-var tpm2"

# /var is a LUKS2 container that cryptsetup-var.service formats (first boot) and
# opens in the initramfs. Mount /var from the dm-crypt mapper rather than the raw
# partition: var.mount then implicitly orders after dev-mapper-var.device, which
# only appears once cryptsetup-var has opened the container - so the mount waits
# for the unlock instead of racing it and dropping to emergency mode.
AVOCADO_VAR_PART_DEV = "${@bb.utils.contains('DISTRO_FEATURES', 'encrypted-var', '/dev/mapper/var', '/dev/disk/by-partlabel/var', d)}"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "v86d"

MACHINE_EXTRA_RRECOMMENDS = "kernel-module-snd-ens1370 kernel-module-snd-rawmidi"

# UEFI boot via systemd-boot + OVMF, mirroring the real avocado-x86-64 (Intel)
# target. This replaces the previous U-Boot setup: qemux86-64 is meant to stand
# in for x86-64 hardware, which boots UEFI, and PCR 7 (the LUKS TPM2 seal policy)
# only measures Secure Boot state under UEFI firmware.
EFI_PROVIDER = "systemd-boot"
# cryptsetup-plugins builds systemd's libcryptsetup-token-systemd-tpm2.so, which
# "cryptsetup open --token-only" needs to reopen the TPM2-sealed /var on reboot.
# (systemd-cryptenroll can enroll the token without it, but the reopen handler is
# a separate libcryptsetup plugin; without it the reopen falls back to Argon2id.)
PACKAGECONFIG:append:pn-systemd = " tpm2 cryptsetup-plugins"

# barebox is a feed-compatible bootloader recipe, but with MACHINE_FEATURES
# 'efi' (above) its build emits barebox.efi, which fails objcopy in this
# toolchain. qemux86-64 boots via systemd-boot + OVMF and never uses barebox.
# BBMASK is set from kas/machine/qemux86-64.yml's local_conf_header instead of
# here: BBMASK is parsed globally regardless of which file sets it, but a
# machine .conf is shared by anything that includes it (e.g. a multiconfig
# build also targeting a barebox machine), while the kas local_conf_header is
# scoped to this one machine's own build invocation.
