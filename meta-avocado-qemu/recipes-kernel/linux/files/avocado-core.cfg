CONFIG_OVERLAY_FS=y
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_ZIP=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y
CONFIG_BLK_DEV_LOOP=y
# SquashFS configuration
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_FILE_CACHE=y
# CONFIG_SQUASHFS_DECOMP_SINGLE is not set
CONFIG_SQUASHFS_DECOMP_MULTI=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_LZ4=n
CONFIG_SQUASHFS_LZO=n
CONFIG_SQUASHFS_XZ=n
CONFIG_SQUASHFS_ZSTD=y
CONFIG_SQUASHFS_4K_DEVBLK_SIZE=y
# CONFIG_SQUASHFS_EMBEDDED is not set
CONFIG_SQUASHFS_FRAGMENT_CACHE_SIZE=3
CONFIG_CRYPTO_LZ4=m
CONFIG_ZRAM=m
CONFIG_NO_HZ_IDLE=y
# cpuidle: prefer the TEO governor over the legacy menu heuristics. TEO is built
# for NO_HZ_IDLE/tickless guests and commits to deep idle states more accurately,
# so under HVF/KVM the vCPU stays in PSCI CPU_SUSPEND instead of shallow-spinning.
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_GOV_TEO=y
# CONFIG_CPU_IDLE_GOV_MENU is not set
