# Container networking
CONFIG_BRIDGE=m
CONFIG_BRIDGE_NETFILTER=m

# BPF cgroup device controller: on cgroup v2, runc/docker gate per-container
# device access with a BPF_CGROUP_DEVICE program, so without BPF_SYSCALL +
# CGROUP_BPF container start fails at runc create with:
#   bpf_prog_query(BPF_CGROUP_DEVICE) failed: function not implemented
# Container Dev Mode's documented happy path is a QEMU target, so it needs these.
# Deps: BPF_SYSCALL selects BPF; CGROUP_BPF depends on BPF_SYSCALL.
CONFIG_BPF_SYSCALL=y
CONFIG_CGROUP_BPF=y
# Optional throughput optimization (a BPF_CGROUP_DEVICE program runs fine under
# the interpreter); not required for the fix.
CONFIG_BPF_JIT=y

CONFIG_WIREGUARD=m

# USB Serial Adapters
CONFIG_USB_SERIAL=m
# The common-pc BSP enables CONFIG_USB_SERIAL_CONSOLE=y, but that option
# depends on USB_SERIAL=y (built-in). We ship USB serial as a module, so the
# console variant is unassignable and silently drops to n, which trips
# do_kernel_configcheck. Disable it explicitly to match our modular choice
# (qemu/VM targets use the virtio/ttyS console, not a USB serial console).
# CONFIG_USB_SERIAL_CONSOLE is not set
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m

# USB CDC device classes (board programming over USB: fastboot/DFU hosts,
# uuu/ums Ethernet-over-USB, modem-like ACM consoles)
CONFIG_USB_ACM=m
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m

CONFIG_NET_9P=m
CONFIG_NET_9P_VIRTIO=m
CONFIG_9P_FS=m
CONFIG_USBIP_CORE=m
CONFIG_USBIP_VHCI_HCD=m

CONFIG_USB_STORAGE=m
CONFIG_BLK_DEV_LOOP=m
