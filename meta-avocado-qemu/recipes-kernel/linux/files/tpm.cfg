CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_TCG_TIS_CORE=y
CONFIG_SECURITYFS=y
# Do not feed the kernel entropy pool from the TPM. Under emulation the swtpm is
# slow, and the kernel hwrng kthread holds the per-chip tpm_mutex across a
# continuous GetRandom loop while seeding the pool. That starves
# systemd-cryptenroll's PCR-7 seal in the initramfs: its CreatePrimary never
# acquires the TPM and the first-boot enroll hangs forever. x86 seeds the CRNG
# from RDRAND (random.trust_cpu) anyway, so the TPM is not needed for entropy.
# CONFIG_HW_RANDOM_TPM is not set
