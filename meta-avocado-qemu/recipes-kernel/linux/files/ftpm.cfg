CONFIG_TCG_TPM=y
# Keep the (slow, emulated OP-TEE) fTPM out of the kernel hwrng pool: the hwrng
# kthread would hold tpm_mutex across a continuous GetRandom loop and starve
# systemd-cryptenroll's PCR-7 seal in the initramfs. See tpm.cfg for details.
# CONFIG_HW_RANDOM_TPM is not set
# CONFIG_TCG_TIS is not set
# CONFIG_TCG_TIS_I2C_CR50 is not set
# CONFIG_TCG_TIS_I2C_ATMEL is not set
# CONFIG_TCG_TIS_I2C_INFINEON is not set
# CONFIG_TCG_TIS_I2C_NUVOTON is not set
# CONFIG_TCG_ATMEL is not set
# CONFIG_TCG_INFINEON is not set
# CONFIG_TCG_CRB is not set
# CONFIG_TCG_VTPM_PROXY is not set
CONFIG_TCG_FTPM_TEE=y
# CONFIG_TCG_TIS_ST33ZP24_I2C is not set
# CONFIG_TRUSTED_KEYS is not set
CONFIG_CRYPTO_HASH_INFO=y
