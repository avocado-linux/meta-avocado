# UEFI boot support for qemux86-64 (systemd-boot + OVMF), mirroring the avocado
# x86-64 (Intel) target. Replaces the previous U-Boot + sd-card boot path.

# ACPI is mandatory for EFI on x86-64 (linux-yocto BSP metadata may disable it).
CONFIG_ACPI=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=y
CONFIG_ACPI_PROCESSOR=y

# EFI / systemd-boot (the kernel is loaded as an EFI stub image by systemd-boot).
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_RUNTIME_MAP=y
CONFIG_EFIVAR_FS=y
CONFIG_EFI_MIXED=y
CONFIG_EFI_PARTITION=y

# Early console over the EFI framebuffer / serial (earlycon, debugging boot).
CONFIG_SERIAL_EARLYCON=y
CONFIG_EFI_EARLYCON=y
CONFIG_EARLY_PRINTK=y

# Framebuffer + VT console so the EFI console and tty0 work.
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FB_SIMPLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_DRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_SIMPLEDRM=y

# Root disk: virtio-blk is the qemu boot disk (/dev/vda); keep AHCI/SATA as a
# fallback so an -device ahci attach also works.
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_GENERIC=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
