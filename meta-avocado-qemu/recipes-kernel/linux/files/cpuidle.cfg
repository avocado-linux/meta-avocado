# arm64 QEMU virt idle + tick tuning (HVF/KVM).
#
# PSCI cpuidle: the QEMU virt machine exposes PSCI to the guest, so this driver
# binds and registers real idle states. Without it the idle loop falls back to a
# bare wfi tight loop that traps straight back out to the host accelerator,
# burning a host core per vCPU. ARM-only, so kept out of the shared core fragment.
CONFIG_ARM_PSCI_CPUIDLE=y

# Lower the timer tick from 250 to 100 Hz. NO_HZ_IDLE means a fully idle CPU has
# no tick at all, but any background work restarts the tick at HZ; 100 Hz cuts
# those timer-driven VM exits ~60% under light load. Coarser scheduling
# granularity is fine for a dev VM.
CONFIG_HZ_100=y
# CONFIG_HZ_250 is not set
